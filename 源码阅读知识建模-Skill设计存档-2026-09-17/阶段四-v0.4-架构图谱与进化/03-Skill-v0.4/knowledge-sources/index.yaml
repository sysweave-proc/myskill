version: 0.4.0
name: source-reading-knowledge-sources
purpose: Curated external resources that teach the skill methodology, notation, rendering, source-analysis techniques, language/system
  semantics, and mature project documentation practices.
policy:
  source_of_truth:
    target_repository_facts: target_source_code
    target_project_behavior: target_source_code_plus_official_project_docs
    notation_semantics: registered_standards_or_methodology
    renderer_capabilities: official_tool_docs
  priority:
  - target_repository_and_project_docs
  - standards_or_original_methodology
  - official_tool_docs
  - mature_project_examples
  - books_and_textbooks
  - community_material
  external_sources_may:
  - define notation semantics
  - teach methodology
  - provide examples and anti-patterns
  - suggest analysis techniques
  - establish tool capabilities
  external_sources_may_not:
  - override target repository facts
  - prove target source behavior without target evidence
  - turn renderer syntax into a formal notation by resemblance alone
resource_schema:
  required:
  - id
  - name
  - category
  - authority
  - url
  - verification
  - teaches
  - query_when
  - do_not_use_when
  - direct_fact_scope
  - extract_to_rules
  categories:
  - methodology
  - standard
  - renderer
  - analysis_tool
  - project_example
  - language_semantics
  - archival
resources:
- id: uml-omg
  name: OMG UML
  category: standard
  authority: Tier-1
  url: https://www.omg.org/spec/UML/About-UML/
  verification: verified-for-registry-v0.4
  teaches: UML semantics and diagram vocabulary
  query_when: When choosing or checking Class, Sequence, State, Activity, Component, Deployment semantics
  do_not_use_when: Do not use to infer target-code facts
  direct_fact_scope: Defines UML notation semantics; not target-code behavior
  extract_to_rules:
  - formal_notation_guard
  - view_semantics
- id: iso-42010
  name: ISO/IEC/IEEE 42010
  category: standard
  authority: Tier-1
  url: https://www.iso.org/standard/74393.html
  verification: verified-for-registry-v0.4
  teaches: 'Architecture description concepts: concern, viewpoint, view, architecture description'
  query_when: When designing architecture viewpoints or distinguishing architecture concerns
  do_not_use_when: Do not use it as a source of implementation facts
  direct_fact_scope: Architecture description methodology/vocabulary
  extract_to_rules:
  - concern_viewpoint_rule
  - architecture_description_guard
- id: sei-vab
  name: SEI Views and Beyond
  category: methodology
  authority: Tier-1
  url: https://www.sei.cmu.edu/library/views-and-beyond-collection/
  verification: verified-for-registry-v0.4
  teaches: View selection, documentation structure, cross-view consistency
  query_when: When deciding which architecture views to document
  do_not_use_when: Not a source of C/C++ runtime truth
  direct_fact_scope: Architecture documentation method
  extract_to_rules:
  - view_selection
  - view_completeness
- id: c4model
  name: C4 Model
  category: methodology
  authority: Tier-1
  url: https://c4model.com/
  verification: verified-for-registry-v0.4
  teaches: Hierarchical architecture visualization and zoom levels
  query_when: When creating system/container/component/code-oriented architecture views
  do_not_use_when: Do not force all four levels or treat them as source truth
  direct_fact_scope: Architecture abstraction and view selection
  extract_to_rules:
  - control_abstraction_depth
  - one_model_multiple_views
- id: arc42
  name: arc42
  category: methodology
  authority: Tier-2
  url: https://docs.arc42.org/
  verification: verified-for-registry-v0.4
  teaches: Practical structure for architecture documentation
  query_when: When organizing a larger documentation set and cross-cutting concepts
  do_not_use_when: Do not force a section into a source-reading note if the concern is absent
  direct_fact_scope: Document section selection
  extract_to_rules:
  - section_selection
  - cross_cutting_concepts
- id: yourdon-constantine
  name: Yourdon/Constantine Structured Design
  category: methodology
  authority: Tier-1
  url: https://vtda.org/books/Computing/Programming/StructuredDesign_EdwardYourdonLarryConstantine.pdf
  verification: verified-for-registry-v0.4
  teaches: Structure charts and distinction from control/data flow
  query_when: When distinguishing modular structure from execution flow
  do_not_use_when: Historical material; do not treat every legacy convention as mandatory today
  direct_fact_scope: structure_vs_control_flow
  extract_to_rules:
  - structure_vs_control_flow
  - module_decomposition
- id: nassi-shneiderman
  name: Nassi-Shneiderman / Structured Programming
  category: methodology
  authority: Tier-1
  url: https://www.cs.umd.edu/~ben/publications.html
  verification: verified-for-registry-v0.4
  teaches: Structured sequence/selection/iteration representations
  query_when: When structured control composition is the learning target
  do_not_use_when: Not suitable for arbitrary cross-jump or system architecture views
  direct_fact_scope: structured_flow
  extract_to_rules:
  - structured_flow
- id: jsp
  name: Jackson Structured Programming
  category: methodology
  authority: Tier-1
  url: https://link.springer.com/book/10.1007/978-1-349-22081-6
  verification: verified-for-registry-v0.4
  teaches: Data-structure-first program structuring
  query_when: When data structure strongly determines control/program structure
  do_not_use_when: Do not assume modern systems were designed using JSP
  direct_fact_scope: data_structure_first
  extract_to_rules:
  - data_structure_first
- id: hipo
  name: IBM HIPO archival material
  category: archival
  authority: Tier-2
  url: https://www.bitsavers.org/pdf/ibm/generalInfo/GC20-1850-0_Improved_Programming_Technologies_-_An_Overview_1st_ed_197410.pdf
  verification: verified-for-registry-v0.4
  teaches: Hierarchy + Input/Process/Output
  query_when: When documenting legacy function hierarchies and IPO
  do_not_use_when: Legacy projects where the method adds unnecessary ceremony
  direct_fact_scope: Legacy methodology
  extract_to_rules:
  - legacy_hipo_trigger
- id: mermaid
  name: Mermaid
  category: renderer
  authority: Tier-2
  url: https://mermaid.js.org/intro/syntax-reference.html
  verification: verified-for-registry-v0.4
  teaches: Text-based diagram rendering in Markdown
  query_when: When a conceptual/versionable diagram is sufficient
  do_not_use_when: Do not use as a substitute for formal semantics or exact static-analysis output
  direct_fact_scope: Renderer syntax/capabilities
  extract_to_rules:
  - renderer_capability
  - mermaid_selection
- id: plantuml
  name: PlantUML
  category: renderer
  authority: Tier-2
  url: https://plantuml.com/
  verification: verified-for-registry-v0.4
  teaches: Text-based UML-oriented rendering
  query_when: When UML-like diagrams need more formal notation support than Mermaid
  do_not_use_when: Do not treat renderer support as proof of formal conformance
  direct_fact_scope: UML rendering
  extract_to_rules:
  - renderer_fallback
- id: graphviz
  name: Graphviz
  category: renderer
  authority: Tier-2
  url: https://graphviz.org/documentation/
  verification: verified-for-registry-v0.4
  teaches: Graph layout, especially directed graphs
  query_when: When graph size/layout becomes the problem
  do_not_use_when: Do not use to infer graph semantics
  direct_fact_scope: Graph rendering only
  extract_to_rules:
  - graph_layout_escalation
- id: structurizr
  name: Structurizr
  category: renderer
  authority: Tier-2
  url: https://docs.structurizr.com/
  verification: verified-for-registry-v0.4
  teaches: Model-as-code with multiple views; C4-oriented patterns
  query_when: When one architecture model must drive multiple views
  do_not_use_when: Do not use as target-code semantic proof
  direct_fact_scope: Model/view separation
  extract_to_rules:
  - one_model_multiple_views
- id: clang-ast
  name: Clang AST / LibTooling
  category: analysis_tool
  authority: Tier-2
  url: https://clang.llvm.org/docs/LibASTMatchers.html
  verification: verified-for-registry-v0.4
  teaches: Semantic C/C++ AST matching and source locations
  query_when: When grep/text matching is insufficient for type/symbol/source relationships
  do_not_use_when: AST does not by itself establish runtime ownership semantics
  direct_fact_scope: Semantic source extraction
  extract_to_rules:
  - semantic_source_extraction
  - source_anchor_precision
- id: clang-dataflow
  name: Clang Dataflow
  category: analysis_tool
  authority: Tier-2
  url: https://clang.llvm.org/docs/DataFlowAnalysisIntro.html
  verification: verified-for-registry-v0.4
  teaches: Static dataflow analysis concepts and tooling
  query_when: When source-level dataflow/analysis precision matters
  do_not_use_when: Do not treat static possibilities as observed runtime execution
  direct_fact_scope: Dataflow analysis
  extract_to_rules:
  - analysis_backend_selection
- id: codeql-cpp
  name: CodeQL for C/C++
  category: analysis_tool
  authority: Tier-2
  url: https://codeql.github.com/docs/codeql-language-guides/codeql-for-cpp/
  verification: verified-for-registry-v0.4
  teaches: AST, control flow, dataflow and queryable source relationships
  query_when: When exact source-graph or dataflow queries are needed
  do_not_use_when: CodeQL findings still require interpretation in target context
  direct_fact_scope: Source analysis queries
  extract_to_rules:
  - analysis_backend_selection
  - pointer_semantics_guard
- id: doxygen
  name: Doxygen
  category: analysis_tool
  authority: Tier-2
  url: https://www.doxygen.nl/
  verification: verified-for-registry-v0.4
  teaches: Generated documentation and call/dependency graphs
  query_when: For fast source orientation and generated graph candidates
  do_not_use_when: Generated call graphs are not automatically runtime flow
  direct_fact_scope: Generated graph as input
  extract_to_rules:
  - generated_graph_as_input
- id: sourcegraph
  name: Sourcegraph
  category: analysis_tool
  authority: Tier-2
  url: https://sourcegraph.com/docs
  verification: verified-for-registry-v0.4
  teaches: Large-repository code navigation and search
  query_when: When symbol navigation/search at repository scale is needed
  do_not_use_when: Tool index is navigation aid, not semantic truth
  direct_fact_scope: Repository navigation
  extract_to_rules:
  - navigation_backend
- id: cpp-guidelines
  name: C++ Core Guidelines
  category: language_semantics
  authority: Tier-1
  url: https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines
  verification: verified-for-registry-v0.4
  teaches: Ownership vocabulary, RAII, pointer/reference guidance
  query_when: When reasoning about generic C++ ownership/lifetime concepts
  do_not_use_when: Never override target-project behavior or infer ownership from a raw pointer
  direct_fact_scope: Language guardrails
  extract_to_rules:
  - ownership_guardrail
  - lifetime_vocabulary
- id: linux-locking
  name: Linux Kernel Locking Documentation
  category: project_example
  authority: Tier-2
  url: https://www.kernel.org/doc/html/latest/locking/index.html
  verification: verified-for-registry-v0.4
  teaches: Real-world lock semantics, lock types, locking rules
  query_when: When learning concurrency documentation patterns or Linux locking concepts
  do_not_use_when: Do not directly transfer Linux lock semantics to PostgreSQL/MySQL
  direct_fact_scope: Concurrency semantics and examples
  extract_to_rules:
  - concurrency_guardrail
- id: lkmm
  name: Linux Kernel Memory Model
  category: project_example
  authority: Tier-2
  url: https://docs.kernel.org/dev-tools/lkmm/index.html
  verification: verified-for-registry-v0.4
  teaches: Memory ordering, barriers, litmus-style reasoning
  query_when: When analyzing low-level atomic/order constraints
  do_not_use_when: Only relevant when memory ordering is actually part of the topic
  direct_fact_scope: Ordering guardrail
  extract_to_rules:
  - memory_ordering_guardrail
- id: postgres-coding
  name: PostgreSQL Developer / Coding
  category: project_example
  authority: Tier-2
  url: https://www.postgresql.org/developer/coding/
  verification: verified-for-registry-v0.4
  teaches: Project-native source navigation and backend flowchart examples
  query_when: When building a PostgreSQL System Atlas or source-reading navigation
  do_not_use_when: PostgreSQL-specific patterns should not be generalized blindly to other systems
  direct_fact_scope: Project-specific navigation
  extract_to_rules:
  - project_specific_source_navigation

