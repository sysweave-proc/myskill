l\",\"wva4wq\",\"wch77e\",\"fm0dpl\",\"4ybwzq\",\"f5vk5k\",\"b05jmh\",\"ymqhyg\",\"tkqrew\",\"l77yje\",\"6x7i0k\",\"3d0o5w\",\"1skwkp\",\"zgrabc\",\"96hrhq\",\"eas1sl\",\"4rykte\",\"qrnbqp\",\"48qtfa\",\"ovjn04\",\"7vttuf\",\"enzq34\",\"ygp378\",\"e0evj5\",\"b7bfba\",\"5iofk9\",\"r57sht\",\"866x48\",\"4hjt25\",\"jik5ar\",\"fetsgg\",\"7p101j\",\"1iqm67\",\"isncvw\",\"unpsuq\",\"l3jss3\",\"9kxy90\",\"yotl5x\",\"3lrpq6\",\"4ya03w\",\"o0snl9\",\"81suep\",\"90c4mt\",\"fl49fc\",\"dpr4qh\",\"bgzxmv\",\"2c2qp3\",\"vz6dja\",\"o5g41q\",\"q10hvk\",\"tas2ng\",\"relwjy\",\"t1qchd\",\"ycfcyo\",\"zrvk7t\",\"a6eag5\",\"928avq\",\"maobaj\",\"trsqlt\",\"vlkq0t\",\"dsjoie\",\"q6kmxd\",\"cj4ywv\",\"ftlk2c\",\"3cl7h0\",\"c6m5nd\",\"5wjpxv\",\"io1z2n\",\"oxy7sh\",\"1zgb8f\",\"vhmirv\",\"nld8eq\",\"5usz59\",\"a3zc7c\",\"n5ipyb\",\"cb9bsd\",\"rw2bgg\",\"fd8iba\",\"snlxuq\",\"qis35s\",\"c280br\",\"rx2yqg\",\"gj7tos\",\"4uz0r4\",\"g3qgu0\",\"beywlq\",\"45y3mb\",\"0fsds2\",\"t0rmvd\",\"6yaoog\",\"gpg2rr\",\"if1g33\",\"3nx03f\",\"r07yzq\",\"qnh61r\",\"c99oe9\",\"rgd1zk\",\"hdqws3\",\"sfthen\",\"ur8ki6\",\"vhuin0\",\"34ipkb\",\"kgji2n\",\"rgjyot\",\"4jvqzi\",\"g6jq1x\",\"j47srf\",\"bs5gzb\",\"j5v5oj\",\"bp1r2l\",\"18ffy9\",\"96ojm6\",\"cf1zpn\",\"8pc5nl\",\"vqwpqj\",{\"_50\":1792,\"_1793\":1794,\"_1795\":1796,\"_1797\":1798,\"_47\":1794,\"_1799\":1794},\"followup_a\",\"matched_text\",\"定义 Document Generation Specification\",\"start_idx\",18329,\"end_idx\",18365,\"prompt_text\",[244],[1802],\"我建议把 Step 4 定义得比“源码落脚点”更严格一些：\\n\\n\u003e **Source Traceability = 知识结论与源码证据之间的可验证映射。**\\n\\n它需要同时解决四件事：\\n\\n```text id=\\\"x4j7s2\\\"\\n知识从哪里来？\\n↓\\n具体落在哪个 Symbol / Field / Call Site？\\n↓\\n需要沿哪些代码路径才能证明？\\n↓\\n哪些是源码事实，哪些是 Agent 推导？\\n```\\n\\n这样后面的 Skill 才能做到“**跟着笔记读代码**”。\\n\\n:::writing{variant=\\\"document\\\" id=\\\"61483\\\" title=\\\"大型 C/C++ 项目源码追踪与证据链规范 v0.1\\\"}\\n\\n# 大型 C/C++ 项目源码追踪与证据链规范 v0.1\\n\\n## 1. 目标\\n\\n本规范定义源码阅读知识与源代码之间的追踪机制。\\n\\n目标不是简单地给段落加：\\n\\n```text\\nfile.c:123\\n```\\n\\n而是建立完整的：\\n\\n```text id=\\\"qyq8rm\\\"\\nKnowledge\\n   ↓\\nClaim\\n   ↓\\nEvidence\\n   ↓\\nSource Location\\n   ↓\\nCode Relationship\\n```\\n\\n使读者可以从：\\n\\n```text\\n“为什么这么说？”\\n```\\n\\n一路追到：\\n\\n```text\\n“源码究竟在哪里证明了这一点？”\\n```\\n\\n---\\n\\n# 2. 核心原则\\n\\n## 2.1 每个重要结论都必须可追踪\\n\\n例如文档中写：\\n\\n\u003e `BufferDesc.state` 用于维护 buffer header 的状态。\\n\\n不能只写这句话。\\n\\n至少应该能够追踪到：\\n\\n```text id=\\\"gqp2v7\\\"\\nClaim\\n  ↓\\nBufferDesc.state\\n  ↓\\n定义位置\\n  +\\n读取位置\\n  +\\n修改位置\\n```\\n\\n如果“状态”的含义来自多个宏、多个函数，则还需要：\\n\\n```text id=\\\"1j26qs\\\"\\nstate\\n ├── definition\\n ├── read sites\\n ├── write sites\\n └── interpretation\\n```\\n\\n---\\n\\n# 3. Traceability 的最小对象\\n\\n源码追踪模型定义 5 个基本元素：\\n\\n```text id=\\\"zv0orp\\\"\\nSource\\nSymbol\\nEvidence\\nClaim\\nTrace\\n```\\n\\n---\\n\\n# 4. Source\\n\\nSource 表示源码文件本身。\\n\\n标准信息：\\n\\n```text id=\\\"5a2l0w\\\"\\nRepository\\nRevision\\nPath\\nLanguage\\nModule\\n```\\n\\n例如：\\n\\n```text id=\\\"n3g4qx\\\"\\nRepository:\\n    PostgreSQL\\n\\nRevision:\\n    \u003ccommit/tag\u003e\\n\\nPath:\\n    src/backend/storage/buffer/bufmgr.c\\n\\nModule:\\n    Buffer Manager\\n```\\n\\n---\\n\\n## 4.1 必须记录版本\\n\\n大型项目持续演进，因此：\\n\\n```text id=\\\"y7w2bq\\\"\\nfile.c:123\\n```\\n\\n本身并不稳定。\\n\\n同一个位置在不同版本可能完全不同。\\n\\n因此源码追踪应优先绑定：\\n\\n```text id=\\\"4s4e4m\\\"\\nRepository\\n+\\nRevision / Commit / Tag\\n+\\nPath\\n+\\nSymbol\\n```\\n\\n而不是只绑定行号。\\n\\n---\\n\\n# 5. Symbol\\n\\nSymbol 是最重要的源码定位单位。\\n\\n包括：\\n\\n```text id=\\\"rk0d9r\\\"\\nFunction\\nStruct\\nClass\\nField\\nEnum\\nMacro\\nVariable\\nTypedef\\nMethod\\nNamespace\\n```\\n\\n推荐：\\n\\n```text id=\\\"zlf7qk\\\"\\nSymbol {\\n    name\\n    kind\\n    file\\n    scope\\n    declaration\\n    definition\\n}\\n```\\n\\n例如：\\n\\n```text id=\\\"p7wggk\\\"\\nSymbol:\\n    BufferAlloc\\n\\nKind:\\n    Function\\n\\nFile:\\n    bufmgr.c\\n```\\n\\n---\\n\\n# 6. Evidence\\n\\nEvidence 是“支持某个结论的源码事实”。\\n\\n它不是简单的代码位置。\\n\\n例如：\\n\\n```text id=\\\"mc3gwv\\\"\\nEvidence:\\n    BufferAlloc() checks strategy != NULL\\n```\\n\\n对应源码：\\n\\n```text id=\\\"l9lzs9\\\"\\nbufmgr.c\\nBufferAlloc()\\nif (strategy != NULL)\\n    ...\\n```\\n\\nEvidence 本身应回答：\\n\\n\u003e **源码究竟展示了什么？**\\n\\n而不是直接写解释。\\n\\n---\\n\\n# 7. Claim\\n\\nClaim 是文档中的一个知识结论。\\n\\n例如：\\n\\n```text id=\\\"2r3w5p\\\"\\nClaim:\\n    BufferAlloc() 在存在 Strategy 时优先使用指定的\\n    replacement 策略。\\n```\\n\\n这就是一个 Claim。\\n\\n---\\n\\n# 8. Claim 与 Evidence 必须分离\\n\\n例如：\\n\\n```text id=\\\"8t4wbx\\\"\\nClaim:\\n    这里是为了减少共享竞争。\\n\\nEvidence:\\n    多个 backend 对 partition lock 进行访问。\\n```\\n\\n前者可能是：\\n\\n```text id=\\\"78scfh\\\"\\nINFERENCE / INTERPRETATION\\n```\\n\\n后者是：\\n\\n```text id=\\\"y87r4h\\\"\\nFACT\\n```\\n\\n两者不能混成一个“源码事实”。\\n\\n---\\n\\n# 9. Trace\\n\\nTrace 表示：\\n\\n\u003e **为了证明一个 Claim，需要沿源码跨越哪些节点。**\\n\\n例如：\\n\\n```text id=\\\"1ll4rh\\\"\\nClaim:\\n    TupleTableSlot 可以复用已有 tuple storage\\n\\nTrace:\\n    ExecStoreHeapTuple()\\n        ↓\\n    slot-\u003etts_tuple\\n        ↓\\n    MakeExpandedObjectReadOnly()\\n        ↓\\n    subsequent executor access\\n```\\n\\nTrace 与单点 Evidence 的区别：\\n\\n```text id=\\\"z0pwki\\\"\\nEvidence:\\n    一个局部事实\\n\\nTrace:\\n    多个事实组成的证明路径\\n```\\n\\n---\\n\\n# 10. Source Anchor 的等级体系\\n\\n源码落点应该分成 5 个层级。\\n\\n```text id=\\\"s5az8c\\\"\\nL1 File\\nL2 Symbol\\nL3 Code Region\\nL4 Field / Expression\\nL5 Relationship Trace\\n```\\n\\n---\\n\\n## L1 File\\n\\n例如：\\n\\n```text id=\\\"xq6mzf\\\"\\nbufmgr.c\\n```\\n\\n作用：\\n\\n\u003e 告诉读者知识大致属于哪个实现模块。\\n\\n仅适合粗粒度说明。\\n\\n---\\n\\n## L2 Symbol\\n\\n例如：\\n\\n```text id=\\\"c2qk7l\\\"\\nBufferAlloc()\\n```\\n\\n这是默认应该优先使用的层级。\\n\\n因为 Symbol 比行号稳定，也比文件更有语义。\\n\\n---\\n\\n## L3 Code Region\\n\\n例如：\\n\\n```text id=\\\"3u0vns\\\"\\nBufferAlloc()\\n    ├── lookup existing buffer\\n    ├── choose victim\\n    └── initialize descriptor\\n```\\n\\n表示函数中的具体逻辑区域。\\n\\n---\\n\\n## L4 Field / Expression\\n\\n例如：\\n\\n```text id=\\\"r6d5f0\\\"\\nBufferDesc.state\\nBufTagGetBlockNumber(tag)\\nlocal-\u003enLocks\\n```\\n\\n用于解释：\\n\\n```text id=\\\"z2j9lv\\\"\\n某个状态\\n某个关键数据\\n某个条件\\n```\\n\\n---\\n\\n## L5 Relationship Trace\\n\\n例如：\\n\\n```text id=\\\"rfzpl4\\\"\\nBufferTag\\n   ↓ hash\\nBufTable\\n   ↓ bucket\\nBufferDesc\\n   ↓\\nstate\\n```\\n\\n这是最高价值的追踪形式。\\n\\n因为它不是简单定位，而是：\\n\\n\u003e **把知识模型中的 Relation 映射到真实源码。**\\n\\n---\\n\\n# 11. 追踪不应依赖行号\\n\\n推荐优先级：\\n\\n```text id=\\\"oyh5y1\\\"\\nRepository + Revision\\n    ↓\\nFile\\n    ↓\\nSymbol\\n    ↓\\nField / Expression\\n    ↓\\nLine Range\\n```\\n\\n行号是最后的辅助信息。\\n\\n原因：\\n\\n```text id=\\\"t9u1pe\\\"\\n代码插入一行\\n→ 行号改变\\n\\nSymbol:\\n    通常仍然存在\\n```\\n\\n因此文档应尽量写：\\n\\n```text id=\\\"8m2x4r\\\"\\nBufferAlloc()\\n```\\n\\n而不是：\\n\\n```text id=\\\"d4c8kn\\\"\\nbufmgr.c:1843\\n```\\n\\n---\\n\\n# 12. Trace 的方向\\n\\n一个知识点可能有不同方向。\\n\\n## Definition Trace\\n\\n```text id=\\\"m0htd4\\\"\\nConcept\\n ↓\\nDefinition\\n```\\n\\n例如：\\n\\n```text\\nBufferDesc\\n ↓\\nbuf_internals.h\\n```\\n\\n---\\n\\n## Usage Trace\\n\\n```text id=\\\"5i2x6t\\\"\\nDefinition\\n ↓\\nReaders\\n```\\n\\n例如：\\n\\n```text\\nBufferDesc.state\\n ↓\\nLockBufHdr()\\n ↓\\nRead state\\n```\\n\\n---\\n\\n## Mutation Trace\\n\\n```text id=\\\"f7q5e6\\\"\\nField\\n ↓\\nWriters\\n```\\n\\n例如：\\n\\n```text\\nstate\\n ↓\\nLockBufHdr()\\n ↓\\nstate |= BM_VALID\\n```\\n\\n---\\n\\n## Call Trace\\n\\n```text id=\\\"1f8z3k\\\"\\nFunction A\\n ↓ calls\\nFunction B\\n ↓ calls\\nFunction C\\n```\\n\\n---\\n\\n## Data Trace\\n\\n```text id=\\\"49bqsk\\\"\\nObject A\\n ↓\\nfield\\n ↓\\nobject B\\n```\\n\\n---\\n\\n## Synchronization Trace\\n\\n```text id=\\\"qjqu97\\\"\\nShared Object\\n ↑\\nprotected by\\n ↑\\nLock\\n ↑\\nacquired in\\n ↑\\nFunction\\n```\\n\\n---\\n\\n# 13. 追踪必须区分“定义”和“行为”\\n\\n例如：\\n\\n```c id=\\\"5q6g6v\\\"\\ntypedef struct BufferDesc\\n{\\n    BufferTag tag;\\n    pg_atomic_uint32 state;\\n    LWLock content_lock;\\n} BufferDesc;\\n```\\n\\n这里只证明：\\n\\n```text id=\\\"z1b2t3\\\"\\nBufferDesc 有三个字段\\n```\\n\\n并不能单独证明：\\n\\n```text id=\\\"7s2x9c\\\"\\nstate 是什么语义\\ncontent_lock 保护什么\\n```\\n\\n后两者需要继续追踪：\\n\\n```text id=\\\"8jvl8a\\\"\\nfield definition\\n   ↓\\nread sites\\n   ↓\\nwrite sites\\n   ↓\\nhelper macros\\n   ↓\\nlocking context\\n```\\n\\n---\\n\\n# 14. Field Trace 是大型 C/C++ 项目的重点\\n\\n对核心字段，Agent 应优先建立：\\n\\n```text id=\\\"fg5ljm\\\"\\nField\\n ├── declaration\\n ├── readers\\n ├── writers\\n ├── guards\\n ├── lifecycle\\n └── derived meaning\\n```\\n\\n例如：\\n\\n```text id=\\\"s7b6g3\\\"\\nBufferDesc.state\\n\\ndeclaration:\\n    buf_internals.h\\n\\nreaders:\\n    BUF_STATE_GET_REFCOUNT()\\n    ...\\n    \\nwriters:\\n    LockBufHdr()\\n    UnlockBufHdr()\\n    ...\\n\\nguards:\\n    buffer header spinlock\\n\\nmeaning:\\n    refcount + flags\\n```\\n\\n这样才真正知道一个字段是什么。\\n\\n---\\n\\n# 15. Function Trace 不应只做调用链\\n\\n对于关键函数：\\n\\n```text id=\\\"xq9b1s\\\"\\nFunction\\n ├── caller\\n ├── entry condition\\n ├── important callees\\n ├── state changes\\n ├── shared state accessed\\n ├── locks acquired\\n ├── error paths\\n └── return effects\\n```\\n\\n例如：\\n\\n```text id=\\\"9v6n3k\\\"\\nBufferAlloc()\\n\\nCallers:\\n    ReadBuffer_common()\\n\\nReads:\\n    strategy\\n    BufTable\\n\\nModifies:\\n    BufferDesc\\n\\nLocks:\\n    mapping partition lock\\n\\nState:\\n    victim → allocated\\n\\nErrors:\\n    no available buffer\\n```\\n\\n这比单纯列：\\n\\n```text\\nBufferAlloc()\\n ├── A()\\n ├── B()\\n └── C()\\n```\\n\\n有价值。\\n\\n---\\n\\n# 16. Trace Graph\\n\\n最终可以把一个知识点表示为一个小型证据图：\\n\\n```text id=\\\"c5x6y1\\\"\\n                 Claim\\n                   │\\n             supported by\\n                   ↓\\n                Evidence\\n                   │\\n             located at\\n                   ↓\\n                 Symbol\\n                   │\\n          ┌────────┼─────────┐\\n          ↓        ↓         ↓\\n       Field     Caller    Callee\\n          │\\n       modified by\\n          ↓\\n       Function\\n          │\\n       protected by\\n          ↓\\n         Lock\\n```\\n\\n这就是：\\n\\n\u003e **Knowledge Graph ↔ Source Graph 的连接层。**\\n\\n---\\n\\n# 17. FACT / INFERENCE / INTERPRETATION\\n\\n所有重要 Claim 必须标注知识性质。\\n\\n## FACT\\n\\n源码可以直接观察到。\\n\\n例如：\\n\\n```text id=\\\"g87f9k\\\"\\nFACT:\\n    BufferAlloc() calls StrategyGetBuffer()\\n```\\n\\n---\\n\\n## INFERENCE\\n\\n由多个源码事实推导。\\n\\n例如：\\n\\n```text id=\\\"wy9f7a\\\"\\nINFERENCE:\\n    这条路径绕过了默认 replacement 策略。\\n```\\n\\n前提可能来自：\\n\\n```text\\ncondition A\\n+\\ncall B\\n+\\nalternative path C\\n```\\n\\n---\\n\\n## INTERPRETATION\\n\\n对设计目的或架构意图的解释。\\n\\n例如：\\n\\n```text id=\\\"w7fbqv\\\"\\nINTERPRETATION:\\n    该机制可能是为了降低高并发场景下的共享竞争。\\n```\\n\\n除非源码注释、设计文档或明确讨论能够证明，否则不能把它写成：\\n\\n```text\\nFACT\\n```\\n\\n---\\n\\n# 18. 推导链\\n\\n当 Claim 不是直接事实时，应尽可能保留推导链：\\n\\n```text id=\\\"5g5s6u\\\"\\nFACT A\\n +\\nFACT B\\n +\\nFACT C\\n ↓\\nINFERENCE\\n```\\n\\n例如：\\n\\n```text id=\\\"9a4t2r\\\"\\nFACT:\\n    LockAcquire() 首先尝试 fast-path\\n\\nFACT:\\n    成功后无需访问主 lock table\\n\\nFACT:\\n    fast-path 的存储位置位于 PGPROC\\n\\nINFERENCE:\\n    fast-path 将部分高频锁请求从共享主表路径中移开\\n```\\n\\n读者可以重新验证这个推导。\\n\\n---\\n\\n# 19. 不允许跨越源码直接跳结论\\n\\n错误：\\n\\n```text id=\\\"exk2s4\\\"\\n看到 fast-path\\n↓\\n“这是为了性能优化”\\n```\\n\\n正确：\\n\\n```text id=\\\"xxy9p3\\\"\\n看到 fast-path\\n↓\\n检查：\\n    - 是否减少共享数据访问？\\n    - 是否减少锁竞争？\\n    - 是否改变查找路径？\\n    - 是否存在明确注释？\\n↓\\n再决定：\\n    FACT / INFERENCE / INTERPRETATION\\n```\\n\\n---\\n\\n# 20. Trace Depth\\n\\n不是所有知识都需要追到很深。\\n\\n定义三种深度。\\n\\n### D1 — Local Trace\\n\\n只追当前 Symbol。\\n\\n适合：\\n\\n```text\\n简单函数\\n字段定义\\n局部算法\\n```\\n\\n---\\n\\n### D2 — Structural Trace\\n\\n扩展到相关：\\n\\n```text\\ncaller\\ncallee\\nstruct\\nfield\\nmanager\\nlock\\n```\\n\\n适合：\\n\\n```text\\n核心对象\\n核心函数\\n普通模块\\n```\\n\\n---\\n\\n### D3 — System Trace\\n\\n跨模块、跨层次继续追踪。\\n\\n适合：\\n\\n```text\\n架构问题\\n关键数据路径\\n核心并发机制\\n跨层生命周期\\n```\\n\\n例如：\\n\\n```text id=\\\"f0j8pl\\\"\\nSQL\\n ↓\\nExecutor\\n ↓\\nTupleTableSlot\\n ↓\\nBuffer\\n ↓\\nPage\\n ↓\\nStorage\\n```\\n\\n不是每个知识点都应该走到 D3。\\n\\n---\\n\\n# 21. Trace Expansion Rule\\n\\n建议采用“按需展开”。\\n\\n```text id=\\\"u1qgh5\\\"\\n当前 Claim\\n   ↓\\n能否由当前 Symbol 直接证明？\\n   │\\n ┌─Yes──────────────→ STOP\\n │\\n No\\n ↓\\n相关 Field / Callee\\n   ↓\\n能否证明？\\n   │\\n ┌─Yes──────────────→ STOP\\n │\\n No\\n ↓\\nCaller / Manager / Lock / Lifecycle\\n   ↓\\n仍不能证明？\\n   ↓\\nCross-module / System\\n```\\n\\n也就是说：\\n\\n\u003e **不要为了显得深入而无限向外追代码。**\\n\\n追踪应以“证明 Claim”为停止条件。\\n\\n---\\n\\n# 22. Trace 的停止条件\\n\\n当满足以下条件即可停止：\\n\\n```text id=\\\"i8aq2k\\\"\\n1. Claim 已经可以被源码直接证明\\n\\n或\\n\\n2. 推导链已经闭合\\n\\n或\\n\\n3. 继续深入只会进入与当前问题无关的实现细节\\n```\\n\\n第三种情况必须记录：\\n\\n```text id=\\\"pnz6q4\\\"\\nTrace boundary\\n```\\n\\n例如：\\n\\n\u003e 本章追踪到 `smgr` 接口层为止；底层文件 I/O 实现不影响当前 Buffer Manager 语义，因此不继续展开。\\n\\n---\\n\\n# 23. Trace Boundary\\n\\n这是大型项目非常重要的概念。\\n\\n源码阅读不是：\\n\\n```text\\n把整个调用栈读到底\\n```\\n\\n而是：\\n\\n```text\\n为当前知识定义一个边界\\n```\\n\\n例如：\\n\\n```text id=\\\"1mghly\\\"\\nBuffer Manager Chapter\\n\\nInside:\\n    BufTable\\n    BufferDesc\\n    BufferAlloc\\n    PinBuffer\\n\\nBoundary:\\n    smgr API\\n\\nOutside:\\n    filesystem\\n    block device\\n    hardware\\n```\\n\\n这样文档不会无限膨胀。\\n\\n---\\n\\n# 24. Source Anchor 的显示规范\\n\\n文档中不要大量出现：\\n\\n```text id=\\\"qy5s5t\\\"\\n【源码位置：xxx】\\n```\\n\\n导致正文被打断。\\n\\n推荐三种方式。\\n\\n### Inline Anchor\\n\\n```text id=\\\"cqb6ju\\\"\\n`BufferAlloc()` 负责选择可用 buffer。\\n```\\n\\n---\\n\\n### Symbol Reference\\n\\n```text id=\\\"2a0fhg\\\"\\n源码落点：\\n\\n`BufferAlloc()`\\n→ `src/backend/storage/buffer/bufmgr.c`\\n```\\n\\n---\\n\\n### Deep Dive Anchor\\n\\n```text id=\\\"zh8n9x\\\"\\n\u003e 源码落点：`BufferAlloc()` 中的 victim selection 分支\\n```\\n\\n重点是：\\n\\n\u003e **源码落点应该成为阅读导航，而不是脚注垃圾场。**\\n\\n---\\n\\n# 25. Source Snippet 的选择规则\\n\\n源码片段只在以下情况保留：\\n\\n```text id=\\\"8c29b0\\\"\\n1. 展示核心数据结构\\n2. 展示关键分支\\n3. 展示关键状态变化\\n4. 展示关键同步操作\\n5. 展示 ownership 转移\\n6. 展示异常/清理路径\\n```\\n\\n不要为了“有源码元素”而贴：\\n\\n```c id=\\\"p2m7y3\\\"\\n整个函数\\n```\\n\\n---\\n\\n# 26. 源码片段应尽量短\\n\\n推荐：\\n\\n```text id=\\\"wl0i3a\\\"\\n5～20 行\\n```\\n\\n并突出：\\n\\n```text id=\\\"nks3f7\\\"\\n关键字段\\n关键条件\\n关键调用\\n关键状态修改\\n```\\n\\n如果一个函数有 200 行，而真正解释问题的是：\\n\\n```c id=\\\"xk8y9f\\\"\\nif (found)\\n    ...\\nelse\\n    ...\\n```\\n\\n就只截取这一局部。\\n\\n---\\n\\n# 27. “代码元素”与“代码证据”必须区分\\n\\n源码片段可以用于：\\n\\n```text\\n理解\\n```\\n\\nEvidence 用于：\\n\\n```text\\n证明\\n```\\n\\n有时候一个片段是为了帮助阅读：\\n\\n```text id=\\\"ajp0zk\\\"\\n核心结构展示\\n```\\n\\n不一定是完整证据。\\n\\n所以文档生成器不能认为：\\n\\n```text\\n出现了代码片段\\n=\\n已经完成追踪\\n```\\n\\n---\\n\\n# 28. 一个 Claim 可以有多个 Evidence\\n\\n例如：\\n\\n```text id=\\\"xj6t6b\\\"\\nClaim:\\n    content_lock 保护 buffer page content\\n```\\n\\nEvidence：\\n\\n```text id=\\\"e7v5c8\\\"\\nE1:\\n    LockBuffer()\\n\\nE2:\\n    UnlockBuffer()\\n\\nE3:\\n    Page access between the lock boundaries\\n```\\n\\n这种关系表示：\\n\\n```text id=\\\"r1kcex\\\"\\nClaim\\n ├── supported by E1\\n ├── supported by E2\\n └── supported by E3\\n```\\n\\n---\\n\\n# 29. 一个 Evidence 也可以支持多个 Claim\\n\\n例如：\\n\\n```text id=\\\"9pzkwl\\\"\\nBufferAlloc()\\n```\\n\\n可能同时支持：\\n\\n```text id=\\\"4v8m2c\\\"\\nClaim A:\\n    BufferAlloc 负责 victim selection\\n\\nClaim B:\\n    BufferAlloc 修改 BufferDesc\\n\\nClaim C:\\n    BufferAlloc 需要 mapping lock\\n```\\n\\n因此不要把 Evidence 与 Claim 做一对一绑定。\\n\\n---\\n\\n# 30. Traceability Matrix\\n\\n对于复杂章节，可以内部生成：\\n\\n| Claim | Type | Evidence | Trace Depth | Confidence |\\n|---|---|---|---|---|\\n| A 管理 B | FACT | `A-\u003eb` / manager function | D2 | High |\\n| X 在 Y 后修改 | FACT | call path + write site | D2 | High |\\n| fast path 减少共享访问 | INFERENCE | fast-path branches | D3 | Medium |\\n| 设计目标是降低竞争 | INTERPRETATION | code + comments | D3 | Medium |\\n\\n这张表不一定展示给最终读者，但应该存在于 Agent 的中间模型中。\\n\\n---\\n\\n# 31. Confidence\\n\\n建议不要只标：\\n\\n```text\\n正确 / 错误\\n```\\n\\n而是：\\n\\n```text id=\\\"7twzqj\\\"\\nHigh\\nMedium\\nLow\\n```\\n\\n## High\\n\\n源码可以直接证明。\\n\\n## Medium\\n\\n由多个源码事实稳定推导。\\n\\n## Low\\n\\n存在多种合理解释，但当前源码不足以完全确认。\\n\\nLow-confidence Claim：\\n\\n```text id=\\\"6m58rj\\\"\\n不得写成确定性语句。\\n```\\n\\n例如：\\n\\n\u003e 该路径**可能用于**降低共享竞争。\\n\\n而不是：\\n\\n\u003e 该路径**就是为了**降低共享竞争。\\n\\n---\\n\\n# 32. Comment / Documentation 也是 Evidence，但要分类\\n\\n源码中的：\\n\\n```text\\ncomment\\nassert\\nstatic_assert\\nerror message\\ndebug log\\n```\\n\\n都可能提供重要信息。\\n\\n但 Evidence 应区分：\\n\\n```text id=\\\"8f2jq9\\\"\\nCode Evidence\\nComment Evidence\\nDesign Evidence\\n```\\n\\n例如：\\n\\n```text\\nCode:\\n    实际执行路径\\n\\nComment:\\n    开发者对意图的说明\\n```\\n\\n如果两者矛盾：\\n\\n\u003e **优先记录矛盾，而不是替源码选择一个解释。**\\n\\n---\\n\\n# 33. Evidence Strength\\n\\n建议定义：\\n\\n```text id=\\\"0zj3y0\\\"\\nE1  Definition\\nE2  Direct Access\\nE3  Mutation\\nE4  Control Flow\\nE5  Cross-function Trace\\nE6  Cross-module Trace\\nE7  Comment / Design Documentation\\n```\\n\\n例如：\\n\\n```text\\n“字段存在”\\n→ E1 足够\\n\\n“字段表示某种状态”\\n→ E1 + E2 + E3\\n\\n“该机制为什么设计成这样”\\n→ 通常需要 E4～E7\\n```\\n\\n这能帮助 Agent 防止过度解读。\\n\\n---\\n\\n# 34. 如何追踪“为什么”？\\n\\n这是源码阅读中最难的问题。\\n\\n“是什么”通常比较容易：\\n\\n```text\\nBufferDesc 有 state 字段。\\n```\\n\\n“怎么做”也可以通过 Flow：\\n\\n```text\\nBufferAlloc() → ...\\n```\\n\\n但：\\n\\n\u003e **“为什么这么做？”**\\n\\n不能仅凭函数命名回答。\\n\\n推荐建立：\\n\\n```text id=\\\"8q8nq0\\\"\\nWHY Trace\\n\\nImplementation Fact\\n      ↓\\nObserved Constraint\\n      ↓\\nDesign Consequence\\n      ↓\\nPossible Motivation\\n```\\n\\n例如：\\n\\n```text\\nFACT:\\n    fast-path 减少进入主 lock table 的路径\\n\\nCONSTRAINT:\\n    大量共享主表访问会涉及共享同步\\n\\nCONSEQUENCE:\\n    部分请求可绕开该路径\\n\\nINTERPRETATION:\\n    可能用于降低高频简单锁请求的共享开销\\n```\\n\\n---\\n\\n# 35. “为什么”必须谨慎\\n\\nAgent 禁止因为：\\n\\n```text\\n代码看起来更快\\n```\\n\\n就直接写：\\n\\n```text\\n设计目的就是为了性能。\\n```\\n\\n推荐使用：\\n\\n```text\\n从实现上可以观察到……\\n这使得……\\n因此可以推断……\\n可能的设计动机是……\\n```\\n\\n除非源码注释、设计文档或明确的项目资料直接说明。\\n\\n---\\n\\n# 36. Trace 与 Pattern 的结合\\n\\n不同 Pattern 应有不同的追踪重点。\\n\\n### Structural\\n\\n追：\\n\\n```text\\ndefinition\\nfield\\npointer\\ncontainer\\nmanager\\n```\\n\\n### Lifecycle\\n\\n追：\\n\\n```text\\ncreate\\ninitialize\\nacquire\\ntransfer\\nrelease\\ndestroy\\n```\\n\\n### Flow\\n\\n追：\\n\\n```text\\nentry\\nbranch\\ncallee\\nreturn\\nerror path\\n```\\n\\n### State\\n\\n追：\\n\\n```text\\nstate field\\nread\\nwrite\\ntransition\\ncondition\\ninvariant\\n```\\n\\n### Concurrency\\n\\n追：\\n\\n```text\\nshared object\\nlock\\nacquire\\nrelease\\natomic\\nwait\\nwake\\n```\\n\\n### Data Path\\n\\n追：\\n\\n```text\\nproducer\\nconsumer\\ncopy\\nreference\\ntransform\\npersist\\n```\\n\\n### Resource\\n\\n追：\\n\\n```text\\nlookup\\nallocate\\nreuse\\nvictim\\nevict\\nreclaim\\n```\\n\\n### Recovery\\n\\n追：\\n\\n```text\\nerror\\ncleanup\\nrollback\\nretry\\nrecovery\\n```\\n\\n---\\n\\n# 37. 一个完整示例：Lock Manager\\n\\n例如文档中要说明：\\n\\n\u003e `LOCALLOCK` 保存当前进程对于某个锁请求的本地状态，而共享锁对象由 lock manager 维护。\\n\\nTrace 应该不是简单贴两个 struct。\\n\\n而应该：\\n\\n```text id=\\\"yvrgjj\\\"\\nClaim\\n  │\\n  ├── LOCALLOCK\\n  │      ↓\\n  │   field definitions\\n  │\\n  ├── LOCK\\n  │      ↓\\n  │   shared lock object\\n  │\\n  └── LockAcquire()\\n         ↓\\n      LOCALLOCK lookup\\n         ↓\\n      LOCK lookup/create\\n```\\n\\n这样读者可以沿着：\\n\\n```text\\n概念\\n ↓\\n结构体\\n ↓\\n字段\\n ↓\\n函数\\n ↓\\n运行时对象\\n```\\n\\n一路进入源码。\\n\\n---\\n\\n# 38. 一个完整示例：TupleTableSlot\\n\\n例如 Claim：\\n\\n\u003e Slot 被设计为 executor 中保存当前 tuple 表示的容器。\\n\\nTrace 可以建立：\\n\\n```text id=\\\"5u5hwk\\\"\\nTupleTableSlot\\n    ↓ definition\\ntts_tuple\\n    ↓ access\\nExecStoreHeapTuple()\\n    ↓ mutation\\nslot contents\\n    ↓ consumer\\nexecutor node\\n```\\n\\n如果继续研究 materialization：\\n\\n```text id=\\\"k5av6f\\\"\\nExecMaterializeSlot()\\n    ↓\\nslot-specific materialization callback\\n    ↓\\nstorage conversion\\n```\\n\\n然后才决定：\\n\\n```text\\nData Path\\n+\\nLifecycle\\n```\\n\\n---\\n\\n# 39. Trace 驱动的源码阅读顺序\\n\\n未来 Agent 不建议：\\n\\n```text\\n从文件第一行读到最后一行\\n```\\n\\n而建议：\\n\\n```text id=\\\"1t5nz2\\\"\\n1. 找核心 Symbol\\n        ↓\\n2. 找定义\\n        ↓\\n3. 找关键 Field\\n        ↓\\n4. 找 Readers / Writers\\n        ↓\\n5. 找 Caller / Callee\\n        ↓\\n6. 找 State / Lifecycle\\n        ↓\\n7. 找 Synchronization\\n        ↓\\n8. 建立 Claim\\n        ↓\\n9. 回查 Evidence\\n```\\n\\n这是一个：\\n\\n\u003e **由知识问题驱动的源码阅读过程。**\\n\\n---\\n\\n# 40. Trace 与文档章节的对应\\n\\n最终文档中的每个重要章节，都应该能形成：\\n\\n```text id=\\\"a0tdwl\\\"\\nChapter\\n   ↓\\nCore Questions\\n   ↓\\nClaims\\n   ↓\\nKnowledge Graph\\n   ↓\\nSource Traces\\n```\\n\\n例如：\\n\\n```text id=\\\"f4p4p0\\\"\\n“BufferTag 如何定位 Buffer？”\\n\\nCore Question\\n    ↓\\nClaim\\n    ↓\\nBufferTag\\n    ↓\\nhash\\n    ↓\\nBufTable\\n    ↓\\npartition\\n    ↓\\nBufferDesc\\n```\\n\\n这就是：\\n\\n```text\\nData / Management Trace\\n```\\n\\n而不是普通函数列表。\\n\\n---\\n\\n# 41. Traceability 与最终文档的关系\\n\\n最终读者看到的是：\\n\\n```text id=\\\"o0ww36\\\"\\n概念\\n ↓\\n图\\n ↓\\n语义解释\\n ↓\\n源码落点\\n```\\n\\n而 Agent 内部保存的是：\\n\\n```text id=\\\"fmg4gq\\\"\\nClaim\\n  ↓\\nEvidence[]\\n  ↓\\nTrace[]\\n  ↓\\nSource[]\\n```\\n\\n因此可以形成：\\n\\n```text id=\\\"ojrsu9\\\"\\nInternal Knowledge Model\\n          ↓\\nRepresentation Plan\\n          ↓\\nHuman-readable Document\\n```\\n\\n---\\n\\n# 42. Step 4 最终模型\\n\\n现在可以把前三步与 Step 4 连接起来：\\n\\n```text id=\\\"g3qpw7\\\"\\n                  Source Code\\n                       │\\n                       ▼\\n              ┌─────────────────┐\\n              │ Knowledge Model │\\n              └────────┬────────┘\\n                       ↓\\n              ┌─────────────────┐\\n              │ Pattern Profile │\\n              └────────┬────────┘\\n                       ↓\\n              ┌─────────────────┐\\n              │Representation   │\\n              │     Plan        │\\n              └────────┬────────┘\\n                       ↓\\n              ┌─────────────────┐\\n              │    Claims       │\\n              └────────┬────────┘\\n                       ↓\\n              ┌─────────────────┐\\n              │ Evidence / Trace│\\n              └────────┬────────┘\\n                       ↓\\n                 Source Anchor\\n```\\n\\n于是一个最终知识点不再只是：\\n\\n```text\\n“BufferDesc.state 是状态字段”\\n```\\n\\n而是：\\n\\n```text id=\\\"f3cgfa\\\"\\nClaim\\n  ↓\\nBufferDesc.state 表示 buffer header state\\n\\nType:\\n    FACT / INFERENCE / INTERPRETATION\\n\\nEvidence:\\n    definition\\n    reads\\n    writes\\n\\nTrace:\\n    field\\n      ↓\\n    helper macro\\n      ↓\\n    state transition\\n      ↓\\n    callers\\n\\nSource:\\n    repository + revision\\n    file\\n    symbol\\n    field\\n    code region\\n```\\n\\n---\\n\\n# 43. Step 4 的验收标准\\n\\nStep 4 完成以后，Agent 面对任意核心知识点，都应该能够回答：\\n\\n```text id=\\\"o0ggap\\\"\\n它是什么？\\n    ↓\\n源码在哪里定义？\\n    ↓\\n谁读取？\\n    ↓\\n谁修改？\\n    ↓\\n谁调用？\\n    ↓\\n谁管理？\\n    ↓\\n什么条件下有效？\\n    ↓\\n什么锁 / 原子操作保护？\\n    ↓\\n生命周期是什么？\\n    ↓\\n这个结论是 FACT 还是推导？\\n    ↓\\n证据是否足够？\\n```\\n\\n如果其中某一项没有证据：\\n\\n```text id=\\\"n9hfzs\\\"\\nAgent 应明确标记“未知 / 未追踪”，\\n而不是补一个看似合理的答案。\\n```\\n\\n---\\n\\n# 44. Step 4 最重要的原则\\n\\n最终可以浓缩成一句：\\n\\n\u003e **每一个重要知识结论，都必须能够沿着一条有限、可解释的 Trace，回到能够证明它的源码证据。**\\n\\n因此整个 Skill 的核心闭环开始变得非常清楚：\\n\\n```text id=\\\"4y98xv\\\"\\n理解源码\\n   ↓\\n建立知识\\n   ↓\\n识别模式\\n   ↓\\n选择表达\\n   ↓\\n建立源码证据链\\n   ↓\\n生成文档\\n   ↓\\n读者从文档重新进入源码\\n```\\n\\n这意味着我们最终想做的其实不是普通的：\\n\\n```text\\nCode → Markdown\\n```\\n\\n而是：\\n\\n```text\\n                    ┌──────────────┐\\n                    │   Source     │\\n                    └──────┬───────┘\\n                           │\\n                           ▼\\n                   ┌───────────────┐\\n                   │  Knowledge    │\\n                   │    Graph      │\\n                   └──────┬────────┘\\n                          │\\n             ┌────────────┼────────────┐\\n             ↓            ↓            ↓\\n          Pattern    Representation   Trace\\n             │            │            │\\n             └────────────┼────────────┘\\n                          ↓\\n                     Document\\n                          │\\n                          ↓\\n                 Back to Source\\n```\\n\\n这才是我们前面说的 **“源码理解 → 模式识别 → 知识建模 → 文档生成”** 的完整闭环。\\n\\n:::\\n\\n现在前四步实际上已经形成了一条比较完整的流水线：\\n\\n```text\\nStep 1   Knowledge Model\\n         ↓\\n         “我们要认识什么？”\\n\\nStep 2   Pattern Recognition\\n         ↓\\n         “这段源码主要是什么类型的知识？”\\n\\nStep 3   Representation\\n         ↓\\n         “应该怎样表达最容易理解？”\\n\\nStep 4   Traceability\\n         ↓\\n         “每个结论如何回到源码证明？”\\n```\\n\\n还有一个我认为非常关键的结果：**Step 4 让这个 Skill 不再只是一个“文档生成 Skill”，而开始具备“源码研究 Agent”的雏形。**\\n\\n接下来 **Step 5 就应该定义 Document Generation Specification**，但不是简单规定 Markdown 标题，而是把前四步的结果组装成一个**稳定的源码阅读文档结构**，包括“章节组织、图文比例、源码元素、深浅层次、跨章节引用、导航”和“什么时候拆章节”。这一步做完，最后才能把整个体系压缩成真正可执行的 Agent Skill。\",{},{\"_168\":1502,\"_175\":1807,\"_54\":1808,\"_56\":1808,\"_179\":1809,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":1810,\"_188\":189},\"231259b1-1240-4126-9bad-c668c817a908\",[1488],{\"_250\":251,\"_186\":1814},1789653556.383653,{\"_245\":272,\"_179\":1459},{\"_260\":261,\"_262\":185,\"_264\":1811,\"_266\":1812,\"_268\":269,\"_207\":208,\"_209\":34,\"_210\":1515,\"_212\":213,\"_214\":1516,\"_216\":1516,\"_201\":202,\"_217\":202,\"_66\":67,\"_218\":1813,\"_220\":14,\"_221\":1805,\"_222\":1518,\"_271\":34,\"_224\":10},1789653555.0805986,1789653556.3745816,[225],{},{\"_168\":1805,\"_175\":1818,\"_54\":1819,\"_56\":1820,\"_179\":1821,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":1822,\"_188\":189,\"_190\":1086},\"7db574d2-80c7-49aa-a18c-dbfedb8f3e2b\",[1502],{\"_250\":251,\"_186\":1829},1789653556.025705,1789653556.379301,{\"_245\":246,\"_247\":1827},{\"_195\":1823,\"_199\":1824,\"_201\":202,\"_1089\":34,\"_271\":34,\"_336\":34,\"_337\":185,\"_289\":290,\"_264\":1811,\"_207\":208,\"_210\":1515,\"_212\":213,\"_214\":1516,\"_216\":1516,\"_217\":202,\"_66\":67,\"_218\":1825,\"_220\":34,\"_221\":1826,\"_222\":1518,\"_224\":10},[],[],[225],\"e677387e-bc7d-4db5-8716-35d1c31b7cc8\",[1828],\"Step 4 要解决的是整个体系的“证据链”：不是告诉 Agent “去标注源码位置”，而是规定**一个知识结论如何从文档一路回到可验证的代码事实**。这会直接决定后续 Skill 的可信度。\",{},{\"_168\":1816,\"_175\":1833,\"_54\":1834,\"_56\":1834,\"_179\":1835,\"_181\":182,\"_184\":185,\"_186\":1836,\"_188\":189},\"d9a7299d-999 \"8ryjlu\",\"lquj3x\",\"m9uhim\",\"7r5nqu\",\"to8n4n\",\"gatgod\",\"a0vslb\",\"dinnyj\",\"l9irod\",\"5uhc0l\",\"zh6c44\",\"bag3qz\",\"cmny30\",\"82x25n\",\"1i2kd6\",\"gxclvj\",\"hyc7tj\",\"9rpx1c\",\"q74njs\",\"t5vjm8\",\"j3yvsq\",\"jml7wk\",\"btwk6x\",\"q6lygv\",\"ti9ymo\",\"w42wxp\",\"4d3mh7\",\"ynjv07\",\"a7qmsm\",\"z3y6h5\",\"wpag6m\",\"m2as2p\",\"ca1kv0\",\"4t0m0s\",\"jaxew2\",\"y0ky5y\",\"upgahk\",\"84t621\",\"bdrpmi\",\"s7jcxk\",\"ubwvxm\",\"70119d\",\"a6f0bj\",\"yc7edd\",\"aswfuh\",\"6u3h6u\",\"xmtxt4\",\"jx348s\",\"1lysqz\",\"is4hjj\",\"ni91fg\",\"rjpc70\",\"41s9l6\",\"dj9ahq\",\"lh2o28\",\"f261mz\",\"nqnrx2\",\"e6ct4y\",\"0rwucp\",\"k8fyjv\",\"1d7se1\",\"xam699\",\"3wxcfy\",\"eadwue\",\"0vf79k\",\"6zumpv\",\"7ggqzv\",\"d6l3jn\",\"s5933s\",\"9ex88g\",\"iptuy2\",\"jukz8u\",\"6iy2px\",\"uivt5c\",\"4yvkul\",\"vqs1pj\",\"m05bcu\",\"aliscd\",\"0llrsg\",\"50kr50\",\"ltx6kg\",\"fvhxdw\",\"oij3sg\",\"skazw6\",\"3m2kvw\",\"ckjt7b\",\"50oszf\",\"6933co\",\"y66odt\",\"2e3mr6\",\"k81fvw\",\"1a4u4d\",\"6m9fqt\",\"kbnw5p\",\"yj2ait\",\"ha717h\",\"44qaw8\",\"k3v890\",\"koq03v\",\"btrel7\",\"5el1z3\",\"uwzbd2\",\"jl5ym6\",\"km9if4\",\"iacb7z\",\"bai4gq\",\"1ueii9\",\"sq0er0\",\"dvljax\",\"41bzwn\",\"sraxau\",\"tg6y40\",\"z8tw51\",\"i10q6u\",\"x1aedl\",\"qf9ctx\",\"2cdvj6\",\"a58541\",[244],[2130],\"Step 3 的目标，是把前面两层正式连接起来：\\n\\n```text\\n源码\\n  ↓\\nKnowledge Model\\n  ↓\\nPattern Profile\\n  ↓\\nRepresentation Strategy\\n  ↓\\n最终源码阅读文档\\n```\\n\\n这里真正要设计的不是“有哪些图”，而是：\\n\\n\u003e **什么知识，应该以什么形式表达；什么时候需要图；一章里应该有几种视图；如何避免图文重复。**\\n\\n我建议这一层最终形成一套 **Representation Grammar（知识表达语法）**。\\n\\n:::writing{variant=\\\"document\\\" id=\\\"31684\\\" title=\\\"大型 C/C++ 项目源码知识表达规范 v0.1\\\"}\\n\\n# 大型 C/C++ 项目源码知识表达规范 v0.1\\n\\n## 1. 目标\\n\\n本规范定义：\\n\\n\u003e 如何根据源码知识模式，自动选择最适合的文档表达形式。\\n\\n输入：\\n\\n```text\\nKnowledge Model\\n+\\nPattern Profile\\n+\\nUser Intent\\n```\\n\\n输出：\\n\\n```text\\nRepresentation Plan\\n```\\n\\n再由 Representation Plan 生成：\\n\\n```text\\nMarkdown\\nMermaid\\n表格\\n源码片段\\n文字说明\\n```\\n\\n---\\n\\n# 2. 核心原则\\n\\n## 2.1 表达形式服务于理解问题\\n\\n不能采用：\\n\\n```text\\n有 struct → 画结构图\\n有函数 → 画流程图\\n有 lock → 画锁图\\n```\\n\\n而应该：\\n\\n```text\\n理解问题\\n   ↓\\n知识模式\\n   ↓\\n选择表现形式\\n```\\n\\n例如：\\n\\n```text\\n“有哪些对象，它们怎么管理？”\\n    → Entity Relationship View\\n\\n“一个对象怎么从创建走到释放？”\\n    → Lifecycle View\\n\\n“一次请求到底经过哪些路径？”\\n    → Flow View\\n\\n“为什么同一个对象在这里表现不同？”\\n    → State View\\n\\n“谁和谁会并发访问？”\\n    → Concurrency View\\n```\\n\\n---\\n\\n# 3. Representation 的基本分类\\n\\n第一版建议定义 10 种核心表达视图。\\n\\n```text\\nR1  Entity Relationship View\\nR2  Management / Ownership View\\nR3  Flow View\\nR4  State Transition View\\nR5  Lifecycle View\\nR6  Sequence / Interaction View\\nR7  Data Path View\\nR8  Concurrency / Synchronization View\\nR9  Architecture / Layer View\\nR10 Recovery / Failure View\\n```\\n\\n另有两个通用辅助表达：\\n\\n```text\\nR11 Source Anchor View\\nR12 Comparison / Matrix View\\n```\\n\\n其中 R11 实际上贯穿所有视图，不单独作为章节出现。\\n\\n---\\n\\n# 4. R1 — Entity Relationship View\\n\\n## 4.1 解决的问题\\n\\n回答：\\n\\n\u003e **“有哪些核心对象，它们之间是什么关系？”**\\n\\n最适合：\\n\\n```text\\nStructural Pattern\\n```\\n\\n也适合：\\n\\n```text\\nResource Pattern\\nArchitecture Pattern\\nLifecycle Pattern\\n```\\n\\n---\\n\\n## 4.2 推荐表达\\n\\n```text\\n┌──────────────┐\\n│ A            │\\n│--------------│\\n│ field1       │\\n│ field2 ──────┼──────→ B\\n└──────────────┘\\n```\\n\\n重点展示：\\n\\n```text\\nEntity\\n+\\nRelationship\\n```\\n\\n不要把所有字段都画进去。\\n\\n---\\n\\n## 4.3 关系类型\\n\\n图中的箭头最好能够体现语义：\\n\\n```text\\ncontains\\nowns\\npoints to\\nreferences\\nmanages\\nindexes\\nuses\\nprotects\\n```\\n\\n而不是统一：\\n\\n```text\\nA → B\\n```\\n\\n---\\n\\n## 4.4 适合什么情况\\n\\n例如 TupleTableSlot：\\n\\n```text\\nTupleTableSlot\\n ├── owns/references → Tuple\\n ├── contains → values[]\\n └── contains → isnull[]\\n```\\n\\n这是典型 R1。\\n\\n---\\n\\n# 5. R2 — Management / Ownership View\\n\\n这个视图与 R1 非常接近，但重点不同。\\n\\nR1：\\n\\n\u003e 谁和谁有关系？\\n\\nR2：\\n\\n\u003e **谁负责管理谁？**\\n\\n---\\n\\n## 5.1 适合\\n\\n```text\\nResource Pattern\\nLifecycle Pattern\\nManagement Pattern\\n```\\n\\n例如：\\n\\n```text\\nBuffer Manager\\n      │\\n      ├── allocates → BufferDesc\\n      ├── tracks → BufferDesc\\n      ├── evicts → BufferDesc\\n      └── releases → BufferDesc\\n```\\n\\n或者：\\n\\n```text\\nMemoryContext\\n      │\\n      └── owns\\n            ↓\\n         Objects\\n```\\n\\n---\\n\\n## 5.2 什么时候不要用 R2\\n\\n如果只是：\\n\\n```text\\nA *b;\\n```\\n\\n只能说明：\\n\\n```text\\nA points to B\\n```\\n\\n不能因为存在指针就画：\\n\\n```text\\nA owns B\\n```\\n\\nOwnership 必须有源码证据。\\n\\n---\\n\\n# 6. R3 — Flow View\\n\\n## 6.1 核心问题\\n\\n\u003e **“一个操作是如何完成的？”**\\n\\n主要服务：\\n\\n```text\\nFlow Pattern\\n```\\n\\n---\\n\\n## 6.2 标准结构\\n\\n```text\\nEntry\\n  ↓\\nCheck\\n  ↓\\nLookup\\n  ↓\\nDecision\\n ┌──────┴──────┐\\n ↓             ↓\\nPath A       Path B\\n ↓             ↓\\n   └────┬──────┘\\n        ↓\\n      Result\\n```\\n\\n---\\n\\n## 6.3 Flow 图应该强调\\n\\n```text\\nstep\\nbranch\\ncondition\\nfallback\\nretry\\nerror path\\nreturn\\n```\\n\\n而不是把每一个函数调用都画出来。\\n\\n---\\n\\n## 6.4 一个很重要的规则\\n\\n**Call Graph 不等于 Flow Graph。**\\n\\n例如：\\n\\n```text\\nA()\\n ├── B()\\n ├── C()\\n └── D()\\n```\\n\\n更像：\\n\\n```text\\nCall Graph\\n```\\n\\n而：\\n\\n```text\\nA\\n ↓\\nB\\n ↓\\ndecision\\n ├── C\\n └── D\\n```\\n\\n才是：\\n\\n```text\\nFlow\\n```\\n\\n因此 Agent 应该先判断：\\n\\n\u003e 这些调用关系是在描述“代码依赖”，还是在描述“一次操作的执行路径”。\\n\\n---\\n\\n# 7. R4 — State Transition View\\n\\n## 7.1 核心问题\\n\\n\u003e **“对象有哪些状态？什么条件让它进入下一个状态？”**\\n\\n服务：\\n\\n```text\\nState Pattern\\n```\\n\\n---\\n\\n## 7.2 标准表达\\n\\n```text\\n         condition\\nA ─────────────────→ B\\n                      │\\n                      │ event\\n                      ↓\\n                      C\\n```\\n\\n完整状态机：\\n\\n```text\\nFREE\\n │\\n │ allocate\\n ↓\\nACTIVE\\n │\\n │ modify\\n ↓\\nDIRTY\\n │\\n │ flush\\n ↓\\nCLEAN\\n │\\n │ release\\n ↓\\nFREE\\n```\\n\\n---\\n\\n## 7.3 状态图必须展示三件事\\n\\n```text\\nState\\nTransition\\nTrigger / Condition\\n```\\n\\n否则只是状态枚举，不是真正的状态机。\\n\\n---\\n\\n# 8. R5 — Lifecycle View\\n\\n## 8.1 核心问题\\n\\n\u003e **“对象的一生是怎样的？”**\\n\\n服务：\\n\\n```text\\nLifecycle Pattern\\n```\\n\\n---\\n\\n## 8.2 生命周期与 State 的区别\\n\\n这是 Skill 中需要明确区分的地方。\\n\\n### Lifecycle\\n\\n强调：\\n\\n```text\\n出生 → 使用 → 消亡\\n```\\n\\n### State\\n\\n强调：\\n\\n```text\\n现在处于什么状态\\n为什么能从 A 进入 B\\n```\\n\\n例如：\\n\\n```text\\nObject Lifecycle\\n\\ncreate\\n ↓\\ninitialize\\n ↓\\npublish\\n ↓\\nacquire\\n ↓\\nuse\\n ↓\\nrelease\\n ↓\\ndestroy\\n```\\n\\n而：\\n\\n```text\\nObject State\\n\\nUNINITIALIZED\\nREADY\\nACTIVE\\nBUSY\\n```\\n\\n两者可以同时存在。\\n\\n---\\n\\n# 9. R6 — Sequence / Interaction View\\n\\n这是 Flow 的补充。\\n\\n## 9.1 核心问题\\n\\n\u003e **“多个对象/线程/模块之间是如何交互的？”**\\n\\n适合：\\n\\n```text\\nConcurrency\\nArchitecture\\nFlow\\nIPC\\nNetwork\\nCallback\\n```\\n\\n---\\n\\n## 9.2 典型形式\\n\\n```text\\nBackend        LockMgr        WaitQueue\\n\\n  │               │               │\\n  │ acquire()     │               │\\n  ├──────────────→│               │\\n  │               │ conflict      │\\n  │               ├──────────────→│\\n  │               │               │ enqueue\\n  │               │←──────────────┤\\n  │               │               │\\n  │←──────────────┤               │\\n  │    wait       │               │\\n```\\n\\n---\\n\\n## 9.3 什么时候用 Sequence，而不是 Flow\\n\\n如果核心问题是：\\n\\n```text\\nA → B → C → D\\n```\\n\\n使用 Flow。\\n\\n如果核心问题是：\\n\\n```text\\nA 与 B 如何交互\\nB 与 C 如何交互\\n多个角色在不同时间点如何协作\\n```\\n\\n使用 Sequence。\\n\\n---\\n\\n# 10. R7 — Data Path View\\n\\n## 10.1 核心问题\\n\\n\u003e **“数据从哪里来，经过什么处理，最终到哪里？”**\\n\\n服务：\\n\\n```text\\nData Path Pattern\\n```\\n\\n---\\n\\n## 10.2 典型结构\\n\\n```text\\nInput\\n  ↓\\nDecode\\n  ↓\\nTransform\\n  ↓\\nCache\\n  ↓\\nStorage\\n  ↓\\nOutput\\n```\\n\\n---\\n\\n## 10.3 特别关注数据语义\\n\\n图中应该能够表达：\\n\\n```text\\ncopy\\nmove\\nreference\\nmaterialize\\nserialize\\ndeserialize\\ndecode\\nencode\\ncache\\npersist\\n```\\n\\n例如：\\n\\n```text\\nHeapTuple\\n    │\\n    │ store\\n    ↓\\nTupleTableSlot\\n    │\\n    │ consume\\n    ↓\\nExecutor\\n```\\n\\n如果实际是指针引用，而不是数据复制，应该明确标记。\\n\\n否则图会产生错误理解。\\n\\n---\\n\\n# 11. R8 — Concurrency / Synchronization View\\n\\n## 11.1 核心问题\\n\\n\u003e **“多个执行实体如何共享状态，以及如何同步？”**\\n\\n服务：\\n\\n```text\\nConcurrency Pattern\\n```\\n\\n---\\n\\n## 11.2 推荐表达\\n\\n不要单纯画：\\n\\n```text\\nThread A\\n   ↓\\nLock\\n   ↓\\nThread B\\n```\\n\\n而应表达：\\n\\n```text\\n           protects\\n              │\\n              ↓\\n        ┌────────────┐\\n        │ SharedData │\\n        └────────────┘\\n          ↑        ↑\\n          │        │\\n       access    access\\n          │        │\\n       Thread A  Thread B\\n          │        │\\n          └───┬────┘\\n              ↓\\n             Lock\\n```\\n\\n更进一步：\\n\\n```text\\nThread A\\n   │\\n   ├── acquire Lock\\n   │\\n   ├── modify SharedState\\n   │\\n   └── release Lock\\n```\\n\\n---\\n\\n## 11.3 必须强调“保护对象”\\n\\n不要仅写：\\n\\n```text\\nBufferDesc → LWLock\\n```\\n\\n而应该：\\n\\n```text\\nLWLock\\n   └── protects\\n         ↓\\n     page contents\\n```\\n\\n或者：\\n\\n```text\\nspinlock\\n   └── protects\\n         ↓\\n     buffer header state\\n```\\n\\n否则读者不知道锁为什么存在。\\n\\n---\\n\\n# 12. R9 — Architecture / Layer View\\n\\n## 12.1 核心问题\\n\\n\u003e **“这个模块在整个系统中处于哪里？”**\\n\\n服务：\\n\\n```text\\nArchitecture Pattern\\n```\\n\\n---\\n\\n## 12.2 推荐形式\\n\\n```text\\n┌──────────────────┐\\n│ SQL / Frontend   │\\n└────────┬─────────┘\\n         ↓\\n┌──────────────────┐\\n│ Executor         │\\n└────────┬─────────┘\\n         ↓\\n┌──────────────────┐\\n│ Storage Manager  │\\n└────────┬─────────┘\\n         ↓\\n┌──────────────────┐\\n│ Buffer Manager   │\\n└────────┬─────────┘\\n         ↓\\n┌──────────────────┐\\n│ OS / Filesystem  │\\n└──────────────────┘\\n```\\n\\n---\\n\\n## 12.3 Architecture 图必须克制\\n\\n不要把整个项目所有模块都放进去。\\n\\n只展示：\\n\\n```text\\n当前模块\\n+\\n直接相关上下游\\n+\\n理解当前问题必须的边界\\n```\\n\\n否则会退化成“项目架构总图”，信息密度太低。\\n\\n---\\n\\n# 13. R10 — Recovery / Failure View\\n\\n## 13.1 核心问题\\n\\n\u003e **“正常路径出错后怎么办？”**\\n\\n服务：\\n\\n```text\\nRecovery Pattern\\n```\\n\\n---\\n\\n## 13.2 推荐表达\\n\\n```text\\nNormal Path\\n     │\\n     ↓\\n operation\\n     │\\n   success ─────────→ continue\\n     │\\n   failure\\n     ↓\\n cleanup\\n     ↓\\n rollback\\n     ↓\\n retry / abort / recover\\n```\\n\\n---\\n\\n## 13.3 必须展示状态影响\\n\\n例如：\\n\\n```text\\nallocate A\\n   ↓\\nallocate B\\n   ↓\\nB failed\\n   ↓\\nfree A\\n   ↓\\nreturn error\\n```\\n\\n这比单纯写：\\n\\n```text\\n发生错误 → 返回\\n```\\n\\n有价值很多。\\n\\n---\\n\\n# 14. R11 — Source Anchor View\\n\\n它不是一个单独的视觉图，而是所有 Representation 的**证据层**。\\n\\n每个重要知识都应该能够回到源码：\\n\\n```text\\nConcept\\n  ↓\\nSymbol\\n  ↓\\nFile\\n  ↓\\nCode Range\\n```\\n\\n例如：\\n\\n```text\\nBufferDesc\\n    └── state\\n         ↳ buf_internals.h\\n```\\n\\n或者：\\n\\n```text\\nBufferAlloc()\\n    ↳ bufmgr.c\\n```\\n\\n---\\n\\n## 14.1 Source Anchor 的作用\\n\\n它解决：\\n\\n\u003e **“这个图是你总结出来的，还是源码真的如此？”**\\n\\n因此最终文档中应该适量保留：\\n\\n```c\\nBufferAlloc(...)\\n{\\n    ...\\n}\\n```\\n\\n或者：\\n\\n```c\\nif (strategy != NULL)\\n    ...\\n```\\n\\n但源码片段必须承担解释作用，而不是大段复制源码。\\n\\n---\\n\\n# 15. R12 — Comparison / Matrix View\\n\\n这个视图主要用于：\\n\\n```text\\n多个实体\\n多个路径\\n多个实现\\n多个状态\\n```\\n\\n的横向比较。\\n\\n例如：\\n\\n| Object | Owner | State | Lock | Storage |\\n|---|---|---|---|---|\\n| A | Manager X | Active | L1 | Heap |\\n| B | Manager Y | Cached | L2 | Shared |\\n| C | Manager Y | Free | None | Pool |\\n\\n特别适合：\\n\\n```text\\nResource\\nState\\nArchitecture\\n```\\n\\n---\\n\\n# 16. Pattern → Representation 映射\\n\\n现在可以建立第一版核心映射表。\\n\\n| Dominant Pattern | Primary View | Secondary View |\\n|---|---|---|\\n| Structural | Entity Relationship | Management |\\n| Lifecycle | Lifecycle | Entity / State |\\n| Flow | Flow | Sequence / Error |\\n| State | State Transition | Lifecycle |\\n| Concurrency | Synchronization | Sequence / Entity |\\n| Data Path | Data Path | Flow |\\n| Resource | Management | Entity / State |\\n| Recovery | Failure / Recovery | Flow / State |\\n| Architecture | Layer / Architecture | Entity / Dependency |\\n\\n这张表应该成为未来 Skill 的核心规则之一。\\n\\n---\\n\\n# 17. 一个 Pattern 不一定只对应一个图\\n\\n例如：\\n\\n```text\\nConcurrency\\n```\\n\\n可能需要：\\n\\n```text\\n主图：\\n    Synchronization View\\n\\n辅助：\\n    Sequence View\\n    Entity View\\n```\\n\\n又例如：\\n\\n```text\\nLifecycle\\n```\\n\\n可能需要：\\n\\n```text\\n主图：\\n    Lifecycle\\n\\n辅助：\\n    State\\n    Ownership\\n```\\n\\n因此应定义：\\n\\n```text\\nRepresentationPlan {\\n    primary_view\\n    secondary_views[]\\n    text_sections[]\\n    source_anchors[]\\n}\\n```\\n\\n---\\n\\n# 18. 一章最好只有一个 Primary View\\n\\n这是一个非常重要的文档设计约束。\\n\\n不要：\\n\\n```text\\n这一章\\n ├── 结构图\\n ├── 流程图\\n ├── 生命周期图\\n ├── 状态图\\n ├── 时序图\\n ├── 数据流图\\n └── 又来一个结构图\\n```\\n\\n这会让读者不知道应该从哪里理解。\\n\\n更好的方式：\\n\\n```text\\n本章核心问题\\n      ↓\\nPrimary View\\n      ↓\\nSecondary Views\\n      ↓\\n源码细节\\n```\\n\\n例如 Lock Manager：\\n\\n```text\\n核心问题：\\n    多个事务如何安全地申请和等待锁？\\n\\nPrimary:\\n    Concurrency View\\n\\nSecondary:\\n    Entity Relationship\\n    Flow\\n    State\\n    Sequence\\n```\\n\\n---\\n\\n# 19. 图不是必须的\\n\\n这是整个规范非常重要的一条。\\n\\n只有当：\\n\\n```text\\n关系数量 × 关系复杂度\\n```\\n\\n超过纯文字的理解成本时，才应该画图。\\n\\n---\\n\\n## 19.1 适合画图\\n\\n例如：\\n\\n```text\\nA → B → C\\n      ↘ D\\n```\\n\\n或者：\\n\\n```text\\nA owns B\\nA references C\\nB managed by D\\n```\\n\\n这种关系用图明显更好。\\n\\n---\\n\\n## 19.2 不适合画图\\n\\n例如：\\n\\n```text\\nBufferDesc 是 shared buffer 的元数据结构。\\nstate 字段记录 buffer header 状态。\\ntag 描述 page identity。\\ncontent_lock 用于保护 page content。\\n```\\n\\n只有四个事实，没有复杂关系。\\n\\n这时：\\n\\n```text\\n文字 + 字段表\\n```\\n\\n比画图更好。\\n\\n---\\n\\n# 20. 图的选择标准\\n\\nAgent 应考虑三个维度：\\n\\n```text\\nStructural Complexity\\nTemporal Complexity\\nConcurrency Complexity\\n```\\n\\n可以粗略理解为：\\n\\n```text\\n                    时间变化\\n                       ↑\\n                       │\\n                Sequence\\n                       │\\n            Lifecycle / State\\n                       │\\n                       │\\nStructural ────────────┼────────────→ Concurrency\\n                       │\\n               Entity / Relation\\n```\\n\\n也就是说：\\n\\n```text\\n“谁和谁？”\\n    → Entity\\n\\n“谁管理谁？”\\n    → Management\\n\\n“先发生什么？”\\n    → Flow\\n\\n“对象怎么变化？”\\n    → State / Lifecycle\\n\\n“多个角色怎么交互？”\\n    → Sequence\\n\\n“数据怎么走？”\\n    → Data Path\\n\\n“谁保护谁？”\\n    → Concurrency\\n```\\n\\n---\\n\\n# 21. Representation 应该分层\\n\\n一张图不要同时承担所有信息。\\n\\n推荐采用：\\n\\n```text\\nL1 Context\\nL2 Core Structure\\nL3 Behavior\\nL4 Implementation Detail\\n```\\n\\n例如 Buffer Manager：\\n\\n```text\\nL1：\\nBuffer Manager 在 Storage 层的位置\\n\\nL2：\\nBufferDesc / BufferTag / BufTable 之间的关系\\n\\nL3：\\nReadBuffer → lookup → allocate → pin\\n\\nL4：\\nhash partition\\nLWLock\\nstate bit layout\\n```\\n\\n这样读者可以逐层深入，而不是一开始面对几十个节点。\\n\\n---\\n\\n# 22. 图的粒度规则\\n\\nAgent 必须控制节点数量。\\n\\n建议：\\n\\n```text\\n核心图：\\n    5～12 个节点\\n```\\n\\n超过这个范围：\\n\\n```text\\n不要继续塞进一张图\\n```\\n\\n而应该：\\n\\n```text\\n拆成 Context View\\n+\\nCore View\\n+\\nDetail View\\n```\\n\\n例如：\\n\\n```text\\nBuffer Manager\\n```\\n\\n可以：\\n\\n```text\\n图1：核心对象关系\\n图2：Buffer lookup 流程\\n图3：并发保护关系\\n```\\n\\n而不是一张 40 个节点的大图。\\n\\n---\\n\\n# 23. 图文之间必须分工\\n\\n一个非常重要的原则：\\n\\n\u003e **图负责“空间关系”，文字负责“语义解释”，源码负责“证据”。**\\n\\n例如：\\n\\n### 图\\n\\n```text\\nRelation\\n   │\\n   ├── rd_smgr\\n   ↓\\nSMgrRelation\\n```\\n\\n### 文字\\n\\n```text\\nRelation 并不直接负责文件 I/O。\\n它通过 rd_smgr 关联到 smgr 层对象，\\n从而把“关系对象”和“物理存储管理”连接起来。\\n```\\n\\n### 源码\\n\\n```c\\nrelation-\u003erd_smgr\\n```\\n\\n三者各做自己的事情。\\n\\n---\\n\\n# 24. 不允许图文重复\\n\\n不好的文档：\\n\\n```text\\n图：\\nA → B\\n\\n文字：\\nA 指向 B。\\nA 与 B 有关系。\\n```\\n\\n这是信息浪费。\\n\\n好的文档：\\n\\n```text\\n图：\\nA → B\\n\\n文字：\\nA 通过 B 获得 XXX 能力，\\n但 A 不拥有 B 的生命周期。\\n```\\n\\n图给结构，文字解释语义。\\n\\n---\\n\\n# 25. Representation Selection Algorithm\\n\\n未来 Skill 可以明确执行下面这个流程：\\n\\n```text\\nStep 1\\n识别 Dominant Pattern\\n        ↓\\nStep 2\\n确定 Core Question\\n        ↓\\nStep 3\\n建立相关 Knowledge Subgraph\\n        ↓\\nStep 4\\n判断三种复杂度\\n\\nStructural Complexity\\nTemporal Complexity\\nConcurrency Complexity\\n        ↓\\nStep 5\\n选择 Primary View\\n        ↓\\nStep 6\\n选择 ≤ 2~3 个 Secondary Views\\n        ↓\\nStep 7\\n确定需要哪些 Source Anchors\\n        ↓\\nStep 8\\n生成文字解释\\n        ↓\\nStep 9\\n检查图文是否重复\\n```\\n\\n---\\n\\n# 26. Representation Plan 示例\\n\\n例如：\\n\\n```text\\nSubject:\\n    PostgreSQL Lock Manager\\n\\nPattern:\\n    dominant = Concurrency\\n\\nRepresentationPlan:\\n\\nPrimary:\\n    R8 Synchronization View\\n\\nSecondary:\\n    R1 Entity Relationship\\n    R3 Flow\\n    R6 Sequence\\n\\nText:\\n    - lock 对象职责\\n    - fast-path 与 main table 的关系\\n    - conflict 的含义\\n    - wait 的原因\\n\\nSource Anchors:\\n    LockAcquire()\\n    SetupLockInTable()\\n    GrantLock()\\n    WaitOnLock()\\n\\nAvoid:\\n    不生成完整 call graph\\n    不展开无关锁 API\\n```\\n\\n这样一来，后面的 Markdown 生成只是“渲染”。\\n\\n---\\n\\n# 27. Representation 与 User Intent\\n\\n同一组源码，因为用户问题不同，Representation 可以不同。\\n\\n例如同样是 Buffer Manager：\\n\\n### 用户问“Buffer Manager 有哪些核心对象？”\\n\\n```text\\nPrimary:\\n    Entity Relationship\\n```\\n\\n### 用户问“ReadBuffer 是怎么工作的？”\\n\\n```text\\nPrimary:\\n    Flow\\n```\\n\\n### 用户问“为什么 BufferDesc 有这么多锁？”\\n\\n```text\\nPrimary:\\n    Concurrency\\nSecondary:\\n    Entity Relationship\\n```\\n\\n### 用户问“Buffer 从创建到淘汰经历什么？”\\n\\n```text\\nPrimary:\\n    Lifecycle\\nSecondary:\\n    State\\n```\\n\\n所以最终：\\n\\n```text\\nRepresentation\\n    =\\n    Pattern\\n    +\\n    User Intent\\n```\\n\\n而不是只由源码决定。\\n\\n---\\n\\n# 28. Representation 的自动选择不应只看关键词\\n\\n例如源码包含：\\n\\n```c\\nspin_lock(\u0026desc-\u003ebuf_hdr_lock);\\n```\\n\\n不能直接：\\n\\n```text\\nConcurrency → 画锁图\\n```\\n\\n必须继续判断：\\n\\n```text\\n谁访问 desc？\\n保护哪个字段？\\n竞争发生在哪里？\\n这个锁是不是理解当前问题的关键？\\n```\\n\\n只有确认：\\n\\n```text\\nConcurrency Semantics\\n```\\n\\n是核心理解问题时，才升级为 Concurrency View。\\n\\n---\\n\\n# 29. 一个完整例子：TupleTableSlot\\n\\n假设知识模型：\\n\\n```text\\nEntity:\\n    TupleTableSlot\\n    HeapTuple\\n\\nRelation:\\n    Slot → Tuple\\n\\nLifecycle:\\n    Empty → Store → Use → Clear\\n\\nDataPath:\\n    HeapTuple → Slot → Executor\\n```\\n\\nPattern：\\n\\n```text\\ndominant:\\n    Lifecycle\\n\\nsecondary:\\n    Structural\\n    DataPath\\n```\\n\\nRepresentation：\\n\\n```text\\nPrimary:\\n    Lifecycle View\\n\\nSecondary:\\n    Entity Relationship\\n    Data Path\\n```\\n\\n最终文档可能就是：\\n\\n```text\\n1. Slot 是什么\\n2. Slot 管理什么\\n3. Slot 生命周期\\n4. Tuple 如何进入 Slot\\n5. Slot 如何被 executor 消费\\n6. Clear / Materialize 的作用\\n7. 关键源码\\n```\\n\\n这就比“一个 struct + 20 个字段说明”更接近真正的源码理解。\\n\\n---\\n\\n# 30. 一个完整例子：Buffer Mapping\\n\\n知识模型：\\n\\n```text\\nEntity:\\n    BufferTag\\n    BufTable\\n    BufferDesc\\n\\nRelation:\\n    BufferTag → hash\\n    hash → bucket\\n    bucket → BufferDesc\\n\\nConcurrency:\\n    partition lock\\n```\\n\\nPattern：\\n\\n```text\\ndominant:\\n    Resource\\n\\nsecondary:\\n    Structural\\n    Concurrency\\n```\\n\\nRepresentation：\\n\\n```text\\nPrimary:\\n    Management / Resource View\\n\\nSecondary:\\n    Entity Relationship\\n    Concurrency View\\n```\\n\\n而不是直接画一张巨大的：\\n\\n```text\\nBuffer Manager 全部结构图\\n```\\n\\n因为当前真正需要理解的是：\\n\\n\u003e 如何通过 BufferTag 高效地定位 Buffer，以及多个 backend 如何并发访问这套映射关系。\\n\\n---\\n\\n# 31. Representation 的“最小充分表达”原则\\n\\n一份源码文档不是展示信息越多越好。\\n\\n目标应该是：\\n\\n\u003e **用最少的表达单元，覆盖理解当前问题所必需的知识。**\\n\\n可以表达成：\\n\\n```text\\nMinimum Sufficient Representation\\n```\\n\\n优先级：\\n\\n```text\\n文字\\n ↓\\n表格\\n ↓\\n单一关系图\\n ↓\\n流程图\\n ↓\\n多视图组合\\n ↓\\n多层详细图\\n```\\n\\n越往后，越需要证明必要性。\\n\\n---\\n\\n# 32. 最终形成 Representation Grammar\\n\\n目前我们已经可以把整个 Step 3 压缩成一套规则：\\n\\n```text\\nRepresentation\\n│\\n├── Context View\\n│\\n├── Primary View\\n│\\n│   ├── Entity\\n│   ├── Management\\n│   ├── Flow\\n│   ├── State\\n│   ├── Lifecycle\\n│   ├── Sequence\\n│   ├── Data Path\\n│   ├── Concurrency\\n│   ├── Architecture\\n│   └── Recovery\\n│\\n├── Secondary Views\\n│\\n├── Semantic Explanation\\n│\\n└── Source Evidence\\n```\\n\\n一个章节的推荐结构：\\n\\n```text\\n问题 / 场景\\n    ↓\\n一句话结论\\n    ↓\\nPrimary View\\n    ↓\\n关键语义解释\\n    ↓\\nSecondary View\\n    ↓\\n源码片段 / Source Anchor\\n    ↓\\n关键 Invariant\\n```\\n\\n---\\n\\n# 33. Step 3 的验收标准\\n\\n给 Agent 一个源码主题，它至少应该能够：\\n\\n```text\\n1. 判断是否真的需要图\\n\\n2. 选择 Primary Representation\\n\\n3. 选择 Secondary Representation\\n\\n4. 说明为什么这样选择\\n\\n5. 控制图的粒度\\n\\n6. 区分 Flow / Call Graph / Sequence\\n\\n7. 区分 State / Lifecycle\\n\\n8. 区分 Pointer Relation / Ownership\\n\\n9. 让图、文字、源码各承担不同职责\\n\\n10. 每个关键结论都能回到 Source Evidence\\n```\\n\\n最终 Agent 不应该只输出：\\n\\n```text\\n“我画了一张 Mermaid 图。”\\n```\\n\\n而应该先形成：\\n\\n```text\\nRepresentationPlan\\n```\\n\\n例如：\\n\\n```text\\nSubject:\\n    Buffer Manager\\n\\nCore Question:\\n    Buffer 如何被定位、获取、保护和回收？\\n\\nDominant Pattern:\\n    Resource\\n\\nPrimary:\\n    Management View\\n\\nSecondary:\\n    Structural\\n    Concurrency\\n    Lifecycle\\n\\nNo Diagram:\\n    字段定义部分仅使用表格\\n\\nEvidence:\\n    BufferDesc\\n    BufTable\\n    BufferAlloc()\\n    PinBuffer()\\n    UnpinBuffer()\\n```\\n\\n然后再把这个 Plan 渲染成 Markdown / Mermaid。\\n:::\\n\\n到这里，整个体系实际上已经出现了一个很关键的**中间层**：\\n\\n```text\\n                    ┌──────────────────┐\\n源码 ──────────────→│ Knowledge Model  │\\n                    └────────┬─────────┘\\n                             ↓\\n                    ┌──────────────────┐\\n                    │ Pattern Profile  │\\n                    └────────┬─────────┘\\n                             ↓\\n                    ┌──────────────────┐\\n                    │Representation    │\\n                    │     Plan         │\\n                    └────────┬─────────┘\\n                             ↓\\n                    ┌──────────────────┐\\n                    │ Markdown/Mermaid │\\n                    └──────────────────┘\\n```\\n\\n这个 `Representation Plan` 我认为会是未来 Skill 的**核心控制层**。因为它让 Agent 不再直接从“读代码”跳到“写 Markdown”。\\n\\n而且现在已经能看到，**Step 4 不应该马上写 Skill Prompt**。\\n\\n下一步应该做一个同样重要的东西：**定义“源码追踪规范”**。也就是规定 Agent 如何从一个知识点一路落到 `文件 → symbol → struct field → 调用点 → 修改点 → 条件分支`，并且如何管理 `FACT / INFERENCE / INTERPRETATION`。这会决定整个 Skill 最后生成的是“看起来懂了”，还是**真的能跟着源码走下去**。\",{},{\"_168\":1856,\"_175\":2135,\"_54\":2136,\"_56\":2136,\"_179\":2137,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":2138,\"_188\":189},\"10606a8f-a042-4145-a60e-11dd5f34319a\",[1842],{\"_250\":251,\"_186\":2145},1789653476.881128,{\"_245\":272,\"_179\":2144},{\"_260\":261,\"_262\":2139,\"_264\":2140,\"_266\":2141,\"_268\":269,\"_207\":208,\"_209\":34,\"_210\":1869,\"_212\":213,\"_214\":1870,\"_216\":1870,\"_201\":202,\"_217\":202,\"_66\":67,\"_218\":2142,\"_220\":14,\"_221\":2143,\"_222\":1872,\"_271\":34,\"_224\":10},5,1789653471.5344088,1789653476.7694232,[225],\"69e51730-66d5-4ca6-9a88-0186cac5326b\",\"思考了 5s\",{},{\"_168\":2133,\"_175\":2149,\"_54\":2150,\"_56\":2151,\"_179\":2152,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":2153,\"_188\":189,\"_190\":1086},\"0c125beb-6955-42bf-87f0-8167fd602959\",[1856],{\"_250\":251,\"_186\":2160},1789653474.218813,1789653475.072103,{\"_245\":246,\"_247\":2158},{\"_195\":2154,\"_199\":2155,\"_201\":202,\"_1089\":34,\"_271\":34,\"_336\":34,\"_337\":185,\"_289\":290,\"_264\":2140,\"_207\":208,\"_210\":1869,\"_212\":213,\"_214\":1870,\"_216\":1870,\"_217\":202,\"_66\":67,\"_218\":2156,\"_220\":34,\"_221\":2157,\"_222\":1872,\"_224\":10},[],[],[225],\"d440b6ee-6f12-47ee-bfad-efe1050a0f7f\",[2159],\"Step 3 我们要把“理解模式”真正落到“怎么表达”。这里最重要的是建立 **选择规则**，避免 Agent 看到任何源码都机械地画结构图或流程图。\",{},{\"_168\":2147,\"_175\":2164,\"_54\":2165,\"_56\":2165,\"_179\":2166,\"_181\":182,\"_184\":185,\"_186\":2167,\"_188\":189},\"bb638549-a65b-44ca-a446-2727f523c605\",[2133],{\"_250\":411,\"_186\":2171},1789653472.168018,{\"_245\":246,\"_247\":2170},{\"_408\":34,\"_222\":2168,\"_201\":202,\"_337\":185,\"_289\":290,\"_264\":2140,\"_207\":208,\"_210\":1869,\"_212\":213,\"_214\":1870,\"_216\":1870,\"_217\":202,\"_66\":67,\"_218\":2169,\"_221\":2162,\"_224\":10,\"_220\":14},\"249d408d-652f-41ae-86db-289994c8c6f7\",[225],[306],{},{\"_168\":2162,\"_175\":2175,\"_54\":2176,\"_56\ \",\"czcp15\",\"a5cayv\",\"myxae4\",\"3dk7s4\",\"fkrc7f\",\"qrcgem\",\"4gft7s\",\"s8y98a\",\"j45ch1\",\"6ewe38\",\"j2xe3q\",\"f9xvv3\",\"z62b0f\",\"my32xi\",\"wau0yi\",\"w0cag7\",\"6fs1n3\",\"pgt2xy\",\"88vhyo\",\"grocx8\",\"fd16f3\",\"doeonn\",\"wpiq16\",\"mx84i5\",\"adi1mb\",\"71jhhu\",\"cjr6ta\",\"3903fm\",\"qcw4gx\",\"ir8gr4\",\"jfar5j\",\"99rrf1\",\"fe52yv\",\"lh9nhc\",\"0m0u58\",\"boebus\",\"90vl7m\",\"bl9lpv\",\"49kx7y\",\"lnzm8t\",[244],[2448],\"下面进入 Step 2。这里我会刻意把“模式”和“表现形式”分开：**模式描述源码本身是什么类型的知识；图、表、流程图只是后续的表达手段。**\\n\\n:::writing{variant=\\\"document\\\" id=\\\"74126\\\" title=\\\"大型 C/C++ 项目源码知识模式分类与识别规范 v0.1\\\"}\\n# 大型 C/C++ 项目源码知识模式分类与识别规范 v0.1\\n\\n## 1. Step 2 的目标\\n\\nStep 1 已经定义了源码知识模型：\\n\\n```text\\nEntity\\nRelation\\nFlow\\nState\\nLifecycle\\nConcurrency\\nConstraint\\nEvidence\\n```\\n\\nStep 2 在此基础上解决三个问题：\\n\\n```text\\n1. 一段源码主要在描述什么？\\n2. Agent 如何识别这种“知识模式”？\\n3. 识别后，应该采用哪种知识组织策略？\\n```\\n\\n这里的核心原则是：\\n\\n\u003e **Pattern 是理解源码的视角，不是 Markdown 模板。**\\n\\n例如同样是几个 struct：\\n\\n```text\\nA → B → C\\n```\\n\\n可能是：\\n\\n```text\\n结构关系\\n对象所有权\\n运行时数据流\\n缓存组织\\n生命周期\\n```\\n\\n仅凭“有几个 struct”无法确定应该画什么图。\\n\\n---\\n\\n# 2. Pattern 不应该是互斥分类\\n\\n源码知识具有天然的多维性。\\n\\n例如 PostgreSQL Buffer Manager 同时具有：\\n\\n```text\\nStructural\\nLifecycle\\nState\\nConcurrency\\nDataPath\\nInvariant\\n```\\n\\n因此不要使用：\\n\\n```text\\nif pattern == X:\\n    use X\\nelse:\\n    use Y\\n```\\n\\n这种单标签分类。\\n\\n正确模型应当是：\\n\\n```text\\n                    Source Fragment\\n                          │\\n            ┌─────────────┼─────────────┐\\n            ↓             ↓             ↓\\n        Structural      Flow        Concurrency\\n            │             │             │\\n            └─────────────┼─────────────┘\\n                          ↓\\n                    Dominant Pattern\\n```\\n\\n即：\\n\\n\u003e **允许多个 Pattern 同时存在，但必须识别一个 Dominant Pattern。**\\n\\n---\\n\\n# 3. Pattern 分类体系\\n\\n第一版建议收敛到 8 个核心 Pattern。\\n\\n```text\\nSource Knowledge Patterns\\n\\n├── P1 Structural / Topology\\n├── P2 Lifecycle / Ownership\\n├── P3 Flow / Pipeline\\n├── P4 State Machine\\n├── P5 Concurrency / Synchronization\\n├── P6 Data Path / Transformation\\n├── P7 Resource / Cache / Index\\n└── P8 Recovery / Error / Consistency\\n```\\n\\n另外增加一个跨层 Pattern：\\n\\n```text\\nP9 Architecture / Subsystem Boundary\\n```\\n\\n但 P9 不与前 8 个竞争，而是负责跨模块、跨层次的架构关系。\\n\\n---\\n\\n# 4. P1 — Structural / Topology Pattern\\n\\n## 4.1 核心问题\\n\\n这个 Pattern 回答：\\n\\n\u003e **“系统里有哪些核心对象，它们是怎么组织起来的？”**\\n\\n典型对象：\\n\\n```text\\nstruct\\nclass\\nobject\\nmanager\\ncontainer\\ntable\\nlist\\nhash table\\ntree\\nqueue\\nindex\\nsubsystem\\n```\\n\\n---\\n\\n## 4.2 典型知识\\n\\n```text\\nA contains B\\nA owns B\\nA points to B\\nA references B\\nA indexes B\\nA manages B\\n```\\n\\n例如：\\n\\n```text\\nTupleTableSlot\\n      │\\n      ├── tts_tuple\\n      │       ↓\\n      │    HeapTuple\\n      │\\n      ├── tts_values\\n      │\\n      └── tts_isnull\\n```\\n\\n---\\n\\n## 4.3 自动识别信号\\n\\nAgent 应重点观察：\\n\\n```text\\nstruct/class definition\\npointer fields\\nembedded fields\\ncontainer members\\nlist/hash/tree members\\nmanager → object relationships\\nglobal registry\\nlookup table\\n```\\n\\n特别是：\\n\\n```c\\nstruct A {\\n    B *b;\\n    C c;\\n    List *items;\\n};\\n```\\n\\n以及：\\n\\n```c\\na-\u003eb\\na-\u003eitems\\nhash_search(...)\\nlist_add(...)\\n```\\n\\n---\\n\\n## 4.4 Dominant Question\\n\\n当源码主要在回答：\\n\\n\u003e **“A、B、C 是什么，以及彼此怎么组织？”**\\n\\n则 Structural 应作为主模式。\\n\\n---\\n\\n# 5. P2 — Lifecycle / Ownership Pattern\\n\\n## 5.1 核心问题\\n\\n\u003e **“一个对象从哪里来、由谁持有、如何流转、什么时候消失？”**\\n\\n这个 Pattern 对 C/C++ 极其重要。\\n\\n---\\n\\n## 5.2 生命周期\\n\\n典型结构：\\n\\n```text\\ncreate\\n  ↓\\ninitialize\\n  ↓\\npublish\\n  ↓\\nacquire\\n  ↓\\nuse\\n  ↓\\nrelease\\n  ↓\\ndestroy\\n```\\n\\n---\\n\\n## 5.3 Ownership\\n\\n需要识别：\\n\\n```text\\ncreator\\nowner\\nborrower\\nshared owner\\nreference count holder\\ndeferred releaser\\nfinal releaser\\n```\\n\\n例如：\\n\\n```text\\nMemoryContext\\n      │\\n      ├── allocates → object\\n      │\\n      └── destroys → object\\n```\\n\\n---\\n\\n## 5.4 自动识别信号\\n\\n重点扫描：\\n\\n```text\\nmalloc/free\\nnew/delete\\npalloc/pfree\\nconstructor/destructor\\nrefcount\\npin/unpin\\nacquire/release\\nregister/unregister\\nattach/detach\\nretain/release\\nownership transfer\\nRCU\\ndeferred free\\n```\\n\\n特别关注：\\n\\n```c\\nobj = create();\\n...\\nobj-\u003erefcount++;\\n...\\nrelease(obj);\\n```\\n\\n---\\n\\n## 5.5 Dominant Question\\n\\n当源码最难的地方是：\\n\\n\u003e **“这个对象什么时候有效？谁保证它还活着？”**\\n\\nLifecycle 应作为主模式。\\n\\n---\\n\\n# 6. P3 — Flow / Pipeline Pattern\\n\\n## 6.1 核心问题\\n\\n\u003e **“一次操作是怎么走完的？”**\\n\\n这是最传统、也是最常用的源码阅读模式。\\n\\n---\\n\\n## 6.2 Flow 包括\\n\\n```text\\nentry\\ndecision\\nlookup\\noperation\\nbranch\\nretry\\nfallback\\ncleanup\\nreturn\\n```\\n\\n例如：\\n\\n```text\\nRequest\\n   ↓\\nValidate\\n   ↓\\nLookup\\n   ↓\\nHit? ────── Yes ──→ Use\\n  │\\n  No\\n  ↓\\nLoad\\n  ↓\\nInstall\\n  ↓\\nUse\\n```\\n\\n---\\n\\n## 6.3 自动识别信号\\n\\n重点识别：\\n\\n```text\\nfunction call chain\\nif/else\\nswitch\\ngoto cleanup\\nretry loop\\ncallback\\ndispatch\\nreturn path\\nerror path\\n```\\n\\n以及：\\n\\n```text\\nA()\\n └── B()\\n      └── C()\\n           └── D()\\n```\\n\\n---\\n\\n## 6.4 Dominant Question\\n\\n当主要问题是：\\n\\n\u003e **“调用一次 X，到底发生了什么？”**\\n\\nFlow 为主模式。\\n\\n---\\n\\n# 7. P4 — State Machine Pattern\\n\\n## 7.1 核心问题\\n\\n\u003e **“同一个对象在不同状态下有什么不同语义？”**\\n\\n这是很多大型系统里最容易被普通源码笔记忽略的模式。\\n\\n---\\n\\n## 7.2 显式状态机\\n\\n例如：\\n\\n```text\\nINIT\\n ↓\\nREADY\\n ↓\\nRUNNING\\n ↓\\nWAITING\\n ↓\\nDONE\\n```\\n\\n来源可能是：\\n\\n```text\\nenum\\nswitch\\nstate field\\nstatus field\\n```\\n\\n---\\n\\n## 7.3 隐式状态机\\n\\n更重要的是识别这种形式：\\n\\n```text\\nif (ptr == NULL)\\n    ...\\nif (refcount == 0)\\n    ...\\nif (flags \u0026 X)\\n    ...\\nif (owner == current)\\n    ...\\n```\\n\\n多个变量组合起来可能构成状态：\\n\\n```text\\nstate = f(flags, ptr, refcount, owner)\\n```\\n\\nAgent 必须尝试发现：\\n\\n```text\\nexplicit state\\nimplicit state\\ncomposite state\\n```\\n\\n---\\n\\n## 7.4 状态转换\\n\\n不仅要识别状态，还要识别：\\n\\n```text\\nState A\\n   ↓ condition\\nState B\\n```\\n\\n例如：\\n\\n```text\\nFREE\\n ↓ pin\\nVALID\\n ↓ modify\\nDIRTY\\n ↓ flush\\nCLEAN\\n```\\n\\n---\\n\\n## 7.5 Dominant Question\\n\\n当理解源码的关键是：\\n\\n\u003e **“为什么同一个函数在不同情况下行为完全不同？”**\\n\\nState Machine 应作为主模式。\\n\\n---\\n\\n# 8. P5 — Concurrency / Synchronization Pattern\\n\\n## 8.1 核心问题\\n\\n\u003e **“多个执行实体同时访问这个系统时，谁和谁竞争、谁保护谁、谁等待谁？”**\\n\\n---\\n\\n## 8.2 需要识别的对象\\n\\n```text\\nthread\\nprocess\\ncoroutine\\nCPU\\nNUMA node\\nshared memory\\n```\\n\\n以及：\\n\\n```text\\nmutex\\nrwlock\\nspinlock\\nsemaphore\\natomic\\nCAS\\nbarrier\\ncondition variable\\nRCU\\nlock-free structure\\n```\\n\\n---\\n\\n## 8.3 需要建立的关系\\n\\n```text\\nLock\\n ├── protects → object\\n ├── protects → field\\n ├── acquired by → function\\n ├── released by → function\\n ├── mode → shared/exclusive\\n └── scope → local/global\\n```\\n\\n还需要：\\n\\n```text\\nThread A\\n   ↓\\nwaits for\\n   ↓\\nLock\\n   ↑\\nholds\\n   │\\nThread B\\n```\\n\\n---\\n\\n## 8.4 自动识别信号\\n\\n重点扫描：\\n\\n```text\\npthread_mutex\\npthread_rwlock\\nspin_lock\\nLWLock\\natomic_*\\nCAS\\ncompare_exchange\\nfutex\\ncondition variable\\nseqlock\\nRCU\\nmemory barrier\\n```\\n\\n同时关注：\\n\\n```text\\nshared/global data\\nvolatile\\natomic fields\\nlock ordering\\nwait queues\\n```\\n\\n---\\n\\n## 8.5 Dominant Question\\n\\n当真正困难的问题是：\\n\\n\u003e **“为什么这里需要这个同步原语，以及它到底保护什么？”**\\n\\nConcurrency 为主模式。\\n\\n---\\n\\n# 9. P6 — Data Path / Transformation Pattern\\n\\n## 9.1 核心问题\\n\\n\u003e **“数据从哪里来，经过什么处理，最终到哪里？”**\\n\\n这类模式非常适合数据库、存储系统、网络系统。\\n\\n---\\n\\n## 9.2 基本模型\\n\\n```text\\nInput\\n  ↓\\nDecode\\n  ↓\\nLookup\\n  ↓\\nTransform\\n  ↓\\nCache\\n  ↓\\nWrite\\n  ↓\\nOutput\\n```\\n\\n例如数据库：\\n\\n```text\\nSQL\\n ↓\\nParse\\n ↓\\nPlan\\n ↓\\nExecutor\\n ↓\\nTuple\\n ↓\\nBuffer\\n ↓\\nPage\\n ↓\\nDisk\\n```\\n\\n---\\n\\n## 9.3 数据路径不仅是函数调用\\n\\n需要识别：\\n\\n```text\\ndata ownership\\nformat conversion\\ncopy\\nzero-copy\\nserialization\\ndeserialization\\nbuffer handoff\\ncache hit/miss\\nmaterialization\\nprojection\\ncompression\\n```\\n\\n---\\n\\n## 9.4 自动识别信号\\n\\n例如：\\n\\n```c\\nsrc → memcpy → dst\\n```\\n\\n或者：\\n\\n```text\\nNetworkBuffer\\n      ↓\\nMessage\\n      ↓\\nTuple\\n      ↓\\nPage\\n```\\n\\n以及：\\n\\n```text\\nread\\ndecode\\nconvert\\ncopy\\nstore\\nsend\\n```\\n\\n---\\n\\n## 9.5 Dominant Question\\n\\n当重点是：\\n\\n\u003e **“数据本身如何在系统中移动和变形？”**\\n\\nData Path 为主模式。\\n\\n---\\n\\n# 10. P7 — Resource / Cache / Index Pattern\\n\\n这个 Pattern 单独拿出来，是因为很多底层系统的核心不是普通数据结构，而是：\\n\\n\u003e **如何高效地管理大量资源。**\\n\\n---\\n\\n## 10.1 典型对象\\n\\n```text\\nBuffer Pool\\nMemory Pool\\nObject Pool\\nConnection Pool\\nCache\\nFree List\\nHash Table\\nB+Tree\\nLRU\\nClock\\nExtent Map\\nIndex\\nRegistry\\nQueue\\n```\\n\\n---\\n\\n## 10.2 核心问题\\n\\n```text\\n资源在哪里？\\n如何找到？\\n如何分配？\\n如何回收？\\n如何淘汰？\\n如何避免重复？\\n如何降低查找成本？\\n```\\n\\n---\\n\\n## 10.3 自动识别信号\\n\\n重点识别：\\n\\n```text\\nlookup\\nhash\\nbucket\\nindex\\nfree list\\nvictim\\neviction\\nreclaim\\nreuse\\npool\\ncache\\nLRU\\nclock hand\\nreference bit\\n```\\n\\n---\\n\\n## 10.4 一个非常重要的子问题\\n\\nAgent 应判断：\\n\\n\u003e **这里的数据结构只是“存数据”，还是承担了“资源管理策略”？**\\n\\n例如：\\n\\n```text\\nhash table\\n```\\n\\n可能只是：\\n\\n```text\\nkey → value\\n```\\n\\n也可能实际上承担：\\n\\n```text\\nobject registry\\ndeduplication\\ncache lookup\\nresource ownership\\n```\\n\\n后者应识别为 Resource / Cache Pattern。\\n\\n---\\n\\n# 11. P8 — Recovery / Error / Consistency Pattern\\n\\n## 11.1 核心问题\\n\\n\u003e **“正常路径失败以后，系统如何保持正确？”**\\n\\n这是数据库、存储、内核、网络协议中非常重要的模式。\\n\\n---\\n\\n## 11.2 典型结构\\n\\n```text\\nNormal\\n  ↓\\nFailure\\n  ↓\\nDetect\\n  ↓\\nRollback / Cleanup\\n  ↓\\nRetry / Recover / Abort\\n```\\n\\n---\\n\\n## 11.3 需要识别\\n\\n```text\\nerror detection\\nerror propagation\\nrollback\\ncleanup\\nretry\\nrecovery\\nreplay\\ncheckpoint\\nredo\\nundo\\ntransaction abort\\nassert\\npanic\\nfatal\\n```\\n\\n尤其注意：\\n\\n```c\\ngoto cleanup;\\n```\\n\\n不能简单视为 C 语言风格问题。\\n\\n它可能描述非常重要的：\\n\\n```text\\npartial initialization\\nresource unwind\\ntransaction rollback\\n```\\n\\n---\\n\\n## 11.4 Consistency\\n\\n这一模式还包括：\\n\\n```text\\nstate consistency\\nmetadata/data consistency\\nindex/data consistency\\ncache/source consistency\\nreplica consistency\\ntransaction consistency\\n```\\n\\n---\\n\\n## 11.5 Dominant Question\\n\\n当核心问题变成：\\n\\n\u003e **“出错了之后为什么系统还能保持正确？”**\\n\\nRecovery / Consistency 为主模式。\\n\\n---\\n\\n# 12. P9 — Architecture / Subsystem Boundary Pattern\\n\\n这是跨越前面所有 Pattern 的宏观视角。\\n\\n## 核心问题\\n\\n\u003e **“这个模块在整个系统中处于什么位置，与其他模块如何分工？”**\\n\\n例如：\\n\\n```text\\nParser\\n   ↓\\nPlanner\\n   ↓\\nExecutor\\n   ↓\\nStorage\\n   ↓\\nBuffer\\n   ↓\\nOS / Disk\\n```\\n\\n它主要描述：\\n\\n```text\\nmodule boundary\\nownership boundary\\ndependency direction\\ninterface\\ncallback\\nplugin\\nlayering\\ncontrol plane / data plane\\n```\\n\\n---\\n\\n## 12.1 自动识别信号\\n\\n重点观察：\\n\\n```text\\npublic header\\nopaque struct\\nAPI\\ncallback\\nfunction pointer\\nvtable\\nregistration\\nmodule init\\nmodule shutdown\\nsubsystem manager\\n```\\n\\n以及：\\n\\n```text\\nA includes B\\nA calls B\\nA exposes interface to B\\nA receives callback from B\\n```\\n\\n---\\n\\n# 13. Pattern 的真正区别：它们回答不同的问题\\n\\n可以把 9 个 Pattern 压缩成下面这张“问题分类表”。\\n\\n| Pattern | 它主要回答的问题 |\\n|---|---|\\n| Structural | 有哪些对象？它们怎么组织？ |\\n| Lifecycle | 对象从哪里来、由谁管理、何时消失？ |\\n| Flow | 一次操作怎么走？ |\\n| State | 对象处于什么状态？怎么转换？ |\\n| Concurrency | 谁与谁并发？谁保护谁？ |\\n| Data Path | 数据怎么移动、转换？ |\\n| Resource | 资源如何查找、分配、缓存、回收？ |\\n| Recovery | 失败以后怎么恢复并保持正确？ |\\n| Architecture | 模块之间如何分层和协作？ |\\n\\n因此 Agent 的模式识别，本质上不是关键词分类，而是：\\n\\n\u003e **判断“理解这段源码时，哪一个问题最重要”。**\\n\\n---\\n\\n# 14. Dominant Pattern 识别规则\\n\\n建议 Agent 对每个候选 Pattern 计算一个概念性的相关度：\\n\\n```text\\nPatternScore =\\n    StructuralEvidence\\n  + BehavioralEvidence\\n  + RuntimeEvidence\\n  + ComplexityWeight\\n  + UserIntentWeight\\n```\\n\\n不需要真的计算数值。\\n\\n只需要遵循以下优先判断。\\n\\n---\\n\\n## 14.1 先问“核心难点是什么”\\n\\n### 如果主要是对象关系：\\n\\n```text\\nStructural\\n```\\n\\n### 如果主要是创建/释放/持有：\\n\\n```text\\nLifecycle\\n```\\n\\n### 如果主要是函数执行路径：\\n\\n```text\\nFlow\\n```\\n\\n### 如果主要是状态变化：\\n\\n```text\\nState\\n```\\n\\n### 如果主要是并发和锁：\\n\\n```text\\nConcurrency\\n```\\n\\n### 如果主要是数据移动：\\n\\n```text\\nData Path\\n```\\n\\n### 如果主要是资源管理：\\n\\n```text\\nResource\\n```\\n\\n### 如果主要是错误与恢复：\\n\\n```text\\nRecovery\\n```\\n\\n### 如果主要是模块边界：\\n\\n```text\\nArchitecture\\n```\\n\\n---\\n\\n# 15. Pattern 可以组合，但不要无脑叠加\\n\\n例如：\\n\\n```text\\nBuffer Manager\\n```\\n\\n可能识别为：\\n\\n```text\\nPrimary:\\n    Resource\\n\\nSecondary:\\n    Structural\\n    Lifecycle\\n    State\\n    Concurrency\\n    Recovery\\n```\\n\\n但不应该生成：\\n\\n```text\\n9 个平行章节\\n```\\n\\n而应该寻找一个**主线**。\\n\\n例如：\\n\\n```text\\nBuffer Manager\\n\\n主线：\\n    Resource\\n\\n辅助视角：\\n    ├── BufferDesc 结构\\n    ├── buffer 生命周期\\n    ├── pin/dirty state\\n    ├── buffer mapping 并发\\n    └── eviction/recovery\\n```\\n\\n---\\n\\n# 16. “主导 Pattern + 辅助 Pattern”模型\\n\\n推荐最终采用：\\n\\n```text\\nPatternProfile {\\n    dominant\\n    secondary[]\\n    evidence[]\\n}\\n```\\n\\n例如：\\n\\n```text\\nPatternProfile:\\n\\ndominant:\\n    Lifecycle\\n\\nsecondary:\\n    Structural\\n    Concurrency\\n\\nreason:\\n    核心问题是对象所有权与有效期，\\n    struct 关系和锁只是支撑生命周期正确性的机制。\\n```\\n\\n---\\n\\n# 17. Pattern 不能只依赖当前函数\\n\\n这是一个重要约束。\\n\\nAgent 不应该看到：\\n\\n```c\\nvoid foo(...)\\n{\\n    pthread_mutex_lock(...);\\n    ...\\n}\\n```\\n\\n就判断：\\n\\n```text\\nConcurrency Pattern\\n```\\n\\n因为这个锁可能只是整个操作中的一个细节。\\n\\n正确做法是向上下文扩展：\\n\\n```text\\n当前函数\\n    ↓\\n调用者\\n    ↓\\n被调用函数\\n    ↓\\n共享对象\\n    ↓\\n关联状态\\n    ↓\\n生命周期\\n```\\n\\n然后重新判断主导 Pattern。\\n\\n---\\n\\n# 18. Pattern 识别至少需要三层源码上下文\\n\\n```text\\nL1 Local\\n    当前文件 / 当前函数\\n\\nL2 Structural\\n    相关 struct / caller / callee / manager\\n\\nL3 System\\n    subsystem / runtime / cross-module\\n```\\n\\n例如：\\n\\n```text\\nLockAcquire()\\n```\\n\\n单看函数：\\n\\n```text\\nFlow\\n```\\n\\n扩展到：\\n\\n```text\\nLOCALLOCK\\nLOCK\\nPROCLOCK\\nPGPROC\\nfast-path\\nlock table\\nLWLock\\nwait queue\\n```\\n\\n之后：\\n\\n```text\\nConcurrency\\n+\\nState\\n+\\nStructural\\n```\\n\\n才是完整理解。\\n\\n---\\n\\n# 19. Pattern 识别的上下文窗口\\n\\nAgent 不应该无限制扩展源码。\\n\\n推荐采用：\\n\\n```text\\nContext Expansion\\n\\n1. Symbol\\n2. Direct callers/callees\\n3. Referenced structs/fields\\n4. Relevant global structures\\n5. Related synchronization\\n6. Relevant lifecycle functions\\n7. Cross-module API when necessary\\n```\\n\\n形成：\\n\\n```text\\nLocal Symbol\\n    ↓\\nImmediate Graph\\n    ↓\\nKnowledge Graph\\n```\\n\\n只有当当前层无法解释核心语义时，才继续向外扩展。\\n\\n---\\n\\n# 20. Pattern 识别中的“反模式”\\n\\nAgent 必须避免以下错误。\\n\\n## 20.1 调用图 ≠ Flow\\n\\n```text\\nA calls B\\nB calls C\\n```\\n\\n不一定意味着：\\n\\n```text\\nA → B → C\\n```\\n\\n可能存在：\\n\\n```text\\ncallback\\nparallel execution\\noptional branch\\ndeferred execution\\n```\\n\\n---\\n\\n## 20.2 指针关系 ≠ Ownership\\n\\n```c\\na-\u003eb = b;\\n```\\n\\n只能说明：\\n\\n```text\\npoints_to / references\\n```\\n\\n不能直接推断：\\n\\n```text\\nowns\\n```\\n\\n---\\n\\n## 20.3 锁存在 ≠ Concurrency 主模式\\n\\n锁可能只是实现细节。\\n\\n必须证明：\\n\\n```text\\nshared state\\n+\\nconcurrent access\\n+\\nsynchronization semantics\\n```\\n\\n---\\n\\n## 20.4 enum ≠ 完整 State Machine\\n\\n必须继续寻找：\\n\\n```text\\nstate transition\\ntransition condition\\nstate invariant\\n```\\n\\n---\\n\\n## 20.5 数据结构 ≠ Resource Pattern\\n\\n只有当该结构承担：\\n\\n```text\\nallocation\\nlookup\\nreuse\\neviction\\nreclaim\\ndeduplication\\n```\\n\\n等资源管理语义时，才应提升为 Resource Pattern。\\n\\n---\\n\\n# 21. Pattern 与知识模型的映射\\n\\nPattern 不产生新的知识类型，而是决定：\\n\\n\u003e **哪些 Knowledge Entity 应该成为主角。**\\n\\n例如：\\n\\n### Structural\\n\\n```text\\nEntity\\n   +\\nRelation\\n```\\n\\n### Lifecycle\\n\\n```text\\nEntity\\n   +\\nRelation\\n   +\\nLifecycle\\n   +\\nOwnership\\n```\\n\\n### Flow\\n\\n```text\\nEntity\\n   +\\nFlow\\n   +\\nCondition\\n   +\\nEvidence\\n```\\n\\n### State\\n\\n```text\\nEntity\\n   +\\nState\\n   +\\nTransition\\n   +\\nInvariant\\n```\\n\\n### Concurrency\\n\\n```text\\nEntity\\n   +\\nConcurrency\\n   +\\nRelation\\n   +\\nInvariant\\n```\\n\\n### Data Path\\n\\n```text\\nEntity\\n   +\\nData Relation\\n   +\\nFlow\\n   +\\nTransformation\\n```\\n\\n### Resource\\n\\n```text\\nEntity\\n   +\\nManagement Relation\\n   +\\nState\\n   +\\nPolicy\\n```\\n\\n### Recovery\\n\\n```text\\nFlow\\n   +\\nError\\n   +\\nState\\n   +\\nInvariant\\n```\\n\\n### Architecture\\n\\n```text\\nSubsystem\\n   +\\nDependency\\n   +\\nInterface\\n   +\\nOwnership Boundary\\n```\\n\\n---\\n\\n# 22. Pattern 是后续表达选择的输入\\n\\nStep 2 只负责：\\n\\n```text\\n源码\\n ↓\\nPattern Profile\\n```\\n\\n下一步 Step 3 才负责：\\n\\n```text\\nPattern Profile\\n ↓\\nRepresentation Strategy\\n```\\n\\n例如：\\n\\n```text\\nStructural\\n    → 关系图 / 实体表\\n\\nLifecycle\\n    → 生命周期图\\n\\nFlow\\n    → 流程图 / 时序\\n\\nState\\n    → 状态机\\n\\nConcurrency\\n    → 并发关系图 / 锁关系图\\n\\nData Path\\n    → 数据路径图\\n\\nResource\\n    → 管理结构图 + 策略说明\\n\\nRecovery\\n    → 正常/异常双路径\\n\\nArchitecture\\n    → 模块关系图\\n```\\n\\n因此：\\n\\n```text\\nPattern ≠ Diagram\\n```\\n\\n这是本规范的重要边界。\\n\\n---\\n\\n# 23. 最终的 Pattern Recognition Pipeline\\n\\nAgent 后续可以采用：\\n\\n```text\\n                    Source Code\\n                         │\\n                         ▼\\n                ┌─────────────────┐\\n                │ Extract Evidence│\\n                └────────┬────────┘\\n                         │\\n                         ▼\\n                ┌─────────────────┐\\n                │ Build Knowledge  │\\n                │     Graph        │\\n                └────────┬────────┘\\n                         │\\n                         ▼\\n                ┌─────────────────┐\\n                │ Detect Patterns  │\\n                └────────┬────────┘\\n                         │\\n             ┌───────────┼────────────┐\\n             ↓           ↓            ↓\\n         Structural    Flow       Concurrency\\n             │           │            │\\n             └───────────┼────────────┘\\n                         ↓\\n                 Pattern Profile\\n                         │\\n                   dominant +\\n                    secondary\\n                         │\\n                         ▼\\n                  Representation\\n```\\n\\n---\\n\\n# 24. 一个完整例子：TupleTableSlot\\n\\n假设 Agent 阅读：\\n\\n```text\\nTupleTableSlot\\ntts_tuple\\ntts_values\\ntts_isnull\\nExecStoreHeapTuple()\\nExecClearTuple()\\nExecMaterializeSlot()\\n```\\n\\n识别结果不应该只是：\\n\\n```text\\n“这是 TupleTableSlot 结构体介绍”\\n```\\n\\n而应得到：\\n\\n```text\\nPatternProfile\\n\\ndominant:\\n    Lifecycle\\n\\nsecondary:\\n    Structural\\n    Data Path\\n```\\n\\n原因：\\n\\n```text\\nStructural:\\n    Slot → Tuple\\n\\nLifecycle:\\n    Empty\\n      ↓\\n    Store\\n      ↓\\n    Use\\n      ↓\\n    Materialize\\n      ↓\\n    Clear\\n\\nData Path:\\n    HeapTuple\\n        ↓\\n    TupleTableSlot\\n        ↓\\n    executor\\n```\\n\\n于是后面文档就会自然形成：\\n\\n```text\\nSlot 是什么\\n    ↓\\nSlot 管理哪些对象\\n    ↓\\nTuple 如何进入 Slot\\n    ↓\\nSlot 如何处于不同状态\\n    ↓\\nSlot 如何被清空/重用\\n```\\n\\n而不是简单逐个解释字段。\\n\\n---\\n\\n# 25. 一个完整例子：Lock Manager\\n\\n例如：\\n\\n```text\\nLockAcquire()\\nLockAcquireExtended()\\nSetupLockInTable()\\nGrantLock()\\nWaitOnLock()\\n```\\n\\n识别结果可能是：\\n\\n```text\\nPatternProfile\\n\\ndominant:\\n    Concurrency\\n\\nsecondary:\\n    Flow\\n    Structural\\n    State\\n    Resource\\n```\\n\\n原因：\\n\\n```text\\nStructural:\\n    LOCALLOCK\\n        ↓\\n      LOCK\\n        ↓\\n    PROCLOCK\\n\\nFlow:\\n    request\\n      ↓\\n    fast-path?\\n      ↓\\n    main lock table\\n      ↓\\n    conflict?\\n      ↓\\n    grant / wait\\n\\nState:\\n    requested\\n      ↓\\n    waiting\\n      ↓\\n    granted\\n\\nConcurrency:\\n    lock conflict\\n    LWLock\\n    wait queue\\n    ownership\\n\\nResource:\\n    lock table\\n    hash lookup\\n```\\n\\n这里就说明了一个重要问题：\\n\\n\u003e **一个真正好的源码章节，通常不是一个 Pattern，而是一个主导 Pattern 带几个辅助 Pattern。**\\n\\n---\\n\\n# 26. Step 2 的验收标准\\n\\nStep 2 不需要证明 Agent 已经能够生成漂亮文档。\\n\\n只需要证明 Agent 面对源码时能够做到：\\n\\n```text\\n1. 识别核心理解问题\\n\\n2. 判断 Dominant Pattern\\n\\n3. 找出 Secondary Patterns\\n\\n4. 给出判断依据\\n\\n5. 指出支撑这些判断的源码 Evidence\\n\\n6. 不因单个关键词误判 Pattern\\n\\n7. 能跨函数 / struct / module 扩展上下文\\n\\n8. 能区分 FACT / INFERENCE / INTERPRETATION\\n```\\n\\n最终输出类似：\\n\\n```text\\nSubject:\\n    Buffer Manager\\n\\nDominant Pattern:\\n    Resource\\n\\nSecondary:\\n    Structural\\n    Lifecycle\\n    State\\n    Concurrency\\n    Recovery\\n\\nCore Question:\\n    shared buffer 如何被查找、分配、固定、修改、\\n    淘汰以及在并发环境下安全管理？\\n\\nEvidence:\\n    BufferDesc\\n    BufTable\\n    ReadBuffer()\\n    BufferAlloc()\\n    PinBuffer()\\n    UnpinBuffer()\\n```\\n\\n这就是 Step 2 的核心产物。\\n\\n---\\n\\n# 27. Step 2 完成后的整体架构\\n\\n目前整个体系应该已经变成：\\n\\n```text\\n                ┌────────────────────┐\\n                │    C/C++ Source    │\\n                └─────────┬──────────┘\\n                          ↓\\n                ┌────────────────────┐\\n                │   Knowledge Model  │\\n                │                    │\\n                │ Entity             │\\n                │ Relation           │\\n                │ Flow               │\\n                │ State              │\\n                │ Lifecycle          │\\n                │ Concurrency        │\\n                │ Constraint         │\\n                │ Evidence           │\\n                └─────────┬──────────┘\\n                          ↓\\n                ┌────────────────────┐\\n                │  Pattern Detection │\\n                │                    │\\n                │ Dominant           │\\n                │ Secondary          │\\n                └─────────┬──────────┘\\n                          ↓\\n                ┌────────────────────┐\\n                │ Representation     │\\n                │      Strategy      │\\n                └─────────┬──────────┘\\n                          ↓\\n                ┌────────────────────┐\\n                │   Document / View  │\\n                └────────────────────┘\\n```\\n:::\\n\\n这里我认为 **Step 2 有一个很重要的设计结论已经可以固定下来**：\\n\\n\u003e **Pattern 不能设计成“章节模板”，而应该设计成“理解问题模板”。**\\n\\n这样你的 Skill 才不会变成：\\n\\n```text\\n看到 struct → 生成结构体模板\\n看到函数 → 生成流程图\\n看到 lock → 生成锁图\\n```\\n\\n这种比较机械的系统。\\n\\n更合理的是让 Agent 先判断：\\n\\n```text\\n          “这段源码真正难在哪里？”\\n                    │\\n      ┌─────────────┼─────────────┐\\n      ↓             ↓             ↓\\n   对象关系       行为流程       并发语义\\n      ↓             ↓             ↓\\n Structural       Flow       Concurrency\\n```\\n\\n然后允许组合：\\n\\n```text\\nDominant Pattern\\n      +\\nSecondary Patterns\\n      +\\nEvidence\\n```\\n\\n这样 **Step 3** 就非常自然了：我们下一步不是设计“Markdown 模板”，而是建立 **`Pattern → Representation Strategy` 映射**——明确什么情况下应该用实体关系图、生命周期图、状态机、时序图、数据路径图、表格，以及**什么时候反而不应该画图**。\",{},{\"_168\":2187,\"_175\":2453,\"_54\":2454,\"_56\":2454,\"_179\":2455,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":2456,\"_188\":189},\"e95a9dfe-a9b0-4e77-a198-29787d517758\",[2173],{\"_250\":251,\"_186\":2460},1789653411.335875,{\"_245\":272,\"_179\":2144},{\"_260\":261,\"_262\":2139,\"_264\":2457,\"_266\":2458,\"_268\":269,\"_207\":208,\"_209\":34,\"_210\":2200,\"_212\":213,\"_214\":2201,\"_216\":2201,\"_201\":202,\"_217\":202,\"_66\":67,\"_218\":2459,\"_220\":14,\"_221\":2451,\"_222\":2203,\"_271\":34,\"_224\":10},1789653406.1855445,1789653411.2208238,[225],{},{\"_168\":2451,\"_175\":2464,\"_54\":2465,\"_56\":2465,\"_179\":2466,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":2467,\"_188\":189},\"5cc0e1c2-e46c-4b3d-99ef-59fbe66fa953\",[2187],{\"_250\":251,\"_186\":2478},1789653411.322109,{\"_245\":299,\"_299\":2473,\"_301\":2474},{\"_282\":2468,\"_260\":284,\"_285\":286,\"_287\":2469,\"_289\":290,\"_264\":2457,\"_207\":208,\"_291\":292,\"_209\":34,\"_210\":2200,\"_212\":213,\"_214\":2201,\"_216\":2201,\"_201\":202,\"_217\":202,\"_66\":67,\"_218\":2470,\"_220\":14,\"_221\":2462,\"_222\":2203,\"_271\":34,\"_224\":10},{\"_295\":2471},[294],[22
