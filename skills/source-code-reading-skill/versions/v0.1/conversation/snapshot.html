4\":805,\"_556\":806,\"_558\":807,\"_560\":808,\"_562\":809,\"_564\":810,\"_566\":811,\"_568\":812,\"_570\":813,\"_572\":814,\"_574\":815,\"_576\":816,\"_578\":817,\"_580\":818,\"_582\":819,\"_584\":820,\"_586\":821,\"_588\":822,\"_590\":823,\"_592\":824,\"_594\":825,\"_596\":826,\"_598\":827,\"_600\":828,\"_829\":830,\"_831\":832,\"_833\":834,\"_835\":836,\"_837\":838,\"_839\":840,\"_841\":842,\"_843\":844,\"_845\":846,\"_847\":848,\"_849\":850,\"_851\":852,\"_853\":854,\"_855\":856,\"_857\":858,\"_859\":860,\"_861\":862,\"_863\":864,\"_865\":866,\"_867\":868,\"_869\":870,\"_871\":872,\"_873\":874,\"_875\":876,\"_877\":878,\"_879\":880,\"_881\":882,\"_883\":884,\"_885\":886,\"_887\":888,\"_889\":890,\"_891\":892,\"_893\":894,\"_895\":896,\"_897\":898,\"_899\":900,\"_901\":902,\"_903\":904,\"_905\":906,\"_907\":908,\"_909\":910,\"_911\":912,\"_913\":914,\"_915\":916,\"_917\":918,\"_919\":920,\"_921\":922,\"_923\":924,\"_925\":926,\"_927\":928,\"_929\":930,\"_931\":932,\"_933\":934},[],\"9a4a56f5-eff1-4ed2-9100-750765226b81\",\"2b97d005-c380-4c0e-9d1b-619716d6edac\",[225],\"e5d45a89-1bbf-42c6-a056-4d1b516b1d43\",\"writing_blocks\",{\"_738\":739},\"68214\",{\"_740\":741,\"_179\":742,\"_743\":226,\"_53\":744,\"_168\":738,\"_186\":745,\"_235\":34,\"_746\":747,\"_748\":747},\"variant\",\"document\",\"# 大型 C/C++ 源码阅读 Agent Skill 设计规范 v0.1\\n\\n# 1. Skill 的目标\\n\\n本 Skill 用于：\\n\\n\u003e 从大型 C/C++ 项目源码中提取可验证的知识模型，识别主导理解模式，选择适合的表达方式，并生成可继续追踪源码的阅读文档。\\n\\n目标不是：\\n\\n```text id=\\\"32ozlq\\\"\\nSource → Summary\\n```\\n\\n而是：\\n\\n```text id=\\\"3h5s1r\\\"\\nSource\\n  ↓\\nUnderstand\\n  ↓\\nModel\\n  ↓\\nRecognize Pattern\\n  ↓\\nTrace Evidence\\n  ↓\\nRepresent\\n  ↓\\nGenerate Document\\n  ↓\\nValidate\\n```\\n\\n最终产物应满足：\\n\\n```text id=\\\"v8d9jh\\\"\\n读者能够理解\\n+\\n读者能够验证\\n+\\n读者能够继续读源码\\n```\\n\\n---\\n\\n# 2. Skill 的总体架构\\n\\n采用：\\n\\n```text id=\\\"n0j2sh\\\"\\n┌────────────────────────────────────────────┐\\n│             Source Reading Skill           │\\n│                                            │\\n│  ┌──────────────────────────────────────┐  │\\n│  │          Orchestrator                │  │\\n│  └────────────────┬─────────────────────┘  │\\n│                   │                        │\\n│       ┌───────────┼────────────┐           │\\n│       ↓           ↓            ↓           │\\n│    Explorer     Modeler      Tracer        │\\n│       │           │            │           │\\n│       └───────────┼────────────┘           │\\n│                   ↓                        │\\n│             Pattern Detector              │\\n│                   ↓                        │\\n│           Representation Planner           │\\n│                   ↓                        │\\n│            Document Generator              │\\n│                   ↓                        │\\n│              Validator                    │\\n└────────────────────────────────────────────┘\\n```\\n\\n不建议拆成很多互相独立的 Skill。\\n\\n推荐：\\n\\n\u003e **一个总 Skill，内部采用模块化规则。**\\n\\n原因是整个过程存在强依赖：\\n\\n```text id=\\\"8bs3b7\\\"\\nKnowledge\\n   ↓\\nPattern\\n   ↓\\nRepresentation\\n   ↓\\nTrace\\n   ↓\\nDocument\\n```\\n\\n任何一层都需要消费上一层的中间结果。\\n\\n---\\n\\n# 3. Skill 的核心原则\\n\\n## 3.1 不允许直接生成最终文档\\n\\nAgent 首先必须建立：\\n\\n```text id=\\\"v3m8n1\\\"\\nKnowledge Model\\n```\\n\\n再建立：\\n\\n```text id=\\\"yw1v0u\\\"\\nPattern Profile\\n```\\n\\n再建立：\\n\\n```text id=\\\"5f4y9e\\\"\\nRepresentation Plan\\n```\\n\\n再建立：\\n\\n```text id=\\\"7u7v4r\\\"\\nTrace Map\\n```\\n\\n最终才生成：\\n\\n```text id=\\\"z4m6vy\\\"\\nDocument\\n```\\n\\n---\\n\\n# 4. Agent 的内部状态机\\n\\nSkill 的核心执行流程定义为：\\n\\n```text id=\\\"1q2xk7\\\"\\nINIT\\n  ↓\\nSCOPE\\n  ↓\\nEXPLORE\\n  ↓\\nMODEL\\n  ↓\\nPATTERN\\n  ↓\\nTRACE\\n  ↓\\nREPRESENT\\n  ↓\\nGENERATE\\n  ↓\\nVALIDATE\\n  ↓\\nREVISE ─────────┐\\n  ↑             │\\n  └─────────────┘\\n        ↓\\n      FINAL\\n```\\n\\n---\\n\\n# 5. Phase 0 — INIT\\n\\n读取：\\n\\n```text id=\\\"5j3v3b\\\"\\n用户任务\\n源码仓库\\n版本/commit\\n已有文档\\n项目结构\\n```\\n\\n确定：\\n\\n```text id=\\\"s0y2m8\\\"\\nsubject\\nscope\\ndepth\\nreader\\ngoal\\n```\\n\\n例如：\\n\\n```text id=\\\"z3q2ne\\\"\\nsubject:\\n    PostgreSQL Buffer Manager\\n\\nscope:\\n    BufferTag → BufTable → BufferDesc\\n\\ngoal:\\n    理解 Buffer lookup\\n\\ndepth:\\n    Core + selected implementation details\\n```\\n\\n---\\n\\n# 6. Phase 1 — SCOPE\\n\\n首先确定研究边界。\\n\\nAgent 必须回答：\\n\\n```text id=\\\"69sj6f\\\"\\n研究对象是什么？\\n核心问题是什么？\\n涉及哪些模块？\\n哪些模块暂时不展开？\\n```\\n\\n形成：\\n\\n```text id=\\\"8y1qyr\\\"\\nScope {\\n    subject\\n    core_questions[]\\n    included_modules[]\\n    excluded_modules[]\\n    depth\\n}\\n```\\n\\n---\\n\\n# 7. Scope Boundary 原则\\n\\nSkill 必须主动建立边界。\\n\\n例如：\\n\\n```text id=\\\"f8m8pk\\\"\\nBuffer Lookup\\n\\nIN:\\n    BufferTag\\n    BufTable\\n    BufferDesc\\n    hash\\n    partition lock\\n\\nOUT:\\n    page replacement policy\\n    WAL\\n    filesystem\\n```\\n\\n除非后续发现无法解释当前问题，否则不扩大范围。\\n\\n---\\n\\n# 8. Phase 2 — EXPLORE\\n\\nExplorer 的职责不是总结。\\n\\nExplorer 负责：\\n\\n\u003e **建立源码搜索空间。**\\n\\n主要动作：\\n\\n```text id=\\\"jh5l8f\\\"\\nfind symbol\\nfind definition\\nfind callers\\nfind callees\\nfind field readers\\nfind field writers\\nfind references\\nfind lock operations\\nfind allocation/free\\nfind state transitions\\n```\\n\\n---\\n\\n# 9. Explorer 的上下文扩展\\n\\n使用逐级扩展：\\n\\n```text id=\\\"05aotg\\\"\\nL0 Target Symbol\\n    ↓\\nL1 Direct Definition\\n    ↓\\nL2 Direct References\\n    ↓\\nL3 Related Structures\\n    ↓\\nL4 Related Control Flow\\n    ↓\\nL5 Related Runtime / Synchronization\\n    ↓\\nL6 Cross-module\\n```\\n\\n每次扩展都必须回答：\\n\\n\u003e **这一步是在解决哪个未知问题？**\\n\\n如果不能回答，就停止扩展。\\n\\n---\\n\\n# 10. Explorer 不负责解释设计意图\\n\\n例如 Explorer 找到：\\n\\n```c id=\\\"6p2e4s\\\"\\nspin_lock(...)\\n```\\n\\nExplorer 记录：\\n\\n```text id=\\\"l3v8q9\\\"\\nFACT:\\n    Function acquires spinlock.\\n```\\n\\n但不立即写：\\n\\n```text id=\\\"r6e5p2\\\"\\n这是为了减少并发竞争。\\n```\\n\\n这种解释留给：\\n\\n```text id=\\\"j5p9y0\\\"\\nModeler\\n+\\nPattern Detector\\n+\\nTrace Analyzer\\n```\\n\\n---\\n\\n# 11. Phase 3 — MODEL\\n\\nModeler 把 Explorer 的源码事实转化成：\\n\\n```text id=\\\"1a5q1t\\\"\\nKnowledge Model\\n```\\n\\n核心对象：\\n\\n```text id=\\\"x8z3g4\\\"\\nEntity\\nRelation\\nFlow\\nState\\nLifecycle\\nConcurrency\\nConstraint\\nEvidence\\n```\\n\\n---\\n\\n# 12. Knowledge Model Schema\\n\\n推荐内部采用类似：\\n\\n```yaml id=\\\"k0v5ne\\\"\\nknowledge:\\n  entities:\\n    - id:\\n      name:\\n      kind:\\n      role:\\n      source:\\n\\n  relations:\\n    - subject:\\n      predicate:\\n      object:\\n      condition:\\n      evidence:\\n\\n  flows:\\n    - id:\\n      trigger:\\n      steps:\\n      branches:\\n      effects:\\n\\n  states:\\n    - entity:\\n      states:\\n      transitions:\\n      evidence:\\n\\n  lifecycles:\\n    - entity:\\n      stages:\\n      ownership:\\n      evidence:\\n\\n  concurrency:\\n    - shared_object:\\n      participants:\\n      synchronization:\\n      protected_state:\\n      evidence:\\n\\n  constraints:\\n    - type:\\n      statement:\\n      evidence:\\n\\n  claims:\\n    - statement:\\n      type:\\n      evidence:\\n      trace:\\n      confidence:\\n```\\n\\n它不是要求实际永远输出 YAML。\\n\\n这是：\\n\\n\u003e **Agent 的内部中间表示。**\\n\\n---\\n\\n# 13. Claim 是整个 Skill 的核心原子\\n\\n最终真正需要验证的是：\\n\\n```text id=\\\"8b8n4c\\\"\\nClaim\\n```\\n\\n而不是：\\n\\n```text id=\\\"l0o3ph\\\"\\nParagraph\\n```\\n\\n例如：\\n\\n```text id=\\\"q2x2c8\\\"\\nClaim:\\n    BufferDesc.state 表示 buffer header 状态。\\n\\nType:\\n    FACT\\n\\nEvidence:\\n    BufferDesc definition\\n    BUF_STATE_* macros\\n    state readers/writers\\n\\nConfidence:\\n    High\\n```\\n\\n文档只是 Claim 的一种展示方式。\\n\\n---\\n\\n# 14. Phase 4 — PATTERN\\n\\nPattern Detector 消费：\\n\\n```text id=\\\"k2b2n7\\\"\\nKnowledge Model\\n```\\n\\n输出：\\n\\n```text id=\\\"x3x7c9\\\"\\nPattern Profile\\n```\\n\\n支持：\\n\\n```text id=\\\"8gu2j0\\\"\\nStructural\\nLifecycle\\nFlow\\nState\\nConcurrency\\nData Path\\nResource\\nRecovery\\nArchitecture\\n```\\n\\n---\\n\\n# 15. Pattern Detector 的工作方式\\n\\n不是：\\n\\n```text id=\\\"m9f8j1\\\"\\n关键词 → Pattern\\n```\\n\\n而是：\\n\\n```text id=\\\"y6r8b2\\\"\\nKnowledge Graph\\n      ↓\\nCore Question\\n      ↓\\nComplexity\\n      ↓\\nPattern Candidates\\n      ↓\\nDominant Pattern\\n      ↓\\nSecondary Patterns\\n```\\n\\n---\\n\\n# 16. Pattern Profile\\n\\n内部模型：\\n\\n```yaml id=\\\"5s2l8v\\\"\\npattern_profile:\\n  dominant:\\n    name:\\n    reason:\\n\\n  secondary:\\n    - name:\\n      reason:\\n\\n  core_question:\\n\\n  supporting_knowledge:\\n    entities: []\\n    flows: []\\n    states: []\\n    constraints: []\\n```\\n\\n例如：\\n\\n```text id=\\\"2f3j1k\\\"\\ndominant:\\n    Concurrency\\n\\nsecondary:\\n    Flow\\n    Structural\\n    State\\n\\ncore_question:\\n    多个 backend 如何共享并发地申请和等待 lock？\\n```\\n\\n---\\n\\n# 17. Phase 5 — TRACE\\n\\nTracer 消费：\\n\\n```text id=\\\"cf4w8m\\\"\\nClaims\\n+\\nKnowledge Model\\n```\\n\\n建立：\\n\\n```text id=\\\"z7m1w6\\\"\\nClaim → Evidence → Source\\n```\\n\\n---\\n\\n# 18. Trace Engine 的核心任务\\n\\n对于每一个重要 Claim：\\n\\n```text id=\\\"c3v1b2\\\"\\n1. 找定义\\n2. 找使用\\n3. 找修改\\n4. 找调用\\n5. 找约束\\n6. 必要时跨模块\\n```\\n\\n形成：\\n\\n```text id=\\\"j0d2w7\\\"\\nSource Trace\\n```\\n\\n---\\n\\n# 19. Trace Depth\\n\\n支持：\\n\\n```text id=\\\"7s0k2e\\\"\\nD1 Local\\nD2 Structural\\nD3 System\\n```\\n\\nAgent 根据 Claim 的复杂度选择深度。\\n\\n例如：\\n\\n```text id=\\\"8yg0c3\\\"\\n“这个字段存在”\\n→ D1\\n\\n“这个字段表示某状态”\\n→ D2\\n\\n“这个机制为什么跨模块设计”\\n→ D3\\n```\\n\\n---\\n\\n# 20. Trace 的停止条件\\n\\n必须在：\\n\\n```text id=\\\"j2v5q9\\\"\\nClaim 已证明\\n```\\n\\n时停止。\\n\\n不能因为：\\n\\n```text id=\\\"4o3m1k\\\"\\n“还能继续往下读”\\n```\\n\\n就无限扩展。\\n\\n---\\n\\n# 21. Trace Failure\\n\\n如果 Claim 无法证明：\\n\\nAgent 不得补充猜测。\\n\\n状态应该是：\\n\\n```text id=\\\"2a8n4w\\\"\\nUNVERIFIED\\n```\\n\\n并记录：\\n\\n```text id=\\\"q7z3y5\\\"\\nmissing_evidence:\\n    state transition writer not found\\n```\\n\\n最终文档可以：\\n\\n```text id=\\\"j8w4s1\\\"\\n当前源码可以确认……\\n但尚不足以确认……\\n```\\n\\n---\\n\\n# 22. Phase 6 — REPRESENT\\n\\nRepresentation Planner 消费：\\n\\n```text id=\\\"n2c6h5\\\"\\nPattern Profile\\n+\\nKnowledge Model\\n+\\nTrace\\n+\\nUser Intent\\n```\\n\\n输出：\\n\\n```text id=\\\"9v5w4k\\\"\\nRepresentation Plan\\n```\\n\\n---\\n\\n# 23. Representation Plan\\n\\n```yaml id=\\\"x0z9u2\\\"\\nrepresentation:\\n  primary:\\n    type:\\n    purpose:\\n\\n  secondary:\\n    - type:\\n      purpose:\\n\\n  text:\\n    concepts: []\\n    explanations: []\\n\\n  source:\\n    anchors: []\\n    snippets: []\\n\\n  exclusions:\\n    - \\n```\\n\\n例如：\\n\\n```text id=\\\"h2p7y8\\\"\\nprimary:\\n    Synchronization View\\n\\nsecondary:\\n    Entity Relationship\\n    Sequence\\n\\nsource:\\n    LockAcquire()\\n    GrantLock()\\n    WaitOnLock()\\n\\nexclusions:\\n    full call graph\\n```\\n\\n---\\n\\n# 24. Phase 7 — GENERATE\\n\\nDocument Generator 不再分析源码。\\n\\n它只消费：\\n\\n```text id=\\\"w5d2k4\\\"\\nKnowledge Model\\nPattern Profile\\nRepresentation Plan\\nTrace\\n```\\n\\n因此它的工作变得非常简单：\\n\\n```text id=\\\"4s6r8c\\\"\\nModel\\n ↓\\nProjection\\n ↓\\nMarkdown / Mermaid / Code\\n```\\n\\n---\\n\\n# 25. Document Generator 的责任边界\\n\\n它可以决定：\\n\\n```text id=\\\"4r1m8f\\\"\\n章节标题\\n段落顺序\\n图的位置\\n代码片段的位置\\n表格\\n交叉引用\\n```\\n\\n但不能重新发明：\\n\\n```text id=\\\"4y0k3z\\\"\\n事实\\n关系\\n设计动机\\n源码结论\\n```\\n\\n否则会绕过 Traceability。\\n\\n---\\n\\n# 26. Phase 8 — VALIDATE\\n\\n这是 Skill 与普通 Prompt 最大的区别之一。\\n\\n生成以后必须重新检查：\\n\\n```text id=\\\"5v6m0c\\\"\\nDocument\\n    ↓\\nValidation\\n```\\n\\n---\\n\\n# 27. Validation 分成五层\\n\\n```text id=\\\"8o5p3x\\\"\\nV1 Structural Validation\\nV2 Semantic Validation\\nV3 Trace Validation\\nV4 Representation Validation\\nV5 Reader Validation\\n```\\n\\n---\\n\\n# 28. V1 Structural Validation\\n\\n检查：\\n\\n```text id=\\\"q4r2n7\\\"\\n是否存在 Core Question？\\n是否存在 Mental Model？\\n是否存在 Primary View？\\n是否存在 Source Navigation？\\n是否存在 Key Conclusions？\\n```\\n\\n---\\n\\n# 29. V2 Semantic Validation\\n\\n检查：\\n\\n```text id=\\\"m7k8v2\\\"\\n图中的关系是否真的存在？\\nState 是否有真实 transition？\\nOwnership 是否有证据？\\nLock 是否真的保护所描述对象？\\nData Path 是否搞错 copy/reference？\\n```\\n\\n这是防止“图看起来很专业但语义错误”。\\n\\n---\\n\\n# 30. V3 Trace Validation\\n\\n这是最关键的一层。\\n\\n逐个检查：\\n\\n```text id=\\\"6z2f7w\\\"\\n重要 Claim\\n    ↓\\nEvidence\\n    ↓\\nSource\\n```\\n\\n如果某个 Claim 没有 Evidence：\\n\\n```text id=\\\"9p5x1j\\\"\\n标记：\\n    UNVERIFIED\\n```\\n\\n或者删除。\\n\\n---\\n\\n# 31. V4 Representation Validation\\n\\n检查：\\n\\n```text id=\\\"2m7k1c\\\"\\nPrimary View 是否与 Dominant Pattern 一致？\\n是否图太复杂？\\n是否存在不必要图？\\n是否存在图文重复？\\n是否把 Call Graph 当 Flow？\\n是否把 State 当 Lifecycle？\\n```\\n\\n---\\n\\n# 32. V5 Reader Validation\\n\\n模拟一个第一次读这个模块的人：\\n\\n```text id=\\\"7q6y2m\\\"\\n看完以后：\\n    知道这是什么吗？\\n\\n知道核心对象吗？\\n\\n知道核心关系吗？\\n\\n知道运行时怎么走吗？\\n\\n知道关键状态吗？\\n\\n知道并发约束吗？\\n\\n知道源码入口吗？\\n\\n知道下一步读哪里吗？\\n```\\n\\n如果答案是否定的，进入：\\n\\n```text id=\\\"v4j8k5\\\"\\nREVISE\\n```\\n\\n---\\n\\n# 33. Revision Loop\\n\\nSkill 不应该：\\n\\n```text id=\\\"z1y2x3\\\"\\n一次生成 → 结束\\n```\\n\\n而应该：\\n\\n```text id=\\\"j4k5l6\\\"\\nGenerate\\n   ↓\\nValidate\\n   ↓\\nFailure?\\n ┌───────┴────────┐\\n No               Yes\\n ↓                 ↓\\nFinal            Revise\\n                   ↓\\n                Validate\\n```\\n\\n最多允许有限轮次，例如：\\n\\n```text id=\\\"7t8u9v\\\"\\nMAX_REVISION = 2~3\\n```\\n\\n避免 Agent 无休止自我修改。\\n\\n---\\n\\n# 34. Skill 的模块划分\\n\\n建议目录最终设计成：\\n\\n```text id=\\\"g9h2j7\\\"\\n/source-reading-skill/\\n│\\n├── SKILL.md\\n│\\n├── model/\\n│   ├── knowledge-model.md\\n│   ├── claim-model.md\\n│   └── evidence-model.md\\n│\\n├── patterns/\\n│   ├── pattern-catalog.md\\n│   ├── structural.md\\n│   ├── lifecycle.md\\n│   ├── flow.md\\n│   ├── state.md\\n│   ├── concurrency.md\\n│   ├── data-path.md\\n│   ├── resource.md\\n│   ├── recovery.md\\n│   └── architecture.md\\n│\\n├── representation/\\n│   ├── representation-policy.md\\n│   ├── entity-view.md\\n│   ├── flow-view.md\\n│   ├── state-view.md\\n│   ├── lifecycle-view.md\\n│   ├── sequence-view.md\\n│   ├── concurrency-view.md\\n│   └── architecture-view.md\\n│\\n├── tracing/\\n│   ├── trace-policy.md\\n│   ├── source-anchor.md\\n│   └── claim-verification.md\\n│\\n├── document/\\n│   ├── document-policy.md\\n│   ├── section-policy.md\\n│   └── style.md\\n│\\n└── validation/\\n    ├── validation-policy.md\\n    ├── semantic-check.md\\n    └── document-check.md\\n```\\n\\n这里的思想是：\\n\\n\u003e `SKILL.md` 负责“怎么工作”，各规则文件负责“具体规则是什么”。\\n\\n---\\n\\n# 35. SKILL.md 不应该很长\\n\\n未来真正执行 Skill 时：\\n\\n```text id=\\\"9h8j7k\\\"\\nSKILL.md\\n```\\n\\n应该只包含：\\n\\n```text id=\\\"w1x2y3\\\"\\n目标\\n输入\\n主流程\\n状态机\\n何时读取哪个 rule\\n输出\\n强制检查\\n```\\n\\n而不是把所有 Pattern 规则全部塞进一个文件。\\n\\n这样后面维护时：\\n\\n```text id=\\\"a4b5c6\\\"\\n修改 State Pattern\\n```\\n\\n不会影响：\\n\\n```text id=\\\"d7e8f9\\\"\\nConcurrency\\nDocument\\nTrace\\n```\\n\\n---\\n\\n# 36. 推荐的 Orchestrator 逻辑\\n\\nSkill 的核心控制逻辑可以抽象成：\\n\\n```text id=\\\"p3q4r5\\\"\\nRead User Intent\\n        ↓\\nDefine Scope\\n        ↓\\nExplore Source\\n        ↓\\nBuild Knowledge Model\\n        ↓\\nDetect Dominant Pattern\\n        ↓\\nBuild Trace\\n        ↓\\nBuild Representation Plan\\n        ↓\\nGenerate Document\\n        ↓\\nValidate\\n        ↓\\nRevise if needed\\n        ↓\\nReturn\\n```\\n\\n---\\n\\n# 37. Agent 的强制规则\\n\\n这是未来 SKILL.md 中最重要的部分。\\n\\n```text id=\\\"s6t7u8\\\"\\nRULE 1\\n不得跳过 Knowledge Model，直接生成文档。\\n\\nRULE 2\\n不得把单个关键词直接当作 Pattern。\\n\\nRULE 3\\n每个重要 Claim 必须有 Evidence。\\n\\nRULE 4\\n无法验证的内容不得伪装成 FACT。\\n\\nRULE 5\\nPointer Relation 不得自动解释成 Ownership。\\n\\nRULE 6\\nCall Graph 不得自动解释成 Flow。\\n\\nRULE 7\\nenum 不等于完整 State Machine。\\n\\nRULE 8\\nLock 的存在不等于已经理解 Concurrency。\\n\\nRULE 9\\n图不是默认产物。\\n\\nRULE 10\\nPrimary View 只能服务一个核心理解问题。\\n\\nRULE 11\\n源码名称尽量保持原样，作为导航锚点。\\n\\nRULE 12\\n文档必须提供下一步源码阅读入口。\\n```\\n\\n---\\n\\n# 38. Agent 的模式识别 Prompt 不应该是模板式的\\n\\n不要：\\n\\n```text id=\\\"j8k9l0\\\"\\n“如果看到 struct，请画结构图。”\\n```\\n\\n应该是问题驱动：\\n\\n```text id=\\\"m1n2o3\\\"\\nWhat is the primary question required\\nto understand this source fragment?\\n\\nIs the difficulty primarily about:\\n\\n- object topology?\\n- ownership/lifetime?\\n- execution flow?\\n- state transition?\\n- concurrency?\\n- data movement?\\n- resource management?\\n- recovery?\\n- architecture?\\n```\\n\\n然后：\\n\\n```text id=\\\"p4q5r6\\\"\\nSelect:\\n    one dominant pattern\\n    zero or more secondary patterns\\n```\\n\\n---\\n\\n# 39. Agent 应该具有“证据不足就继续探索”的能力\\n\\n例如：\\n\\n```text id=\\\"s7t8u9\\\"\\n发现：\\n    field = state\\n\\n不知道：\\n    state 的语义\\n```\\n\\n不能直接生成结论。\\n\\n应该：\\n\\n```text id=\\\"v0w1x2\\\"\\nSearch:\\n    state readers\\n    state writers\\n    state macros\\n    state checks\\n```\\n\\n直到：\\n\\n```text id=\\\"y3z4a5\\\"\\nSemantic model sufficiently supported\\n```\\n\\n---\\n\\n# 40. Agent 应该具有“缩小范围”的能力\\n\\n反方向也非常重要。\\n\\n例如：\\n\\n```text id=\\\"b6c7d8\\\"\\n为了理解 Buffer lookup\\n```\\n\\n发现：\\n\\n```text id=\\\"e9f0g1\\\"\\n底层 filesystem\\n```\\n\\n但是当前问题无需了解 filesystem。\\n\\n那么：\\n\\n```text id=\\\"h2i3j4\\\"\\n停止继续深入\\n```\\n\\n并形成：\\n\\n```text id=\\\"k5l6m7\\\"\\nTrace Boundary\\n```\\n\\n---\\n\\n# 41. Agent 内部应该有“开放问题列表”\\n\\n这是非常值得加入 Skill 的设计。\\n\\n在阅读过程中维护：\\n\\n```yaml id=\\\"n8o9p0\\\"\\nopen_questions:\\n  - question:\\n    importance:\\n    related_symbols:\\n    status: open\\n```\\n\\n例如：\\n\\n```text id=\\\"q1r2s3\\\"\\nquestion:\\n    state 的 bit layout 如何解释？\\n\\nimportance:\\n    high\\n\\nrelated_symbols:\\n    BufferDesc\\n    BUF_STATE_*\\n    LockBufHdr()\\n```\\n\\n然后不断：\\n\\n```text id=\\\"t4u5v6\\\"\\nopen\\n ↓\\ninvestigate\\n ↓\\nresolved\\n```\\n\\n---\\n\\n# 42. Open Questions 防止 Agent 过早总结\\n\\n这是大型源码阅读很重要的机制。\\n\\n因为 Agent 很容易：\\n\\n```text id=\\\"w7x8y9\\\"\\n先产生一个解释\\n↓\\n后面所有代码都围绕这个解释解释\\n```\\n\\n这会造成“认知锁定”。\\n\\nOpen Question 机制要求：\\n\\n\u003e **在证据不足时保持不确定，而不是过早形成结论。**\\n\\n---\\n\\n# 43. 还应该维护“冲突知识”\\n\\n例如：\\n\\n```text id=\\\"z0a1b2\\\"\\nComment:\\n    field X represents A\\n\\nCode:\\n    field X appears to encode B\\n```\\n\\n不要自动选一个。\\n\\n应记录：\\n\\n```text id=\\\"c3d4e5\\\"\\nConflict {\\n    evidence_A\\n    evidence_B\\n    status\\n}\\n```\\n\\n然后文档中说明：\\n\\n\u003e 当前实现与旧注释之间存在语义差异。\\n\\n这是成熟源码研究工具应该具备的能力。\\n\\n---\\n\\n# 44. Knowledge Graph 的更新机制\\n\\n整个 Skill 不应该把一次阅读看成孤立任务。\\n\\n应该允许：\\n\\n```text id=\\\"f6g7h8\\\"\\nExisting Knowledge Graph\\n        +\\nNew Source Exploration\\n        ↓\\nMerge\\n        ↓\\nUpdate\\n        ↓\\nValidate\\n```\\n\\n例如已经存在：\\n\\n```text id=\\\"i9j0k1\\\"\\nBufferDesc\\n```\\n\\n新的 Buffer Manager 章节不能再创建：\\n\\n```text id=\\\"l2m3n4\\\"\\nAnother BufferDesc\\n```\\n\\n而应该引用已有 Entity。\\n\\n---\\n\\n# 45. Entity Identity\\n\\n实体最好具备稳定 ID：\\n\\n```text id=\\\"o5p6q7\\\"\\nEntityID =\\n    repository\\n    +\\nqualified symbol\\n```\\n\\n例如：\\n\\n```text id=\\\"r8s9t0\\\"\\npostgresql::BufferDesc\\n```\\n\\n函数：\\n\\n```text id=\\\"u1v2w3\\\"\\npostgresql::BufferAlloc()\\n```\\n\\n这样不同章节可以共享实体。\\n\\n---\\n\\n# 46. Knowledge Graph 最终成为整个 Skill 的长期资产\\n\\n最终可能变成：\\n\\n```text id=\\\"x4y5z6\\\"\\nPostgreSQL Knowledge Graph\\n\\nEntity\\nRelation\\nFlow\\nState\\nLifecycle\\nConcurrency\\nInvariant\\nEvidence\\n```\\n\\n不同文档只是：\\n\\n```text id=\\\"a7b8c9\\\"\\nKnowledge Graph\\n    ↓\\n不同 View\\n```\\n\\n例如：\\n\\n```text id=\\\"d0e1f2\\\"\\nBuffer Manager\\nLock Manager\\nExecutor\\nMemory Context\\n```\\n\\n不是四套孤立笔记，而是：\\n\\n```text id=\\\"g3h4i5\\\"\\n一个知识图\\n+\\n多个文档视图\\n```\\n\\n---\\n\\n# 47. 这会直接支持“增量源码阅读”\\n\\n例如今天读：\\n\\n```text id=\\\"j6k7l8\\\"\\nBuffer Manager\\n```\\n\\n明天读：\\n\\n```text id=\\\"m9n0o1\\\"\\nBuffer Replacement\\n```\\n\\n后天读：\\n\\n```text id=\\\"p2q3r4\\\"\\nWAL\\n```\\n\\nAgent 不需要从零开始。\\n\\n而是：\\n\\n```text id=\\\"s5t6u7\\\"\\nExisting Graph\\n       ↓\\nFind missing knowledge\\n       ↓\\nExplore only missing area\\n       ↓\\nExtend Graph\\n```\\n\\n这比每次生成一份新的 Markdown 强很多。\\n\\n---\\n\\n# 48. Skill 最终应该支持的四种工作模式\\n\\n推荐定义：\\n\\n```text id=\\\"v8w9x0\\\"\\nMODE 1\\nExplore\\n```\\n\\n只做源码调查，不生成最终文档。\\n\\n```text id=\\\"a1b2c3\\\"\\nMODE 2\\nModel\\n```\\n\\n只建立 Knowledge Model。\\n\\n```text id=\\\"d4e5f6\\\"\\nMODE 3\\nDocument\\n```\\n\\n从已有 Knowledge Model 生成文档。\\n\\n```text id=\\\"g7h8i9\\\"\\nMODE 4\\nReview\\n```\\n\\n检查已有源码笔记的准确性、完整性和可追踪性。\\n\\n这样它不再只是：\\n\\n```text id=\\\"j0k1l2\\\"\\n“生成笔记的 Skill”\\n```\\n\\n而是：\\n\\n\u003e **完整的 Source Understanding Skill。**\\n\\n---\\n\\n# 49. Review Mode 非常重要\\n\\n用户以后可以直接把旧笔记交给 Skill：\\n\\n```text id=\\\"m3n4o5\\\"\\nReview this source note\\n```\\n\\nSkill 可以检查：\\n\\n```text id=\\\"p6q7r8\\\"\\n图是否真实？\\nClaim 是否有证据？\\n是否遗漏生命周期？\\n是否遗漏并发？\\n是否把 pointer 当 ownership？\\n源码落点是否正确？\\n是否存在过时符号？\\n```\\n\\n并生成：\\n\\n```text id=\\\"s9t0u1\\\"\\nReview Findings\\n```\\n\\n---\\n\\n# 50. 最终的 Skill 工作协议\\n\\n完整过程：\\n\\n```text id=\\\"v2w3x4\\\"\\nUSER REQUEST\\n     ↓\\nSCOPE\\n     ↓\\nSOURCE EXPLORATION\\n     ↓\\nKNOWLEDGE MODEL\\n     ↓\\nPATTERN PROFILE\\n     ↓\\nSOURCE TRACE\\n     ↓\\nREPRESENTATION PLAN\\n     ↓\\nDOCUMENT\\n     ↓\\nVALIDATION\\n     ↓\\nFINAL\\n```\\n\\n内部核心状态：\\n\\n```text id=\\\"y5z6a7\\\"\\nSource\\nKnowledge\\nPattern\\nTrace\\nRepresentation\\nDocument\\nValidation\\n```\\n\\n---\\n\\n# 51. 最终 Skill 的真正价值\\n\\n它最终解决的不是：\\n\\n\u003e “让 Agent 写出更漂亮的源码笔记。”\\n\\n而是解决：\\n\\n```text id=\\\"b8c9d0\\\"\\n大型源码\\n    ↓\\n人类认知负担很高\\n    ↓\\nAgent 建立结构化知识\\n    ↓\\n人类通过文档建立 Mental Model\\n    ↓\\n沿 Source Anchor 回到源码\\n    ↓\\n继续自主阅读\\n```\\n\\n所以它最终更接近：\\n\\n\u003e **Source Code Knowledge Compiler**\\n\\n而不是：\\n\\n\u003e Markdown Generator。\\n\\n---\\n\\n# 52. 最终架构图\\n\\n把整个六步过程放在一起：\\n\\n```text id=\\\"e1f2g3\\\"\\n                         SOURCE REPOSITORY\\n                                │\\n                                ▼\\n                    ┌────────────────────┐\\n                    │   Source Explorer  │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │ Knowledge Modeler  │\\n                    │                    │\\n                    │ Entity             │\\n                    │ Relation           │\\n                    │ Flow               │\\n                    │ State              │\\n                    │ Lifecycle          │\\n                    │ Concurrency        │\\n                    │ Constraint         │\\n                    │ Evidence           │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │  Pattern Detector  │\\n                    │                    │\\n                    │ Dominant           │\\n                    │ Secondary          │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │   Trace Engine     │\\n                    │                    │\\n                    │ Claim              │\\n                    │ Evidence           │\\n                    │ Source Anchor      │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │ Representation     │\\n                    │     Planner        │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │ Document Generator │\\n                    │                    │\\n                    │ Markdown           │\\n                    │ Mermaid            │\\n                    │ Source Snippets    │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │    Validator       │\\n                    └───────┬────┬───────┘\\n                            │    │\\n                       PASS │    │ FAIL\\n                            │    └──────→ REVISE\\n                            ↓\\n                         FINAL DOC\\n                            │\\n                            ↓\\n                      BACK TO SOURCE\\n```\\n\\n---\\n\\n# 53. 六步体系最终闭环\\n\\n```text id=\\\"h4i5j6\\\"\\nSTEP 1\\nKnowledge Model\\n“认识什么？”\\n\\n        ↓\\n\\nSTEP 2\\nPattern Recognition\\n“主要是什么理解问题？”\\n\\n        ↓\\n\\nSTEP 3\\nRepresentation\\n“如何表达最有效？”\\n\\n        ↓\\n\\nSTEP 4\\nTraceability\\n“如何证明？”\\n\\n        ↓\\n\\nSTEP 5\\nDocument Generation\\n“如何组织成可读知识？”\\n\\n        ↓\\n\\nSTEP 6\\nSkill Architecture\\n“如何让 Agent 稳定执行整个闭环？”\\n```\\n\\n最终形成：\\n\\n```text id=\\\"k7l8m9\\\"\\n         ┌──────────────────────────────┐\\n         │     Source Reading Skill     │\\n         │                              │\\n         │  Understand → Model → Trace  │\\n         │       ↓             ↓        │\\n         │      Pattern → Represent     │\\n         │               ↓              │\\n         │            Document          │\\n         │               ↓              │\\n         │           Validate           │\\n         └──────────────────────────────┘\\n```\\n\\n---\\n\\n# 54. v0.1 的工程化边界\\n\\n第一版 Skill 不应该试图解决所有问题。\\n\\n建议首先支持：\\n\\n```text id=\\\"n0o1p2\\\"\\nC / C++\\nstruct/class\\nfunction\\npointer/reference\\ncall relation\\nstate\\nlifecycle\\nlock\\natomic\\nmemory ownership\\nresource management\\n```\\n\\n并优先验证：\\n\\n```text id=\\\"q3r4s5\\\"\\nPostgreSQL\\nBuffer Manager\\nLock Manager\\nTupleTableSlot\\nRelation\\nMemory Context\\n```\\n\\n这几个主题已经足以覆盖绝大多数 Pattern。\\n\\n等这些案例验证通过后，再考虑：\\n\\n```text id=\\\"t6u7v8\\\"\\ntemplate-heavy C++\\nvirtual dispatch\\ncomplex macro metaprogramming\\nasync callback\\ncoroutine\\nlock-free\\nRCU\\nJIT\\n```\\n\\n---\\n\\n# 55. Skill 的最终设计哲学\\n\\n整个体系最终可以浓缩成一句：\\n\\n\u003e **Agent 不负责“替人读完整个源码”，而负责把源码压缩成一张可验证的知识地图，并让人能够从地图重新进入源码。**\\n\\n所以真正的核心产物不是：\\n\\n```text\\nMarkdown\\n```\\n\\n也不是：\\n\\n```text\\nMermaid\\n```\\n\\n而是：\\n\\n```text\\nKnowledge Graph\\n+\\nPattern Profile\\n+\\nTrace Map\\n```\\n\\nMarkdown 只是这个知识系统的一个 View。\\n\\n::\\n\\n这样，Step 6 之后，整个方案已经从“源码笔记规范”升级成了一个比较完整的 **Source Code Understanding Skill 架构**。\\n\\n我认为接下来还有一个非常关键的步骤，不过它已经不属于原来的 1～6 了：**Step 7 应该做真实案例反推**。也就是拿你一直在研究的 `TupleTableSlot`、`Relation`、`Lock Manager`、`Buffer Manager` 四个案例，完全按照这套 Skill 手工跑一遍，看看 `Knowledge Model → Pattern → Trace → Representation → Document` 哪些地方会卡住。这个过程很可能会发现目前模型里还有缺失项，而不是继续凭空增加规范。\",\"index\",\"大型 C/C++ 源码阅读 Agent Skill 设计规范 v0.1\",{\"_749\":750},\"edited_at\",\"2026-09-17T14:03:12.644000Z\",\"updated_at\",\"suggested_followups\",[751,752,753],{\"_53\":716,\"_755\":716},{\"_53\":756,\"_755\":756},{\"_53\":754,\"_755\":754},\"用一个案例跑通完整流程\",\"prompt\",\"补上可执行的 SKILL.md 草案\",{\"_168\":1059,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1058,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1057,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1056,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1055,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1054,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1053,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1052,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1051,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1050,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1049,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1048,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1047,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1046,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1045,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1044,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1043,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1042,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1041,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1040,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1039,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1038,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1037,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":1036,\"_235\": zvhn\",\"g82mde\",\"255qpt\",\"wclq63\",\"rla3pp\",\"wohp07\",\"42fppo\",\"4bd8rr\",\"mkxeeb\",\"5w65b7\",\"wda9h6\",\"054q6m\",\"s7oqtt\",\"n1aqxe\",\"bcf5v5\",\"ruqd8t\",\"hk57vs\",\"2qgpop\",\"ao3wcj\",\"vhcmyp\",\"syeve2\",\"bps55c\",\"8ls80s\",\"f5jm56\",\"k548k4\",\"x4t390\",\"k9jr95\",\"q2gcdd\",\"wt7bpw\",\"arovzp\",\"yshp2t\",\"2ovqac\",\"96vj3b\",\"kn2juj\",\"5bmrno\",\"dyrwop\",\"r3qocc\",\"gmujl7\",\"d5jxqg\",\"a0boru\",\"t66tto\",\"sf1sud\",\"qzmkku\",\"yy5n3x\",\"nx9zbd\",\"9kjayo\",\"vgkd96\",\"5l5smm\",\"xx4zmi\",\"saoc0r\",\"4p0ee3\",\"q0ubri\",\"v3puqs\",\"81nc6e\",\"9iy4pr\",\"8brvjk\",\"81ixkb\",\"zks1qn\",\"ehgcd4\",\"1qb0ik\",\"naqphy\",\"z9xtn4\",\"r0j7pr\",\"rdslhw\",\"dumu5y\",\"bgtywu\",\"5j1ydw\",\"bfhov5\",\"hq2yyk\",\"nsdyhb\",\"3cgagh\",\"qviovr\",\"1d9ake\",\"j1wzv8\",\"f48fkm\",\"kuxyst\",\"bm54z4\",\"1kf6s8\",\"m149pi\",\"kcsr97\",\"s371mi\",\"x2i0a0\",\"u9bjm7\",\"lmwss6\",\"0nerzd\",\"1ehcud\",\"vsydzg\",\"qu0lkh\",\"hqrw6z\",\"kby59f\",[244],[1062],\"Step 6 的核心，是把前面的规范从“方法论”变成一个真正可执行的 **Source Reading Skill**。\\n\\n这里我建议采用一个明确的架构：\\n\\n```text id=\\\"7f0b31\\\"\\n                    Source Reading Skill\\n                           │\\n                    Orchestrator Agent\\n                           │\\n        ┌──────────────────┼──────────────────┐\\n        ↓                  ↓                  ↓\\n   Source Explorer     Knowledge Model    Document Engine\\n        │                  │                  │\\n   context expand       entity/relation    representation\\n   symbol tracing       state/flow         markdown\\n   code search          lifecycle          mermaid\\n   call graph           invariant          source snippets\\n        │                  │                  │\\n        └──────────────────┼──────────────────┘\\n                           ↓\\n                    Validation Engine\\n```\\n\\n真正关键的是：\\n\\n\u003e **Agent 不应该直接“读源码然后写 Markdown”，而应该被强制要求经过一个统一的中间状态。**\\n\\n这个中间状态就是前面五步的汇合点。\\n\\n---\\n\\n:::writing{variant=\\\"document\\\" id=\\\"68214\\\" title=\\\"大型 C/C++ 源码阅读 Agent Skill 设计规范 v0.1\\\"}\\n\\n# 大型 C/C++ 源码阅读 Agent Skill 设计规范 v0.1\\n\\n# 1. Skill 的目标\\n\\n本 Skill 用于：\\n\\n\u003e 从大型 C/C++ 项目源码中提取可验证的知识模型，识别主导理解模式，选择适合的表达方式，并生成可继续追踪源码的阅读文档。\\n\\n目标不是：\\n\\n```text id=\\\"32ozlq\\\"\\nSource → Summary\\n```\\n\\n而是：\\n\\n```text id=\\\"3h5s1r\\\"\\nSource\\n  ↓\\nUnderstand\\n  ↓\\nModel\\n  ↓\\nRecognize Pattern\\n  ↓\\nTrace Evidence\\n  ↓\\nRepresent\\n  ↓\\nGenerate Document\\n  ↓\\nValidate\\n```\\n\\n最终产物应满足：\\n\\n```text id=\\\"v8d9jh\\\"\\n读者能够理解\\n+\\n读者能够验证\\n+\\n读者能够继续读源码\\n```\\n\\n---\\n\\n# 2. Skill 的总体架构\\n\\n采用：\\n\\n```text id=\\\"n0j2sh\\\"\\n┌────────────────────────────────────────────┐\\n│             Source Reading Skill           │\\n│                                            │\\n│  ┌──────────────────────────────────────┐  │\\n│  │          Orchestrator                │  │\\n│  └────────────────┬─────────────────────┘  │\\n│                   │                        │\\n│       ┌───────────┼────────────┐           │\\n│       ↓           ↓            ↓           │\\n│    Explorer     Modeler      Tracer        │\\n│       │           │            │           │\\n│       └───────────┼────────────┘           │\\n│                   ↓                        │\\n│             Pattern Detector              │\\n│                   ↓                        │\\n│           Representation Planner           │\\n│                   ↓                        │\\n│            Document Generator              │\\n│                   ↓                        │\\n│              Validator                    │\\n└────────────────────────────────────────────┘\\n```\\n\\n不建议拆成很多互相独立的 Skill。\\n\\n推荐：\\n\\n\u003e **一个总 Skill，内部采用模块化规则。**\\n\\n原因是整个过程存在强依赖：\\n\\n```text id=\\\"8bs3b7\\\"\\nKnowledge\\n   ↓\\nPattern\\n   ↓\\nRepresentation\\n   ↓\\nTrace\\n   ↓\\nDocument\\n```\\n\\n任何一层都需要消费上一层的中间结果。\\n\\n---\\n\\n# 3. Skill 的核心原则\\n\\n## 3.1 不允许直接生成最终文档\\n\\nAgent 首先必须建立：\\n\\n```text id=\\\"v3m8n1\\\"\\nKnowledge Model\\n```\\n\\n再建立：\\n\\n```text id=\\\"yw1v0u\\\"\\nPattern Profile\\n```\\n\\n再建立：\\n\\n```text id=\\\"5f4y9e\\\"\\nRepresentation Plan\\n```\\n\\n再建立：\\n\\n```text id=\\\"7u7v4r\\\"\\nTrace Map\\n```\\n\\n最终才生成：\\n\\n```text id=\\\"z4m6vy\\\"\\nDocument\\n```\\n\\n---\\n\\n# 4. Agent 的内部状态机\\n\\nSkill 的核心执行流程定义为：\\n\\n```text id=\\\"1q2xk7\\\"\\nINIT\\n  ↓\\nSCOPE\\n  ↓\\nEXPLORE\\n  ↓\\nMODEL\\n  ↓\\nPATTERN\\n  ↓\\nTRACE\\n  ↓\\nREPRESENT\\n  ↓\\nGENERATE\\n  ↓\\nVALIDATE\\n  ↓\\nREVISE ─────────┐\\n  ↑             │\\n  └─────────────┘\\n        ↓\\n      FINAL\\n```\\n\\n---\\n\\n# 5. Phase 0 — INIT\\n\\n读取：\\n\\n```text id=\\\"5j3v3b\\\"\\n用户任务\\n源码仓库\\n版本/commit\\n已有文档\\n项目结构\\n```\\n\\n确定：\\n\\n```text id=\\\"s0y2m8\\\"\\nsubject\\nscope\\ndepth\\nreader\\ngoal\\n```\\n\\n例如：\\n\\n```text id=\\\"z3q2ne\\\"\\nsubject:\\n    PostgreSQL Buffer Manager\\n\\nscope:\\n    BufferTag → BufTable → BufferDesc\\n\\ngoal:\\n    理解 Buffer lookup\\n\\ndepth:\\n    Core + selected implementation details\\n```\\n\\n---\\n\\n# 6. Phase 1 — SCOPE\\n\\n首先确定研究边界。\\n\\nAgent 必须回答：\\n\\n```text id=\\\"69sj6f\\\"\\n研究对象是什么？\\n核心问题是什么？\\n涉及哪些模块？\\n哪些模块暂时不展开？\\n```\\n\\n形成：\\n\\n```text id=\\\"8y1qyr\\\"\\nScope {\\n    subject\\n    core_questions[]\\n    included_modules[]\\n    excluded_modules[]\\n    depth\\n}\\n```\\n\\n---\\n\\n# 7. Scope Boundary 原则\\n\\nSkill 必须主动建立边界。\\n\\n例如：\\n\\n```text id=\\\"f8m8pk\\\"\\nBuffer Lookup\\n\\nIN:\\n    BufferTag\\n    BufTable\\n    BufferDesc\\n    hash\\n    partition lock\\n\\nOUT:\\n    page replacement policy\\n    WAL\\n    filesystem\\n```\\n\\n除非后续发现无法解释当前问题，否则不扩大范围。\\n\\n---\\n\\n# 8. Phase 2 — EXPLORE\\n\\nExplorer 的职责不是总结。\\n\\nExplorer 负责：\\n\\n\u003e **建立源码搜索空间。**\\n\\n主要动作：\\n\\n```text id=\\\"jh5l8f\\\"\\nfind symbol\\nfind definition\\nfind callers\\nfind callees\\nfind field readers\\nfind field writers\\nfind references\\nfind lock operations\\nfind allocation/free\\nfind state transitions\\n```\\n\\n---\\n\\n# 9. Explorer 的上下文扩展\\n\\n使用逐级扩展：\\n\\n```text id=\\\"05aotg\\\"\\nL0 Target Symbol\\n    ↓\\nL1 Direct Definition\\n    ↓\\nL2 Direct References\\n    ↓\\nL3 Related Structures\\n    ↓\\nL4 Related Control Flow\\n    ↓\\nL5 Related Runtime / Synchronization\\n    ↓\\nL6 Cross-module\\n```\\n\\n每次扩展都必须回答：\\n\\n\u003e **这一步是在解决哪个未知问题？**\\n\\n如果不能回答，就停止扩展。\\n\\n---\\n\\n# 10. Explorer 不负责解释设计意图\\n\\n例如 Explorer 找到：\\n\\n```c id=\\\"6p2e4s\\\"\\nspin_lock(...)\\n```\\n\\nExplorer 记录：\\n\\n```text id=\\\"l3v8q9\\\"\\nFACT:\\n    Function acquires spinlock.\\n```\\n\\n但不立即写：\\n\\n```text id=\\\"r6e5p2\\\"\\n这是为了减少并发竞争。\\n```\\n\\n这种解释留给：\\n\\n```text id=\\\"j5p9y0\\\"\\nModeler\\n+\\nPattern Detector\\n+\\nTrace Analyzer\\n```\\n\\n---\\n\\n# 11. Phase 3 — MODEL\\n\\nModeler 把 Explorer 的源码事实转化成：\\n\\n```text id=\\\"1a5q1t\\\"\\nKnowledge Model\\n```\\n\\n核心对象：\\n\\n```text id=\\\"x8z3g4\\\"\\nEntity\\nRelation\\nFlow\\nState\\nLifecycle\\nConcurrency\\nConstraint\\nEvidence\\n```\\n\\n---\\n\\n# 12. Knowledge Model Schema\\n\\n推荐内部采用类似：\\n\\n```yaml id=\\\"k0v5ne\\\"\\nknowledge:\\n  entities:\\n    - id:\\n      name:\\n      kind:\\n      role:\\n      source:\\n\\n  relations:\\n    - subject:\\n      predicate:\\n      object:\\n      condition:\\n      evidence:\\n\\n  flows:\\n    - id:\\n      trigger:\\n      steps:\\n      branches:\\n      effects:\\n\\n  states:\\n    - entity:\\n      states:\\n      transitions:\\n      evidence:\\n\\n  lifecycles:\\n    - entity:\\n      stages:\\n      ownership:\\n      evidence:\\n\\n  concurrency:\\n    - shared_object:\\n      participants:\\n      synchronization:\\n      protected_state:\\n      evidence:\\n\\n  constraints:\\n    - type:\\n      statement:\\n      evidence:\\n\\n  claims:\\n    - statement:\\n      type:\\n      evidence:\\n      trace:\\n      confidence:\\n```\\n\\n它不是要求实际永远输出 YAML。\\n\\n这是：\\n\\n\u003e **Agent 的内部中间表示。**\\n\\n---\\n\\n# 13. Claim 是整个 Skill 的核心原子\\n\\n最终真正需要验证的是：\\n\\n```text id=\\\"8b8n4c\\\"\\nClaim\\n```\\n\\n而不是：\\n\\n```text id=\\\"l0o3ph\\\"\\nParagraph\\n```\\n\\n例如：\\n\\n```text id=\\\"q2x2c8\\\"\\nClaim:\\n    BufferDesc.state 表示 buffer header 状态。\\n\\nType:\\n    FACT\\n\\nEvidence:\\n    BufferDesc definition\\n    BUF_STATE_* macros\\n    state readers/writers\\n\\nConfidence:\\n    High\\n```\\n\\n文档只是 Claim 的一种展示方式。\\n\\n---\\n\\n# 14. Phase 4 — PATTERN\\n\\nPattern Detector 消费：\\n\\n```text id=\\\"k2b2n7\\\"\\nKnowledge Model\\n```\\n\\n输出：\\n\\n```text id=\\\"x3x7c9\\\"\\nPattern Profile\\n```\\n\\n支持：\\n\\n```text id=\\\"8gu2j0\\\"\\nStructural\\nLifecycle\\nFlow\\nState\\nConcurrency\\nData Path\\nResource\\nRecovery\\nArchitecture\\n```\\n\\n---\\n\\n# 15. Pattern Detector 的工作方式\\n\\n不是：\\n\\n```text id=\\\"m9f8j1\\\"\\n关键词 → Pattern\\n```\\n\\n而是：\\n\\n```text id=\\\"y6r8b2\\\"\\nKnowledge Graph\\n      ↓\\nCore Question\\n      ↓\\nComplexity\\n      ↓\\nPattern Candidates\\n      ↓\\nDominant Pattern\\n      ↓\\nSecondary Patterns\\n```\\n\\n---\\n\\n# 16. Pattern Profile\\n\\n内部模型：\\n\\n```yaml id=\\\"5s2l8v\\\"\\npattern_profile:\\n  dominant:\\n    name:\\n    reason:\\n\\n  secondary:\\n    - name:\\n      reason:\\n\\n  core_question:\\n\\n  supporting_knowledge:\\n    entities: []\\n    flows: []\\n    states: []\\n    constraints: []\\n```\\n\\n例如：\\n\\n```text id=\\\"2f3j1k\\\"\\ndominant:\\n    Concurrency\\n\\nsecondary:\\n    Flow\\n    Structural\\n    State\\n\\ncore_question:\\n    多个 backend 如何共享并发地申请和等待 lock？\\n```\\n\\n---\\n\\n# 17. Phase 5 — TRACE\\n\\nTracer 消费：\\n\\n```text id=\\\"cf4w8m\\\"\\nClaims\\n+\\nKnowledge Model\\n```\\n\\n建立：\\n\\n```text id=\\\"z7m1w6\\\"\\nClaim → Evidence → Source\\n```\\n\\n---\\n\\n# 18. Trace Engine 的核心任务\\n\\n对于每一个重要 Claim：\\n\\n```text id=\\\"c3v1b2\\\"\\n1. 找定义\\n2. 找使用\\n3. 找修改\\n4. 找调用\\n5. 找约束\\n6. 必要时跨模块\\n```\\n\\n形成：\\n\\n```text id=\\\"j0d2w7\\\"\\nSource Trace\\n```\\n\\n---\\n\\n# 19. Trace Depth\\n\\n支持：\\n\\n```text id=\\\"7s0k2e\\\"\\nD1 Local\\nD2 Structural\\nD3 System\\n```\\n\\nAgent 根据 Claim 的复杂度选择深度。\\n\\n例如：\\n\\n```text id=\\\"8yg0c3\\\"\\n“这个字段存在”\\n→ D1\\n\\n“这个字段表示某状态”\\n→ D2\\n\\n“这个机制为什么跨模块设计”\\n→ D3\\n```\\n\\n---\\n\\n# 20. Trace 的停止条件\\n\\n必须在：\\n\\n```text id=\\\"j2v5q9\\\"\\nClaim 已证明\\n```\\n\\n时停止。\\n\\n不能因为：\\n\\n```text id=\\\"4o3m1k\\\"\\n“还能继续往下读”\\n```\\n\\n就无限扩展。\\n\\n---\\n\\n# 21. Trace Failure\\n\\n如果 Claim 无法证明：\\n\\nAgent 不得补充猜测。\\n\\n状态应该是：\\n\\n```text id=\\\"2a8n4w\\\"\\nUNVERIFIED\\n```\\n\\n并记录：\\n\\n```text id=\\\"q7z3y5\\\"\\nmissing_evidence:\\n    state transition writer not found\\n```\\n\\n最终文档可以：\\n\\n```text id=\\\"j8w4s1\\\"\\n当前源码可以确认……\\n但尚不足以确认……\\n```\\n\\n---\\n\\n# 22. Phase 6 — REPRESENT\\n\\nRepresentation Planner 消费：\\n\\n```text id=\\\"n2c6h5\\\"\\nPattern Profile\\n+\\nKnowledge Model\\n+\\nTrace\\n+\\nUser Intent\\n```\\n\\n输出：\\n\\n```text id=\\\"9v5w4k\\\"\\nRepresentation Plan\\n```\\n\\n---\\n\\n# 23. Representation Plan\\n\\n```yaml id=\\\"x0z9u2\\\"\\nrepresentation:\\n  primary:\\n    type:\\n    purpose:\\n\\n  secondary:\\n    - type:\\n      purpose:\\n\\n  text:\\n    concepts: []\\n    explanations: []\\n\\n  source:\\n    anchors: []\\n    snippets: []\\n\\n  exclusions:\\n    - \\n```\\n\\n例如：\\n\\n```text id=\\\"h2p7y8\\\"\\nprimary:\\n    Synchronization View\\n\\nsecondary:\\n    Entity Relationship\\n    Sequence\\n\\nsource:\\n    LockAcquire()\\n    GrantLock()\\n    WaitOnLock()\\n\\nexclusions:\\n    full call graph\\n```\\n\\n---\\n\\n# 24. Phase 7 — GENERATE\\n\\nDocument Generator 不再分析源码。\\n\\n它只消费：\\n\\n```text id=\\\"w5d2k4\\\"\\nKnowledge Model\\nPattern Profile\\nRepresentation Plan\\nTrace\\n```\\n\\n因此它的工作变得非常简单：\\n\\n```text id=\\\"4s6r8c\\\"\\nModel\\n ↓\\nProjection\\n ↓\\nMarkdown / Mermaid / Code\\n```\\n\\n---\\n\\n# 25. Document Generator 的责任边界\\n\\n它可以决定：\\n\\n```text id=\\\"4r1m8f\\\"\\n章节标题\\n段落顺序\\n图的位置\\n代码片段的位置\\n表格\\n交叉引用\\n```\\n\\n但不能重新发明：\\n\\n```text id=\\\"4y0k3z\\\"\\n事实\\n关系\\n设计动机\\n源码结论\\n```\\n\\n否则会绕过 Traceability。\\n\\n---\\n\\n# 26. Phase 8 — VALIDATE\\n\\n这是 Skill 与普通 Prompt 最大的区别之一。\\n\\n生成以后必须重新检查：\\n\\n```text id=\\\"5v6m0c\\\"\\nDocument\\n    ↓\\nValidation\\n```\\n\\n---\\n\\n# 27. Validation 分成五层\\n\\n```text id=\\\"8o5p3x\\\"\\nV1 Structural Validation\\nV2 Semantic Validation\\nV3 Trace Validation\\nV4 Representation Validation\\nV5 Reader Validation\\n```\\n\\n---\\n\\n# 28. V1 Structural Validation\\n\\n检查：\\n\\n```text id=\\\"q4r2n7\\\"\\n是否存在 Core Question？\\n是否存在 Mental Model？\\n是否存在 Primary View？\\n是否存在 Source Navigation？\\n是否存在 Key Conclusions？\\n```\\n\\n---\\n\\n# 29. V2 Semantic Validation\\n\\n检查：\\n\\n```text id=\\\"m7k8v2\\\"\\n图中的关系是否真的存在？\\nState 是否有真实 transition？\\nOwnership 是否有证据？\\nLock 是否真的保护所描述对象？\\nData Path 是否搞错 copy/reference？\\n```\\n\\n这是防止“图看起来很专业但语义错误”。\\n\\n---\\n\\n# 30. V3 Trace Validation\\n\\n这是最关键的一层。\\n\\n逐个检查：\\n\\n```text id=\\\"6z2f7w\\\"\\n重要 Claim\\n    ↓\\nEvidence\\n    ↓\\nSource\\n```\\n\\n如果某个 Claim 没有 Evidence：\\n\\n```text id=\\\"9p5x1j\\\"\\n标记：\\n    UNVERIFIED\\n```\\n\\n或者删除。\\n\\n---\\n\\n# 31. V4 Representation Validation\\n\\n检查：\\n\\n```text id=\\\"2m7k1c\\\"\\nPrimary View 是否与 Dominant Pattern 一致？\\n是否图太复杂？\\n是否存在不必要图？\\n是否存在图文重复？\\n是否把 Call Graph 当 Flow？\\n是否把 State 当 Lifecycle？\\n```\\n\\n---\\n\\n# 32. V5 Reader Validation\\n\\n模拟一个第一次读这个模块的人：\\n\\n```text id=\\\"7q6y2m\\\"\\n看完以后：\\n    知道这是什么吗？\\n\\n知道核心对象吗？\\n\\n知道核心关系吗？\\n\\n知道运行时怎么走吗？\\n\\n知道关键状态吗？\\n\\n知道并发约束吗？\\n\\n知道源码入口吗？\\n\\n知道下一步读哪里吗？\\n```\\n\\n如果答案是否定的，进入：\\n\\n```text id=\\\"v4j8k5\\\"\\nREVISE\\n```\\n\\n---\\n\\n# 33. Revision Loop\\n\\nSkill 不应该：\\n\\n```text id=\\\"z1y2x3\\\"\\n一次生成 → 结束\\n```\\n\\n而应该：\\n\\n```text id=\\\"j4k5l6\\\"\\nGenerate\\n   ↓\\nValidate\\n   ↓\\nFailure?\\n ┌───────┴────────┐\\n No               Yes\\n ↓                 ↓\\nFinal            Revise\\n                   ↓\\n                Validate\\n```\\n\\n最多允许有限轮次，例如：\\n\\n```text id=\\\"7t8u9v\\\"\\nMAX_REVISION = 2~3\\n```\\n\\n避免 Agent 无休止自我修改。\\n\\n---\\n\\n# 34. Skill 的模块划分\\n\\n建议目录最终设计成：\\n\\n```text id=\\\"g9h2j7\\\"\\n/source-reading-skill/\\n│\\n├── SKILL.md\\n│\\n├── model/\\n│   ├── knowledge-model.md\\n│   ├── claim-model.md\\n│   └── evidence-model.md\\n│\\n├── patterns/\\n│   ├── pattern-catalog.md\\n│   ├── structural.md\\n│   ├── lifecycle.md\\n│   ├── flow.md\\n│   ├── state.md\\n│   ├── concurrency.md\\n│   ├── data-path.md\\n│   ├── resource.md\\n│   ├── recovery.md\\n│   └── architecture.md\\n│\\n├── representation/\\n│   ├── representation-policy.md\\n│   ├── entity-view.md\\n│   ├── flow-view.md\\n│   ├── state-view.md\\n│   ├── lifecycle-view.md\\n│   ├── sequence-view.md\\n│   ├── concurrency-view.md\\n│   └── architecture-view.md\\n│\\n├── tracing/\\n│   ├── trace-policy.md\\n│   ├── source-anchor.md\\n│   └── claim-verification.md\\n│\\n├── document/\\n│   ├── document-policy.md\\n│   ├── section-policy.md\\n│   └── style.md\\n│\\n└── validation/\\n    ├── validation-policy.md\\n    ├── semantic-check.md\\n    └── document-check.md\\n```\\n\\n这里的思想是：\\n\\n\u003e `SKILL.md` 负责“怎么工作”，各规则文件负责“具体规则是什么”。\\n\\n---\\n\\n# 35. SKILL.md 不应该很长\\n\\n未来真正执行 Skill 时：\\n\\n```text id=\\\"9h8j7k\\\"\\nSKILL.md\\n```\\n\\n应该只包含：\\n\\n```text id=\\\"w1x2y3\\\"\\n目标\\n输入\\n主流程\\n状态机\\n何时读取哪个 rule\\n输出\\n强制检查\\n```\\n\\n而不是把所有 Pattern 规则全部塞进一个文件。\\n\\n这样后面维护时：\\n\\n```text id=\\\"a4b5c6\\\"\\n修改 State Pattern\\n```\\n\\n不会影响：\\n\\n```text id=\\\"d7e8f9\\\"\\nConcurrency\\nDocument\\nTrace\\n```\\n\\n---\\n\\n# 36. 推荐的 Orchestrator 逻辑\\n\\nSkill 的核心控制逻辑可以抽象成：\\n\\n```text id=\\\"p3q4r5\\\"\\nRead User Intent\\n        ↓\\nDefine Scope\\n        ↓\\nExplore Source\\n        ↓\\nBuild Knowledge Model\\n        ↓\\nDetect Dominant Pattern\\n        ↓\\nBuild Trace\\n        ↓\\nBuild Representation Plan\\n        ↓\\nGenerate Document\\n        ↓\\nValidate\\n        ↓\\nRevise if needed\\n        ↓\\nReturn\\n```\\n\\n---\\n\\n# 37. Agent 的强制规则\\n\\n这是未来 SKILL.md 中最重要的部分。\\n\\n```text id=\\\"s6t7u8\\\"\\nRULE 1\\n不得跳过 Knowledge Model，直接生成文档。\\n\\nRULE 2\\n不得把单个关键词直接当作 Pattern。\\n\\nRULE 3\\n每个重要 Claim 必须有 Evidence。\\n\\nRULE 4\\n无法验证的内容不得伪装成 FACT。\\n\\nRULE 5\\nPointer Relation 不得自动解释成 Ownership。\\n\\nRULE 6\\nCall Graph 不得自动解释成 Flow。\\n\\nRULE 7\\nenum 不等于完整 State Machine。\\n\\nRULE 8\\nLock 的存在不等于已经理解 Concurrency。\\n\\nRULE 9\\n图不是默认产物。\\n\\nRULE 10\\nPrimary View 只能服务一个核心理解问题。\\n\\nRULE 11\\n源码名称尽量保持原样，作为导航锚点。\\n\\nRULE 12\\n文档必须提供下一步源码阅读入口。\\n```\\n\\n---\\n\\n# 38. Agent 的模式识别 Prompt 不应该是模板式的\\n\\n不要：\\n\\n```text id=\\\"j8k9l0\\\"\\n“如果看到 struct，请画结构图。”\\n```\\n\\n应该是问题驱动：\\n\\n```text id=\\\"m1n2o3\\\"\\nWhat is the primary question required\\nto understand this source fragment?\\n\\nIs the difficulty primarily about:\\n\\n- object topology?\\n- ownership/lifetime?\\n- execution flow?\\n- state transition?\\n- concurrency?\\n- data movement?\\n- resource management?\\n- recovery?\\n- architecture?\\n```\\n\\n然后：\\n\\n```text id=\\\"p4q5r6\\\"\\nSelect:\\n    one dominant pattern\\n    zero or more secondary patterns\\n```\\n\\n---\\n\\n# 39. Agent 应该具有“证据不足就继续探索”的能力\\n\\n例如：\\n\\n```text id=\\\"s7t8u9\\\"\\n发现：\\n    field = state\\n\\n不知道：\\n    state 的语义\\n```\\n\\n不能直接生成结论。\\n\\n应该：\\n\\n```text id=\\\"v0w1x2\\\"\\nSearch:\\n    state readers\\n    state writers\\n    state macros\\n    state checks\\n```\\n\\n直到：\\n\\n```text id=\\\"y3z4a5\\\"\\nSemantic model sufficiently supported\\n```\\n\\n---\\n\\n# 40. Agent 应该具有“缩小范围”的能力\\n\\n反方向也非常重要。\\n\\n例如：\\n\\n```text id=\\\"b6c7d8\\\"\\n为了理解 Buffer lookup\\n```\\n\\n发现：\\n\\n```text id=\\\"e9f0g1\\\"\\n底层 filesystem\\n```\\n\\n但是当前问题无需了解 filesystem。\\n\\n那么：\\n\\n```text id=\\\"h2i3j4\\\"\\n停止继续深入\\n```\\n\\n并形成：\\n\\n```text id=\\\"k5l6m7\\\"\\nTrace Boundary\\n```\\n\\n---\\n\\n# 41. Agent 内部应该有“开放问题列表”\\n\\n这是非常值得加入 Skill 的设计。\\n\\n在阅读过程中维护：\\n\\n```yaml id=\\\"n8o9p0\\\"\\nopen_questions:\\n  - question:\\n    importance:\\n    related_symbols:\\n    status: open\\n```\\n\\n例如：\\n\\n```text id=\\\"q1r2s3\\\"\\nquestion:\\n    state 的 bit layout 如何解释？\\n\\nimportance:\\n    high\\n\\nrelated_symbols:\\n    BufferDesc\\n    BUF_STATE_*\\n    LockBufHdr()\\n```\\n\\n然后不断：\\n\\n```text id=\\\"t4u5v6\\\"\\nopen\\n ↓\\ninvestigate\\n ↓\\nresolved\\n```\\n\\n---\\n\\n# 42. Open Questions 防止 Agent 过早总结\\n\\n这是大型源码阅读很重要的机制。\\n\\n因为 Agent 很容易：\\n\\n```text id=\\\"w7x8y9\\\"\\n先产生一个解释\\n↓\\n后面所有代码都围绕这个解释解释\\n```\\n\\n这会造成“认知锁定”。\\n\\nOpen Question 机制要求：\\n\\n\u003e **在证据不足时保持不确定，而不是过早形成结论。**\\n\\n---\\n\\n# 43. 还应该维护“冲突知识”\\n\\n例如：\\n\\n```text id=\\\"z0a1b2\\\"\\nComment:\\n    field X represents A\\n\\nCode:\\n    field X appears to encode B\\n```\\n\\n不要自动选一个。\\n\\n应记录：\\n\\n```text id=\\\"c3d4e5\\\"\\nConflict {\\n    evidence_A\\n    evidence_B\\n    status\\n}\\n```\\n\\n然后文档中说明：\\n\\n\u003e 当前实现与旧注释之间存在语义差异。\\n\\n这是成熟源码研究工具应该具备的能力。\\n\\n---\\n\\n# 44. Knowledge Graph 的更新机制\\n\\n整个 Skill 不应该把一次阅读看成孤立任务。\\n\\n应该允许：\\n\\n```text id=\\\"f6g7h8\\\"\\nExisting Knowledge Graph\\n        +\\nNew Source Exploration\\n        ↓\\nMerge\\n        ↓\\nUpdate\\n        ↓\\nValidate\\n```\\n\\n例如已经存在：\\n\\n```text id=\\\"i9j0k1\\\"\\nBufferDesc\\n```\\n\\n新的 Buffer Manager 章节不能再创建：\\n\\n```text id=\\\"l2m3n4\\\"\\nAnother BufferDesc\\n```\\n\\n而应该引用已有 Entity。\\n\\n---\\n\\n# 45. Entity Identity\\n\\n实体最好具备稳定 ID：\\n\\n```text id=\\\"o5p6q7\\\"\\nEntityID =\\n    repository\\n    +\\nqualified symbol\\n```\\n\\n例如：\\n\\n```text id=\\\"r8s9t0\\\"\\npostgresql::BufferDesc\\n```\\n\\n函数：\\n\\n```text id=\\\"u1v2w3\\\"\\npostgresql::BufferAlloc()\\n```\\n\\n这样不同章节可以共享实体。\\n\\n---\\n\\n# 46. Knowledge Graph 最终成为整个 Skill 的长期资产\\n\\n最终可能变成：\\n\\n```text id=\\\"x4y5z6\\\"\\nPostgreSQL Knowledge Graph\\n\\nEntity\\nRelation\\nFlow\\nState\\nLifecycle\\nConcurrency\\nInvariant\\nEvidence\\n```\\n\\n不同文档只是：\\n\\n```text id=\\\"a7b8c9\\\"\\nKnowledge Graph\\n    ↓\\n不同 View\\n```\\n\\n例如：\\n\\n```text id=\\\"d0e1f2\\\"\\nBuffer Manager\\nLock Manager\\nExecutor\\nMemory Context\\n```\\n\\n不是四套孤立笔记，而是：\\n\\n```text id=\\\"g3h4i5\\\"\\n一个知识图\\n+\\n多个文档视图\\n```\\n\\n---\\n\\n# 47. 这会直接支持“增量源码阅读”\\n\\n例如今天读：\\n\\n```text id=\\\"j6k7l8\\\"\\nBuffer Manager\\n```\\n\\n明天读：\\n\\n```text id=\\\"m9n0o1\\\"\\nBuffer Replacement\\n```\\n\\n后天读：\\n\\n```text id=\\\"p2q3r4\\\"\\nWAL\\n```\\n\\nAgent 不需要从零开始。\\n\\n而是：\\n\\n```text id=\\\"s5t6u7\\\"\\nExisting Graph\\n       ↓\\nFind missing knowledge\\n       ↓\\nExplore only missing area\\n       ↓\\nExtend Graph\\n```\\n\\n这比每次生成一份新的 Markdown 强很多。\\n\\n---\\n\\n# 48. Skill 最终应该支持的四种工作模式\\n\\n推荐定义：\\n\\n```text id=\\\"v8w9x0\\\"\\nMODE 1\\nExplore\\n```\\n\\n只做源码调查，不生成最终文档。\\n\\n```text id=\\\"a1b2c3\\\"\\nMODE 2\\nModel\\n```\\n\\n只建立 Knowledge Model。\\n\\n```text id=\\\"d4e5f6\\\"\\nMODE 3\\nDocument\\n```\\n\\n从已有 Knowledge Model 生成文档。\\n\\n```text id=\\\"g7h8i9\\\"\\nMODE 4\\nReview\\n```\\n\\n检查已有源码笔记的准确性、完整性和可追踪性。\\n\\n这样它不再只是：\\n\\n```text id=\\\"j0k1l2\\\"\\n“生成笔记的 Skill”\\n```\\n\\n而是：\\n\\n\u003e **完整的 Source Understanding Skill。**\\n\\n---\\n\\n# 49. Review Mode 非常重要\\n\\n用户以后可以直接把旧笔记交给 Skill：\\n\\n```text id=\\\"m3n4o5\\\"\\nReview this source note\\n```\\n\\nSkill 可以检查：\\n\\n```text id=\\\"p6q7r8\\\"\\n图是否真实？\\nClaim 是否有证据？\\n是否遗漏生命周期？\\n是否遗漏并发？\\n是否把 pointer 当 ownership？\\n源码落点是否正确？\\n是否存在过时符号？\\n```\\n\\n并生成：\\n\\n```text id=\\\"s9t0u1\\\"\\nReview Findings\\n```\\n\\n---\\n\\n# 50. 最终的 Skill 工作协议\\n\\n完整过程：\\n\\n```text id=\\\"v2w3x4\\\"\\nUSER REQUEST\\n     ↓\\nSCOPE\\n     ↓\\nSOURCE EXPLORATION\\n     ↓\\nKNOWLEDGE MODEL\\n     ↓\\nPATTERN PROFILE\\n     ↓\\nSOURCE TRACE\\n     ↓\\nREPRESENTATION PLAN\\n     ↓\\nDOCUMENT\\n     ↓\\nVALIDATION\\n     ↓\\nFINAL\\n```\\n\\n内部核心状态：\\n\\n```text id=\\\"y5z6a7\\\"\\nSource\\nKnowledge\\nPattern\\nTrace\\nRepresentation\\nDocument\\nValidation\\n```\\n\\n---\\n\\n# 51. 最终 Skill 的真正价值\\n\\n它最终解决的不是：\\n\\n\u003e “让 Agent 写出更漂亮的源码笔记。”\\n\\n而是解决：\\n\\n```text id=\\\"b8c9d0\\\"\\n大型源码\\n    ↓\\n人类认知负担很高\\n    ↓\\nAgent 建立结构化知识\\n    ↓\\n人类通过文档建立 Mental Model\\n    ↓\\n沿 Source Anchor 回到源码\\n    ↓\\n继续自主阅读\\n```\\n\\n所以它最终更接近：\\n\\n\u003e **Source Code Knowledge Compiler**\\n\\n而不是：\\n\\n\u003e Markdown Generator。\\n\\n---\\n\\n# 52. 最终架构图\\n\\n把整个六步过程放在一起：\\n\\n```text id=\\\"e1f2g3\\\"\\n                         SOURCE REPOSITORY\\n                                │\\n                                ▼\\n                    ┌────────────────────┐\\n                    │   Source Explorer  │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │ Knowledge Modeler  │\\n                    │                    │\\n                    │ Entity             │\\n                    │ Relation           │\\n                    │ Flow               │\\n                    │ State              │\\n                    │ Lifecycle          │\\n                    │ Concurrency        │\\n                    │ Constraint         │\\n                    │ Evidence           │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │  Pattern Detector  │\\n                    │                    │\\n                    │ Dominant           │\\n                    │ Secondary          │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │   Trace Engine     │\\n                    │                    │\\n                    │ Claim              │\\n                    │ Evidence           │\\n                    │ Source Anchor      │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │ Representation     │\\n                    │     Planner        │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │ Document Generator │\\n                    │                    │\\n                    │ Markdown           │\\n                    │ Mermaid            │\\n                    │ Source Snippets    │\\n                    └──────────┬─────────┘\\n                               │\\n                               ▼\\n                    ┌────────────────────┐\\n                    │    Validator       │\\n                    └───────┬────┬───────┘\\n                            │    │\\n                       PASS │    │ FAIL\\n                            │    └──────→ REVISE\\n                            ↓\\n                         FINAL DOC\\n                            │\\n                            ↓\\n                      BACK TO SOURCE\\n```\\n\\n---\\n\\n# 53. 六步体系最终闭环\\n\\n```text id=\\\"h4i5j6\\\"\\nSTEP 1\\nKnowledge Model\\n“认识什么？”\\n\\n        ↓\\n\\nSTEP 2\\nPattern Recognition\\n“主要是什么理解问题？”\\n\\n        ↓\\n\\nSTEP 3\\nRepresentation\\n“如何表达最有效？”\\n\\n        ↓\\n\\nSTEP 4\\nTraceability\\n“如何证明？”\\n\\n        ↓\\n\\nSTEP 5\\nDocument Generation\\n“如何组织成可读知识？”\\n\\n        ↓\\n\\nSTEP 6\\nSkill Architecture\\n“如何让 Agent 稳定执行整个闭环？”\\n```\\n\\n最终形成：\\n\\n```text id=\\\"k7l8m9\\\"\\n         ┌──────────────────────────────┐\\n         │     Source Reading Skill     │\\n         │                              │\\n         │  Understand → Model → Trace  │\\n         │       ↓             ↓        │\\n         │      Pattern → Represent     │\\n         │               ↓              │\\n         │            Document          │\\n         │               ↓              │\\n         │           Validate           │\\n         └──────────────────────────────┘\\n```\\n\\n---\\n\\n# 54. v0.1 的工程化边界\\n\\n第一版 Skill 不应该试图解决所有问题。\\n\\n建议首先支持：\\n\\n```text id=\\\"n0o1p2\\\"\\nC / C++\\nstruct/class\\nfunction\\npointer/reference\\ncall relation\\nstate\\nlifecycle\\nlock\\natomic\\nmemory ownership\\nresource management\\n```\\n\\n并优先验证：\\n\\n```text id=\\\"q3r4s5\\\"\\nPostgreSQL\\nBuffer Manager\\nLock Manager\\nTupleTableSlot\\nRelation\\nMemory Context\\n```\\n\\n这几个主题已经足以覆盖绝大多数 Pattern。\\n\\n等这些案例验证通过后，再考虑：\\n\\n```text id=\\\"t6u7v8\\\"\\ntemplate-heavy C++\\nvirtual dispatch\\ncomplex macro metaprogramming\\nasync callback\\ncoroutine\\nlock-free\\nRCU\\nJIT\\n```\\n\\n---\\n\\n# 55. Skill 的最终设计哲学\\n\\n整个体系最终可以浓缩成一句：\\n\\n\u003e **Agent 不负责“替人读完整个源码”，而负责把源码压缩成一张可验证的知识地图，并让人能够从地图重新进入源码。**\\n\\n所以真正的核心产物不是：\\n\\n```text\\nMarkdown\\n```\\n\\n也不是：\\n\\n```text\\nMermaid\\n```\\n\\n而是：\\n\\n```text\\nKnowledge Graph\\n+\\nPattern Profile\\n+\\nTrace Map\\n```\\n\\nMarkdown 只是这个知识系统的一个 View。\\n\\n::\\n\\n这样，Step 6 之后，整个方案已经从“源码笔记规范”升级成了一个比较完整的 **Source Code Understanding Skill 架构**。\\n\\n我认为接下来还有一个非常关键的步骤，不过它已经不属于原来的 1～6 了：**Step 7 应该做真实案例反推**。也就是拿你一直在研究的 `TupleTableSlot`、`Relation`、`Lock Manager`、`Buffer Manager` 四个案例，完全按照这套 Skill 手工跑一遍，看看 `Knowledge Model → Pattern → Trace → Representation → Document` 哪些地方会卡住。这个过程很可能会发现目前模型里还有缺失项，而不是继续凭空增加规范。\",{},{\"_168\":719,\"_175\":1067,\"_54\":1068,\"_56\":1068,\"_179\":1069,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":1070,\"_188\":189},\"b0055278-c068-4ace-8525-cb867955bc11\",[704],{\"_250\":251,\"_186\":1077},1789653728.13321,{\"_245\":272,\"_179\":1076},{\"_260\":261,\"_262\":1071,\"_264\":1072,\"_266\":1073,\"_268\":269,\"_207\":208,\"_209\":34,\"_210\":732,\"_212\":213,\"_214\":733,\"_216\":733,\"_201\":202,\"_217\":202,\"_66\":67,\"_218\":1074,\"_220\":14,\"_221\":1075,\"_222\":735,\"_271\":34,\"_224\":10},6,1789653721.748264,1789653728.1284661,[225],\"f8a81157-bde9-45e2-a4f0-6ca2e22c250b\",\"思考了 6s\",{},{\"_168\":1065,\"_175\":1081,\"_54\":1082,\"_56\":1083,\"_179\":1084,\"_181\":182,\"_183\":14,\"_184\":185,\"_18 235\":14,\"_236\":14,\"_237\":-5},\"131\",{\"_168\":1312,\"_235\":14,\"_236\":14,\"_237\":-5},\"132\",{\"_168\":1311,\"_235\":14,\"_236\":14,\"_237\":-5},\"133\",{\"_168\":1310,\"_235\":14,\"_236\":14,\"_237\":-5},\"134\",{\"_168\":1309,\"_235\":14,\"_236\":14,\"_237\":-5},\"135\",{\"_168\":1308,\"_235\":14,\"_236\":14,\"_237\":-5},\"fhn1x3\",\"v1nv5y\",\"vewefm\",\"iurpro\",\"cufw15\",\"3c7fy9\",\"fvbin3\",\"bw43jb\",\"qv4t4b\",\"eqjijb\",\"1i8q3u\",\"02f4qy\",\"r663lz\",\"9hdd07\",\"djz0sm\",\"cvklbk\",\"8u77n8\",\"1kbkjh\",\"2pjbyu\",\"7gewum\",\"ug2gym\",\"gxxxuy\",\"km1u7y\",\"y3exfw\",\"7rbdsi\",\"v2754e\",\"u0w3tf\",\"dhawiz\",\"5noaw6\",\"i9ruha\",\"zy4ipj\",\"b4ljav\",\"mnjf1e\",\"m840ae\",\"5hqkga\",\"jz4t7e\",\"rpj7id\",\"1kxwbl\",\"8eoduy\",\"ddlykh\",\"59hxks\",\"ney4ap\",\"hrdcww\",\"ftrv10\",\"aazq68\",\"0xjqu8\",\"55jibl\",\"87iv6q\",\"jlb8fx\",\"xw1a2v\",\"4orinv\",\"ox2eum\",\"wzrjwa\",\"mj2w9g\",\"9ngmv6\",\"uhkq69\",\"7f0flm\",\"ks7o9t\",\"yt06vm\",\"v1lr7b\",\"8fv69w\",\"x6d7m8\",\"okq1yu\",\"i2vaw0\",\"8eemif\",\"yoakq8\",\"lb43p3\",\"1a1v8l\",\"5lkxjs\",\"7arf5x\",\"3ckhis\",\"nnyv7c\",\"3z6i4d\",\"2oqe5h\",\"7eswsm\",\"0tvqs7\",\"v28ofi\",\"nm238n\",\"utj0fr\",\"h6nk6v\",\"zvuovu\",\"700wc0\",\"9pn8vv\",\"mbqome\",\"zt1i16\",\"plfb5a\",\"ofkzzl\",\"f3l4mk\",\"pc2vat\",\"vkg1mx\",\"ez5n68\",\"2hwta0\",\"wmxw0e\",\"4y94j7\",\"8980ax\",\"c4xmym\",\"ly0n5t\",\"vvavix\",\"efpenr\",\"2lt8vq\",\"tmlmxd\",\"69ccpf\",\"2o30gz\",\"0l4td8\",\"1wi6dk\",\"r1km2e\",\"9muvii\",\"ie85ww\",\"z8uu9l\",\"2qsuuy\",\"godpb8\",\"l70y92\",\"k8784q\",\"vugq0a\",\"inckcg\",\"bkq73k\",\"pxfa6n\",\"nlmuuk\",\"dyrdlf\",\"u54olw\",\"x8howu\",\"dq6nvg\",\"6b8xiy\",\"52lwo0\",\"m7pr26\",\"mjydf1\",\"7oy05k\",\"po03t9\",\"dykt40\",\"9dpwp8\",\"emhbp8\",\"ogpom5\",\"7z1sml\",\"he3cq9\",\"5vuwok\",\"selwfs\",[244],[1446],\"前四步解决的是“**理解什么、识别什么、怎么表达、怎么证明**”。  \\nStep 5 要解决最后一个问题：\\n\\n\u003e **怎样把这些中间产物稳定地组装成一份人真正愿意读、读完还能继续跟源码走的文档。**\\n\\n这里我建议把目标从“Markdown 模板”提升为 **Document Generation Specification（源码阅读文档生成规范）**。\\n\\n核心不是规定每篇文档都长得一样，而是规定：\\n\\n```text\\n什么必须有\\n什么应该有\\n什么按模式变化\\n什么不应该出现\\n```\\n\\n:::writing{variant=\\\"document\\\" id=\\\"42751\\\" title=\\\"大型 C/C++ 项目源码阅读文档生成规范 v0.1\\\"}\\n\\n# 大型 C/C++ 项目源码阅读文档生成规范 v0.1\\n\\n## 1. 文档定位\\n\\n源码阅读文档不是源码摘要，也不是 API 手册。\\n\\n它的目标是建立：\\n\\n```text\\nSource\\n  ↓\\nMental Model\\n  ↓\\nSource Navigation\\n```\\n\\n即帮助读者形成：\\n\\n\u003e **“这个系统为什么这么组织、运行时怎么走、关键对象怎么变化，以及真正的代码在哪里。”**\\n\\n因此文档生成的基本单位不是：\\n\\n```text\\nFile\\nFunction\\nStruct\\n```\\n\\n而是：\\n\\n```text\\nQuestion\\n  ↓\\nKnowledge\\n  ↓\\nRepresentation\\n  ↓\\nEvidence\\n```\\n\\n---\\n\\n# 2. 文档生成的总体输入\\n\\nDocument Generator 的输入必须来自前四步。\\n\\n```text\\nKnowledge Model\\n        +\\nPattern Profile\\n        +\\nRepresentation Plan\\n        +\\nSource Trace\\n        ↓\\nDocument Generator\\n        ↓\\nSource Reading Document\\n```\\n\\n因此生成器不应该重新猜测：\\n\\n```text\\n“这个模块可能是干什么的”\\n```\\n\\n如果前面的知识模型里没有这个事实，文档生成阶段不能自己补。\\n\\n---\\n\\n# 3. 文档有两个层次\\n\\n最终文档应该同时服务两类读者。\\n\\n### Layer 1：理解层\\n\\n帮助读者快速建立：\\n\\n```text\\n这是什么？\\n为什么重要？\\n核心对象是什么？\\n核心流程是什么？\\n```\\n\\n### Layer 2：源码层\\n\\n帮助读者继续：\\n\\n```text\\n这个对象在哪里定义？\\n这个函数在哪里？\\n字段在哪里修改？\\n这个分支为什么发生？\\n下一步应该读什么？\\n```\\n\\n因此：\\n\\n```text\\n文档\\n├── Understanding Layer\\n└── Source Navigation Layer\\n```\\n\\n二者必须结合。\\n\\n---\\n\\n# 4. 文档的基本骨架\\n\\n一篇完整源码阅读文档推荐使用：\\n\\n```text\\n# 标题\\n\\n## 0. 本章解决什么问题\\n\\n## 1. 一句话建立模型\\n\\n## 2. 核心对象 / 上下文\\n\\n## 3. Primary View\\n\\n## 4. 核心行为 / 主流程\\n\\n## 5. 关键实现细节\\n\\n## 6. 状态 / 生命周期 / 并发 / 异常\\n   （根据 Pattern 决定是否存在）\\n\\n## 7. 关键不变量\\n\\n## 8. 源码导读\\n\\n## 9. 小结\\n```\\n\\n但这不是固定模板。\\n\\n真正固定的是：\\n\\n```text\\nContext\\n→ Mental Model\\n→ Core Behavior\\n→ Implementation\\n→ Source Navigation\\n→ Key Constraints\\n```\\n\\n具体章节由 Pattern 决定。\\n\\n---\\n\\n# 5. 第 0 节：本章解决什么问题\\n\\n这是推荐保留的“导航入口”。\\n\\n不要从：\\n\\n```text\\nstruct BufferDesc 定义如下……\\n```\\n\\n开始。\\n\\n而从：\\n\\n\u003e **这一章到底要解决什么理解问题？**\\n\\n例如：\\n\\n```text\\n本章回答：\\n\\nBuffer Manager 中 BufferTag、BufTable、\\nBufferDesc 是如何协作，将一个逻辑 page\\n定位到 shared buffer 的？\\n```\\n\\n或者：\\n\\n```text\\n本章回答：\\n\\n一个 lock request 从进入 Lock Manager\\n到最终 granted / waiting，经历哪些路径？\\n```\\n\\n---\\n\\n# 6. 第 1 节：一句话建立模型\\n\\n这是读者第一次形成 mental model 的地方。\\n\\n推荐：\\n\\n```text\\n一句话\\n+\\n一张核心图（有必要才有）\\n```\\n\\n例如：\\n\\n\u003e `TupleTableSlot` 是 executor 中承载当前 tuple 表示的统一容器，它将 tuple、值数组及相关状态组织在一起，并在 executor 节点之间被反复复用。\\n\\n下面再给：\\n\\n```text\\nTuple\\n   ↓\\nTupleTableSlot\\n   ↓\\nExecutor\\n```\\n\\n这一节的目标不是详细，而是：\\n\\n\u003e **让读者知道后面为什么要看这些东西。**\\n\\n---\\n\\n# 7. Core Model：核心模型优先于细节\\n\\n接下来建立本章真正的“知识骨架”。\\n\\n常见内容：\\n\\n```text\\n核心 Entity\\n核心 Relation\\n核心 State\\n核心 Flow\\n核心 Resource\\n```\\n\\n不要一上来解释所有字段。\\n\\n例如 `BufferDesc`：\\n\\n```text\\nBufferDesc\\n ├── identity → BufferTag\\n ├── state → header state\\n └── content_lock → page content\\n```\\n\\n然后再解释：\\n\\n```text\\n为什么有这三个关键组成部分？\\n```\\n\\n---\\n\\n# 8. Primary View 必须成为视觉中心\\n\\n前面的 Representation Plan 已经确定：\\n\\n```text\\nPrimary View\\nSecondary Views\\n```\\n\\n文档生成时：\\n\\n\u003e **Primary View 应该成为本节最核心的视觉对象。**\\n\\n例如：\\n\\n### Structural\\n\\n```text\\n核心关系图\\n```\\n\\n### Flow\\n\\n```text\\n核心流程图\\n```\\n\\n### State\\n\\n```text\\n状态机\\n```\\n\\n### Lifecycle\\n\\n```text\\n生命周期图\\n```\\n\\n### Concurrency\\n\\n```text\\n同步关系图\\n```\\n\\n不要把所有图平均铺开。\\n\\n---\\n\\n# 9. 图、文字、源码的职责\\n\\n最终文档必须遵守：\\n\\n```text\\n图     → 结构 / 路径 / 变化关系\\n文字   → 语义 / 原因 / 条件 / 解释\\n源码   → 证据 / 真实实现\\n```\\n\\n例如：\\n\\n```text\\n              BufferTag\\n                  │\\n                 hash\\n                  ↓\\n              BufTable\\n                  │\\n               bucket\\n                  ↓\\n             BufferDesc\\n```\\n\\n下面文字说明：\\n\\n\u003e `BufferTag` 并不直接指向 `BufferDesc`。系统先根据 tag 计算 hash，再通过对应 partition 的 bucket 查找 descriptor。\\n\\n然后给关键源码：\\n\\n```c\\nhashvalue = BufTableHashCode(\u0026newTag);\\n```\\n\\n这样三层各自承担不同任务。\\n\\n---\\n\\n# 10. 图之后必须有“图的语义解释”\\n\\n不能：\\n\\n```text\\n图\\n↓\\n下一张图\\n```\\n\\n每个核心图之后至少解释：\\n\\n```text\\n1. 看什么\\n2. 最关键的关系是什么\\n3. 容易误解的地方是什么\\n```\\n\\n例如：\\n\\n\u003e 图中最重要的不是 `BufferTag → BufTable` 这一条边，而是 `BufTable` 承担了从逻辑 page identity 到具体 `BufferDesc` 的定位职责。`BufferDesc` 才是实际承载 buffer runtime state 的对象。\\n\\n这样读者才知道：\\n\\n\u003e **这张图应该读什么。**\\n\\n---\\n\\n# 11. 核心对象使用“对象卡片”\\n\\n对于重要 Entity，不建议大量连续 prose。\\n\\n推荐：\\n\\n```text\\n### BufferDesc\\n\\n职责：\\n    一个 shared buffer 的运行时元数据。\\n\\n关键字段：\\n    state\\n    tag\\n    content_lock\\n\\n管理者：\\n    Buffer Manager\\n\\n生命周期：\\n    free → allocated → pinned → released\\n```\\n\\n然后再进入源码。\\n\\n对象卡片适合：\\n\\n```text\\nStruct\\nClass\\nRuntime Object\\nManager\\nResource\\n```\\n\\n---\\n\\n# 12. 字段表只展示“理解必要字段”\\n\\n不要把：\\n\\n```text\\nstruct\\n{\\n    field1\\n    field2\\n    field3\\n    ...\\n    field27\\n}\\n```\\n\\n全部复制成表格。\\n\\n推荐：\\n\\n| 字段 | 作用 | 关联知识 |\\n|---|---|---|\\n| `state` | buffer header 状态 | State |\\n| `tag` | page identity | Structural |\\n| `content_lock` | 保护 page content | Concurrency |\\n\\n字段选择原则：\\n\\n\u003e **字段是否参与当前章节的核心知识？**\\n\\n如果不参与，不讲。\\n\\n---\\n\\n# 13. 主流程必须围绕“用户问题”组织\\n\\n不要：\\n\\n```text\\n函数 A\\n函数 B\\n函数 C\\n函数 D\\n```\\n\\n应该：\\n\\n```text\\n一次操作\\n  ↓\\n阶段 1\\n  ↓\\n阶段 2\\n  ↓\\n判断\\n  ├── Path A\\n  └── Path B\\n  ↓\\n结果\\n```\\n\\n每一个关键阶段再标出：\\n\\n```text\\n对应函数\\n对应对象\\n对应状态变化\\n```\\n\\n例如：\\n\\n```text\\nRequest\\n  ↓\\nLookup\\n  ↓\\nFound?\\n ├── Yes → reuse\\n └── No  → allocate victim\\n                  ↓\\n               initialize\\n```\\n\\n旁边标：\\n\\n```text\\nLookup → BufTable lookup\\nallocate → BufferAlloc()\\n```\\n\\n---\\n\\n# 14. 源码元素应该嵌入流程\\n\\n不要把代码全部放到文档最后。\\n\\n例如：\\n\\n```text\\n### 3.2 查找现有 Buffer\\n\\n系统先根据 `BufferTag` 查表。\\n\\n```c\\nhashvalue = BufTableHashCode(\u0026newTag);\\n```\\n\\n这里对应：\\n\\n`BufTableHashCode()` → `BufTable` lookup。\\n\\n如果没有找到，再进入 victim selection。\\n```\\n\\n这样：\\n\\n```text\\n概念\\n ↓\\n源码\\n ↓\\n解释\\n```\\n\\n是连续的。\\n\\n---\\n\\n# 15. Source Anchor 的显示位置\\n\\nSource Anchor 有三种推荐位置。\\n\\n## 类型 A：就地引用\\n\\n```text\\n`BufferAlloc()`\\n```\\n\\n适合简单落点。\\n\\n---\\n\\n## 类型 B：源码导读\\n\\n```text\\n\u003e 源码落点：`BufferAlloc()` 的 victim selection 分支\\n```\\n\\n适合深入阅读。\\n\\n---\\n\\n## 类型 C：导航表\\n\\n| 知识点 | 源码落点 | 用途 |\\n|---|---|---|\\n| Buffer identity | `BufferTag` | 理解定位 |\\n| victim selection | `BufferAlloc()` | 理解分配 |\\n| pin | `PinBuffer()` | 理解生命周期 |\\n| release | `UnpinBuffer()` | 理解生命周期 |\\n\\n适合章节末尾集中导航。\\n\\n---\\n\\n# 16. Source Navigation 是正式章节\\n\\n大型项目中建议保留：\\n\\n```text\\n## 源码导读\\n```\\n\\n但它不是：\\n\\n```text\\n文件名大杂烩\\n```\\n\\n而是：\\n\\n```text\\n阅读目标\\n   ↓\\nSymbol\\n   ↓\\n下一跳\\n```\\n\\n例如：\\n\\n```text\\n阅读 Buffer lookup：\\n\\n1. `ReadBuffer_common()`\\n2. `BufferAlloc()`\\n3. `BufTableHashCode()`\\n4. `BufMappingPartitionLock()`\\n\\n阅读 Buffer lifecycle：\\n\\n1. `PinBuffer()`\\n2. `UnpinBuffer()`\\n3. `InvalidateBuffer()`\\n```\\n\\n这会让文档真正成为源码学习导航。\\n\\n---\\n\\n# 17. “下一跳”原则\\n\\n优秀源码笔记应该回答：\\n\\n\u003e **“我看完这一节以后，接下来应该打开哪个函数？”**\\n\\n例如：\\n\\n```text\\nReadBuffer()\\n    ↓\\n如果要理解 buffer 分配\\n    → BufferAlloc()\\n\\n如果要理解 mapping\\n    → BufTableLookup()\\n\\n如果要理解 pin\\n    → PinBuffer()\\n```\\n\\n这是普通总结文档没有、但源码阅读文档非常有价值的一项。\\n\\n---\\n\\n# 18. State / Lifecycle / Concurrency 按需插入\\n\\n不要固定每篇文档都有：\\n\\n```text\\n状态\\n生命周期\\n并发\\n异常\\n```\\n\\n而应该由 Pattern Profile 决定。\\n\\n例如：\\n\\n```text\\nTupleTableSlot\\n    dominant = Lifecycle\\n```\\n\\n文档重点：\\n\\n```text\\n对象\\n→ 生命周期\\n→ 数据路径\\n→ 关键状态\\n```\\n\\n而：\\n\\n```text\\nLock Manager\\n    dominant = Concurrency\\n```\\n\\n文档重点：\\n\\n```text\\n对象\\n→ 并发角色\\n→ 请求流程\\n→ 冲突\\n→ 等待\\n→ granted\\n```\\n\\n---\\n\\n# 19. State 文档结构\\n\\n如果 State 是主模式，推荐：\\n\\n```text\\n对象当前状态是什么\\n        ↓\\n状态由哪些字段表示\\n        ↓\\n如何进入该状态\\n        ↓\\n如何离开\\n        ↓\\n每个状态有什么约束\\n```\\n\\n例如：\\n\\n```text\\nFREE\\n  ↓ allocate\\nVALID\\n  ↓ modify\\nDIRTY\\n  ↓ flush\\nCLEAN\\n```\\n\\n然后分别指出：\\n\\n```text\\nState field\\nTransition function\\nTransition condition\\n```\\n\\n---\\n\\n# 20. Lifecycle 文档结构\\n\\n如果 Lifecycle 是主模式：\\n\\n```text\\n创建\\n ↓\\n初始化\\n ↓\\n发布\\n ↓\\n获取\\n ↓\\n使用\\n ↓\\n释放\\n ↓\\n销毁\\n```\\n\\n每一步尽量对应：\\n\\n```text\\nFunction\\nOwner\\nReference / Pin\\nState\\n```\\n\\n例如：\\n\\n```text\\ncreate\\n  → CreateX()\\n\\nacquire\\n  → GetX()\\n\\nrelease\\n  → PutX()\\n\\ndestroy\\n  → FreeX()\\n```\\n\\n---\\n\\n# 21. Concurrency 文档结构\\n\\n如果 Concurrency 是主模式，必须围绕：\\n\\n```text\\n谁\\n访问什么\\n谁保护\\n为什么等待\\n什么时候唤醒\\n```\\n\\n组织。\\n\\n推荐：\\n\\n```text\\n### 角色\\n\\n### 共享状态\\n\\n### 同步原语\\n\\n### 获取 / 释放路径\\n\\n### 冲突与等待\\n\\n### 并发不变量\\n```\\n\\n而不是：\\n\\n```text\\n这里有 mutex。\\n这里还有 spinlock。\\n这里用了 atomic。\\n```\\n\\n后者是 API 清单，不是并发模型。\\n\\n---\\n\\n# 22. Recovery 文档结构\\n\\n如果 Recovery 是核心模式：\\n\\n```text\\nNormal Path\\n    ↓\\nFailure Condition\\n    ↓\\nPartial State\\n    ↓\\nCleanup\\n    ↓\\nRollback\\n    ↓\\nRetry / Abort / Recover\\n```\\n\\n尤其要指出：\\n\\n\u003e **失败时已经发生了什么。**\\n\\n这是数据库、文件系统、存储系统里非常关键的知识。\\n\\n---\\n\\n# 23. Invariant 必须成为文档中的稳定元素\\n\\n当存在重要不变量时，建议明确给出：\\n\\n```text\\n### 关键不变量\\n```\\n\\n例如：\\n\\n\u003e 当 `refcount \u003e 0` 时，对象仍然处于有效使用期内，不能被最终释放。\\n\\n然后标记：\\n\\n```text\\nFact / Inference\\n```\\n\\n以及关键 Evidence。\\n\\n这类内容往往比“函数说明”更值得长期记忆。\\n\\n---\\n\\n# 24. 文档的深度分层\\n\\n一份好的源码阅读文档不能所有内容都同样详细。\\n\\n推荐三层：\\n\\n```text\\nL1  Mental Model\\nL2  Core Implementation\\nL3  Deep Dive\\n```\\n\\n---\\n\\n## L1 Mental Model\\n\\n回答：\\n\\n```text\\n它是什么？\\n有哪些核心对象？\\n核心流程是什么？\\n为什么值得关注？\\n```\\n\\n适合快速阅读。\\n\\n---\\n\\n## L2 Core Implementation\\n\\n回答：\\n\\n```text\\n核心字段\\n关键函数\\n主要分支\\n状态\\n并发\\n生命周期\\n```\\n\\n这是主体。\\n\\n---\\n\\n## L3 Deep Dive\\n\\n用于：\\n\\n```text\\n特殊优化\\n边界条件\\n复杂宏\\n底层数据结构\\ncache / lock / atomic\\n微妙实现细节\\n```\\n\\n这样新读者不需要一开始进入最深层。\\n\\n---\\n\\n# 25. 不要把所有细节放在正文\\n\\n例如：\\n\\n```text\\nNUM_BUFFER_PARTITIONS\\nBUFFER_MAPPING_LWLOCK_OFFSET\\nBufTableHashCode()\\n```\\n\\n这些都可能重要。\\n\\n但如果章节主题只是：\\n\\n\u003e Buffer 是如何被定位？\\n\\n那么：\\n\\n```text\\n主文：\\nBufferTag → hash → partition → bucket → BufferDesc\\n```\\n\\n然后 Deep Dive：\\n\\n```text\\n### 为什么使用 partition？\\n\\n### hash 如何映射到 partition？\\n\\n### `BufMappingPartitionLock()` 如何定位 LWLock？\\n```\\n\\n这样层次就清楚。\\n\\n---\\n\\n# 26. 源码阅读文档应该存在“渐进深入”\\n\\n推荐：\\n\\n```text\\n概念\\n ↓\\n核心图\\n ↓\\n一句解释\\n ↓\\n关键代码\\n ↓\\n源码导读\\n ↓\\nDeep Dive\\n```\\n\\n读者可以在任何层级停止。\\n\\n---\\n\\n# 27. 跨章节引用\\n\\n大型项目不能每一章重复解释同一对象。\\n\\n应该建立：\\n\\n```text\\nConcept Reference\\n```\\n\\n例如：\\n\\n```text\\n本章：\\n    BufferTag 如何定位 Buffer\\n\\n相关章节：\\n    → BufferDesc 生命周期\\n    → Buffer Mapping 并发\\n    → Buffer replacement\\n```\\n\\n文档应该允许：\\n\\n```text\\n“这里先把 Buffer 生命周期视为已知，\\n详见《Buffer 生命周期》。”\\n```\\n\\n这样整个知识库才能形成图，而不是多个互相重复的 Markdown 文件。\\n\\n---\\n\\n# 28. Canonical Explanation 原则\\n\\n一个重要概念应该有一个“权威解释位置”。\\n\\n例如：\\n\\n```text\\nBufferDesc\\n```\\n\\n可以由：\\n\\n```text\\nBuffer Manager / 01-核心对象\\n```\\n\\n负责定义。\\n\\n其他章节只引用：\\n\\n```text\\nBufferDesc\\n```\\n\\n而不是重新解释：\\n\\n```text\\nBufferDesc 是……\\nBufferDesc 是……\\nBufferDesc 是……\\n```\\n\\n避免不同章节出现语义漂移。\\n\\n---\\n\\n# 29. 文档目录应该围绕知识主题，而不是源码目录\\n\\n不推荐：\\n\\n```text\\n01 bufmgr.c\\n02 buf_table.c\\n03 localbuf.c\\n04 freelist.c\\n```\\n\\n推荐：\\n\\n```text\\n01 Buffer Manager 是什么\\n02 核心对象与管理关系\\n03 Buffer 如何被定位\\n04 Buffer 如何被获取\\n05 Pin / Unpin 生命周期\\n06 Buffer State 与并发保护\\n07 Replacement\\n```\\n\\n源码文件只是 Source Anchor。\\n\\n---\\n\\n# 30. 文档章节拆分规则\\n\\n什么时候应该拆成多个章节？\\n\\n当出现：\\n\\n```text\\n新的核心问题\\n新的 Dominant Pattern\\n新的独立对象群\\n新的生命周期\\n新的复杂并发模型\\n```\\n\\n例如：\\n\\n```text\\n“Buffer 如何定位？”\\n```\\n\\n和：\\n\\n```text\\n“Buffer 如何淘汰？”\\n```\\n\\n虽然都属于 Buffer Manager，但理解问题明显不同。\\n\\n应该拆开。\\n\\n---\\n\\n# 31. 不应拆章节的情况\\n\\n如果只是：\\n\\n```text\\n不同函数实现同一件事\\n不同分支实现同一模型\\n同一个对象的几个字段\\n```\\n\\n通常放在同一章。\\n\\n目标是保持：\\n\\n\u003e **一个章节 = 一个可以被读者完整建立起来的 Mental Model。**\\n\\n---\\n\\n# 32. 一个章节只应该有一个主问题集合\\n\\n这里不是要求“一章只能有一个问题”。\\n\\n可以是：\\n\\n```text\\n主问题：\\n    Buffer 如何被获取？\\n\\n子问题：\\n    怎么查找？\\n    找不到怎么办？\\n    怎么选择 victim？\\n    怎么 pin？\\n```\\n\\n这些仍然属于一个完整 Mental Model。\\n\\n但如果变成：\\n\\n```text\\nBuffer 如何获取？\\n+\\nWAL 如何提交？\\n+\\nCheckpoint 如何工作？\\n```\\n\\n则应该拆。\\n\\n---\\n\\n# 33. Mermaid 的使用规范\\n\\nMermaid 只用于：\\n\\n\u003e **关系、流程、状态、时序等确实适合图形化的知识。**\\n\\n推荐：\\n\\n```text\\ngraph\\nflowchart\\nstateDiagram\\nsequenceDiagram\\n```\\n\\n选择由 Representation Plan 决定。\\n\\n---\\n\\n# 34. Mermaid 不应该承载全部知识\\n\\n不要把几十个字段、几十个函数、所有条件都放进图里。\\n\\n例如：\\n\\n```text\\nBAD:\\nA\\nB\\nC\\nD\\nE\\nF\\nG\\nH\\nI\\nJ\\n...\\n```\\n\\n而是：\\n\\n```text\\n核心图\\n    ↓\\n解释\\n    ↓\\n源码\\n```\\n\\n图只承担“第一眼建立关系”。\\n\\n---\\n\\n# 35. Mermaid 节点命名规范\\n\\n节点最好使用：\\n\\n```text\\n源码对象名\\n+\\n少量语义\\n```\\n\\n例如：\\n\\n```text\\nBufferDesc\\nBufferTag\\nBufTable\\nLWLock\\n```\\n\\n不要：\\n\\n```text\\n这里负责管理 shared buffer 元数据的那个结构\\n```\\n\\n过度自然语言会让图失去源码导航能力。\\n\\n---\\n\\n# 36. 图应该尽量与源码名称一致\\n\\n例如：\\n\\n```text\\nBufferDesc\\n```\\n\\n不要在图中改成：\\n\\n```text\\nBuffer Metadata Object\\n```\\n\\n否则读者无法直接 grep。\\n\\n应该：\\n\\n```text\\nBufferDesc\\n    （shared buffer 元数据）\\n```\\n\\n这样既有源码锚点，又有解释。\\n\\n---\\n\\n# 37. 源码名称是导航语言\\n\\n源码阅读文档中：\\n\\n```text\\nBufferDesc\\nBufferAlloc()\\nExecStoreHeapTuple()\\n```\\n\\n本身就是用户未来的搜索关键词。\\n\\n所以不要为了“通俗”而把它们全部改成：\\n\\n```text\\nbuffer描述对象\\nbuffer分配函数\\ntuple存储函数\\n```\\n\\n推荐：\\n\\n```text\\n`BufferDesc`（shared buffer 元数据）\\n\\n`BufferAlloc()`（选择并分配 buffer）\\n```\\n\\n---\\n\\n# 38. 代码片段使用原则\\n\\n源码片段应该是：\\n\\n```text\\n短\\n关键\\n可解释\\n可跳转\\n```\\n\\n优先展示：\\n\\n```text\\nstruct\\n关键 condition\\n关键 mutation\\n关键 lock\\n关键 call\\n关键 cleanup\\n```\\n\\n不要贴整函数，除非整个函数本身就是研究对象。\\n\\n---\\n\\n# 39. 文档中的源码片段应该带“看点”\\n\\n例如：\\n\\n```text\\n```c\\nif (found)\\n    ...\\nelse\\n    BufferAlloc(...);\\n```\\n```\\n\\n下面直接说明：\\n\\n\u003e 这里是 lookup → allocation 的主分叉点。\\n\\n而不是让读者自己猜。\\n\\n---\\n\\n# 40. 文档语言规范\\n\\n源码阅读文档推荐：\\n\\n```text\\n专业\\n准确\\n具体\\n少形容词\\n少空泛总结\\n```\\n\\n尽量少写：\\n\\n```text\\n非常重要\\n非常核心\\n非常巧妙\\n优雅地\\n高效地\\n强大地\\n```\\n\\n除非这些判断有明确指标或源码事实支持。\\n\\n---\\n\\n# 41. 优先使用“关系语言”\\n\\n例如：\\n\\n```text\\nA owns B\\nA references B\\nA protects B\\nA modifies B\\nA calls B\\nA transitions B\\n```\\n\\n而不是：\\n\\n```text\\nA 和 B 是非常紧密的关系。\\nA 与 B 配合完成……\\n```\\n\\n前者更精确，也更容易自动建模。\\n\\n---\\n\\n# 42. 优先使用“条件语言”\\n\\n例如：\\n\\n```text\\n当 X 时……\\n只有 Y 才会……\\n如果 Z，则……\\n除非 A，否则……\\n```\\n\\n这些句式天然对应：\\n\\n```text\\nFlow\\nState\\nInvariant\\n```\\n\\n也是从源码提炼知识的关键。\\n\\n---\\n\\n# 43. 文档中的事实层次\\n\\n正文应该尽量区分：\\n\\n```text\\n源码事实\\n推导\\n解释\\n```\\n\\n推荐：\\n\\n\u003e `LockAcquire()` 首先尝试 fast-path。  \\n\u003e 如果 fast-path 无法满足请求，则进入主 lock table 路径。  \\n\u003e 从实现上看，fast-path 减少了部分请求访问共享主表的需求。\\n\\n这里：\\n\\n```text\\n第一句 = FACT\\n第二句 = FACT / Flow\\n第三句 = INFERENCE\\n```\\n\\n不要全部写成：\\n\\n\u003e fast-path 是为了性能优化。\\n\\n---\\n\\n# 44. 文档不要隐藏不确定性\\n\\n如果源码无法确认：\\n\\n```text\\n设计目的\\n历史原因\\n性能动机\\n架构决策\\n```\\n\\n必须明确：\\n\\n```text\\n源码能够确认……\\n从实现可以推断……\\n可能的设计原因是……\\n当前源码不足以确认……\\n```\\n\\n这会比“强行给出一个漂亮解释”更专业。\\n\\n---\\n\\n# 45. 小结不能只是重复正文\\n\\n好的小结应该回答：\\n\\n```text\\n读完后应该记住什么？\\n接下来应该读什么？\\n```\\n\\n例如：\\n\\n```text\\n本章需要记住三件事：\\n\\n1. BufferTag 是 page identity。\\n2. BufTable 负责定位 BufferDesc。\\n3. mapping partition lock 保护并发 lookup/update。\\n\\n下一步阅读：\\n`BufferAlloc()` → victim selection。\\n```\\n\\n---\\n\\n# 46. 推荐最终章节结构\\n\\n综合前面所有规则，一章源码阅读文档的推荐结构是：\\n\\n```text\\n# 章节标题\\n\\n\u003e Core Question：本章解决什么问题？\\n\\n## 一句话模型\\n\\n一句话\\n+\\nPrimary View\\n\\n## 1. 核心对象\\n\\nEntity Cards\\n+\\n必要的关系图/表\\n\\n## 2. 核心行为\\n\\nFlow / Data Path / Sequence\\n\\n## 3. 关键状态\\n\\nState / Lifecycle\\n（如果存在）\\n\\n## 4. 并发与约束\\n\\nConcurrency / Invariant\\n（如果存在）\\n\\n## 5. 关键实现\\n\\n关键源码片段\\n+\\n语义解释\\n\\n## 6. 源码导读\\n\\nSymbol\\n→ Source Anchor\\n→ 下一跳\\n\\n## 7. 关键结论\\n\\n事实 / 推导 / 约束\\n\\n## 8. 下一步阅读\\n\\n推荐继续阅读的 Symbol / Chapter\\n```\\n\\n注意：\\n\\n\u003e **章节顺序可以根据 Dominant Pattern 改变。**\\n\\n不是每篇都必须严格按这个顺序。\\n\\n---\\n\\n# 47. 不同 Pattern 的文档骨架\\n\\n## Structural\\n\\n```text\\nContext\\n↓\\n核心对象\\n↓\\n关系图\\n↓\\n管理关系\\n↓\\n关键字段\\n↓\\n源码导读\\n```\\n\\n---\\n\\n## Lifecycle\\n\\n```text\\nContext\\n↓\\n对象\\n↓\\nLifecycle\\n↓\\nOwnership\\n↓\\n关键状态\\n↓\\n创建/释放源码\\n```\\n\\n---\\n\\n## Flow\\n\\n```text\\nContext\\n↓\\nTrigger\\n↓\\nPrimary Flow\\n↓\\n关键分支\\n↓\\n异常路径\\n↓\\n源码导读\\n```\\n\\n---\\n\\n## State\\n\\n```text\\nContext\\n↓\\n状态模型\\n↓\\nState Transition\\n↓\\n字段表示\\n↓\\n转换条件\\n↓\\nInvariant\\n```\\n\\n---\\n\\n## Concurrency\\n\\n```text\\nContext\\n↓\\n参与者\\n↓\\n共享状态\\n↓\\nSynchronization View\\n↓\\nSequence\\n↓\\nLock / Atomic\\n↓\\nConcurrency Invariant\\n```\\n\\n---\\n\\n## Data Path\\n\\n```text\\nInput\\n↓\\nData Path\\n↓\\n转换\\n↓\\nOwnership / Copy\\n↓\\nStorage / Output\\n↓\\n源码落点\\n```\\n\\n---\\n\\n## Resource\\n\\n```text\\nResource\\n↓\\nManagement Structure\\n↓\\nLookup\\n↓\\nAllocation\\n↓\\nReuse / Eviction\\n↓\\nConcurrency\\n↓\\nPolicy\\n```\\n\\n---\\n\\n## Recovery\\n\\n```text\\nNormal Path\\n↓\\nFailure\\n↓\\nPartial State\\n↓\\nCleanup\\n↓\\nRollback / Retry / Recover\\n↓\\nInvariant\\n```\\n\\n---\\n\\n## Architecture\\n\\n```text\\nSystem Context\\n↓\\nSubsystem Position\\n↓\\nBoundary\\n↓\\nInterface\\n↓\\nDependency\\n↓\\nCross-module Trace\\n```\\n\\n---\\n\\n# 48. 文档生成的选择逻辑\\n\\n最终 Document Generator 可以采用：\\n\\n```text\\nInput\\n ↓\\n确定 Core Question\\n ↓\\n读取 Pattern Profile\\n ↓\\n加载 Representation Plan\\n ↓\\n构造章节骨架\\n ↓\\n填充 Claims\\n ↓\\n插入 Primary View\\n ↓\\n插入 Secondary Views\\n ↓\\n插入 Source Anchors\\n ↓\\n插入必要源码片段\\n ↓\\n生成导航\\n ↓\\n执行 Quality Check\\n```\\n\\n---\\n\\n# 49. Quality Check\\n\\n生成后不能直接输出。\\n\\n至少检查：\\n\\n```text\\n[ ] 核心问题是否明确？\\n[ ] 是否有一句话模型？\\n[ ] 是否存在不必要的图？\\n[ ] Primary View 是否明确？\\n[ ] 图是否与源码事实一致？\\n[ ] 图与文字是否重复？\\n[ ] 关键 Claim 是否有 Evidence？\\n[ ] FACT / INFERENCE 是否混淆？\\n[ ] 源码名称是否可以直接 grep？\\n[ ] 是否存在 Source Navigation？\\n[ ] 是否说明了关键状态/生命周期？\\n[ ] 是否说明了关键并发约束？\\n[ ] 是否存在无证据的设计动机？\\n[ ] 是否展开了与问题无关的源码？\\n[ ] 是否告诉读者下一步读什么？\\n```\\n\\n---\\n\\n# 50. 文档质量的四个维度\\n\\n最终可以定义四个评价维度：\\n\\n```text\\nAccuracy\\nTraceability\\nComprehensibility\\nNavigation\\n```\\n\\n### Accuracy\\n\\n知识是否正确？\\n\\n### Traceability\\n\\n能否回到源码？\\n\\n### Comprehensibility\\n\\n读者是否能形成 Mental Model？\\n\\n### Navigation\\n\\n读者能否继续读源码？\\n\\n一个“看起来漂亮”的文档，如果 Navigation 为 0，也不是好的源码阅读文档。\\n\\n---\\n\\n# 51. 一个重要原则：文档不是最终知识源\\n\\n最终知识源仍然是：\\n\\n```text\\nSource Code\\n```\\n\\n文档只是：\\n\\n```text\\nKnowledge Projection\\n```\\n\\n即：\\n\\n```text\\nSource\\n ↓\\nKnowledge Graph\\n ↓\\nDocument View\\n```\\n\\n因此不要追求：\\n\\n\u003e “把所有源码信息都塞进文档。”\\n\\n应该追求：\\n\\n\u003e **为特定理解问题生成一份最小充分的知识视图。**\\n\\n---\\n\\n# 52. 最终文档生成模型\\n\\n到这里，整个五步体系已经可以连接：\\n\\n```text\\n                    SOURCE\\n                       │\\n                       ▼\\n             ┌──────────────────┐\\n             │ Knowledge Model  │\\n             └────────┬─────────┘\\n                      │\\n                      ▼\\n             ┌──────────────────┐\\n             │ Pattern Profile  │\\n             └────────┬─────────┘\\n                      │\\n                      ▼\\n             ┌──────────────────┐\\n             │Representation    │\\n             │     Plan         │\\n             └────────┬─────────┘\\n                      │\\n                      ▼\\n             ┌──────────────────┐\\n             │ Source Trace     │\\n             └────────┬─────────┘\\n                      │\\n                      ▼\\n             ┌──────────────────┐\\n             │ Document         │\\n             │ Generation       │\\n             └────────┬─────────┘\\n                      │\\n          ┌───────────┼────────────┐\\n          ▼           ▼            ▼\\n        Text         Graph       Code\\n          │           │            │\\n          └───────────┼────────────┘\\n                      ▼\\n                Reader Mental Model\\n                      │\\n                      ▼\\n                Back to Source\\n```\\n\\n---\\n\\n# 53. Step 5 的核心产物\\n\\nStep 5 最终不是一个 Markdown 模板，而是一个：\\n\\n```text\\nDocument Generation Policy\\n```\\n\\n其中至少包含：\\n\\n```text\\nDocument Structure\\n+\\nSection Selection\\n+\\nView Placement\\n+\\nSource Placement\\n+\\nDepth Control\\n+\\nNavigation\\n+\\nCross-reference\\n+\\nQuality Check\\n```\\n\\n---\\n\\n# 54. 最终原则\\n\\n整个 Step 5 可以浓缩成：\\n\\n\u003e **文档不是把源码重新讲一遍，而是把源码中的知识模型压缩成一个可理解、可验证、可导航的视图。**\\n\\n优秀的源码阅读文档应该让读者经历：\\n\\n```text\\n第一次读：\\n    “我知道这是什么。”\\n\\n第二次读：\\n    “我知道它为什么这样组织。”\\n\\n第三次读：\\n    “我知道运行时怎么走。”\\n\\n深入阅读：\\n    “我知道该打开哪个函数、哪个字段、哪个分支。”\\n\\n最终：\\n    “我可以自己沿着源码继续研究。”\\n```\\n\\n这应该成为源码阅读 Skill 的最终文档目标。\\n:::\\n\\n到这里，**Step 1～5 已经形成完整闭环**：\\n\\n```text\\n① Knowledge Model\\n   我们要认识哪些知识？\\n\\n        ↓\\n\\n② Pattern Recognition\\n   这段源码主要是什么类型的问题？\\n\\n        ↓\\n\\n③ Representation\\n   什么形式最适合表达这个问题？\\n\\n        ↓\\n\\n④ Traceability\\n   这个结论如何回到真实源码？\\n\\n        ↓\\n\\n⑤ Document Generation\\n   如何组装成一份可读、可验证、可继续导航的文档？\\n```\\n\\n而这时候再做 **Step 6：把整个体系固化为 Agent Skill** 就非常合适了。\\n\\n我尤其建议 Step 6 **不要直接写一大段 Prompt**。更合理的是把 Skill 架成：\\n\\n```text\\n                    Source Reading Skill\\n                           │\\n        ┌──────────────────┼──────────────────┐\\n        ↓                  ↓                  ↓\\n   Analysis Engine    Knowledge Model    Document Engine\\n        │                  │                  │\\n   Pattern Detect      Entity/Relation     Renderer\\n   Context Expand      Flow/State          Mermaid\\n   Trace Engine        Lifecycle           Markdown\\n   Claim Checker       Constraint          Code\\n        │                  │                  │\\n        └──────────────────┼──────────────────┘\\n                           ↓\\n                    Quality / Validation\\n```\\n\\n也就是说，**Step 6 的任务应该是把这五份规范转化成 Skill 的“执行架构 + Agent 工作流 + 中间数据结构 + 各阶段职责 + 强制检查点”**，而不是简单地让一个 Agent“按照本文要求写笔记”。\",{},{\"_168\":1144,\"_175\":1451,\"_54\":1452,\"_56\":1452,\"_179\":1453,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":1454,\"_188\":189},\"3f25e0e0-2057-4e84-ad53-117a9b56cbb7\",[1130],{\"_250\":251,\"_186\":1460},1789653622.3
