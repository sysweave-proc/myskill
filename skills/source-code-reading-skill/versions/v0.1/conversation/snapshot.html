8\":2646,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2645,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2644,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2643,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2642,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2641,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2640,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2639,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2638,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2637,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2636,\"_235\":14,\"_236\":14,\"_237\":-5},\"s2z7ip\",\"2klqus\",\"0vm7ok\",\"9x7uz9\",\"9k3trg\",\"8dk5lj\",\"1qekd0\",\"no4el2\",\"lizadx\",\"pw5kuh\",\"1n99dq\",\"oh29i7\",\"fqk2u0\",\"f0u6br\",\"t53q14\",\"diwey5\",\"j0rn6r\",\"d3p78b\",\"9ka18a\",\"hlng0d\",\"7np0bu\",\"o4r4nd\",\"4vc2kl\",\"fg99ew\",\"0ps97l\",\"stys2h\",\"yditop\",\"p1479v\",\"f8gup4\",\"kv0sfs\",\"a25lyk\",\"s0onzp\",\"xq6dl4\",\"ze53b3\",\"se9qnn\",\"tjuz9b\",\"uq7kkr\",\"fpwn1c\",\"8qqch8\",\"jbxju3\",\"twkx6y\",\"zain47\",\"1ncyi1\",\"ob1cgx\",\"wdhtj4\",\"hpjl0h\",\"quosh6\",\"at1dl6\",\"qoa84n\",\"w6qyco\",\"vyu9c9\",\"gu9ko9\",\"yj8abk\",\"jvvp16\",\"wfw8h9\",\"qrauh6\",\"6mrk80\",\"zsepz2\",\"t4jvuo\",\"uw7rmz\",\"imsd6k\",\"ak4uci\",\"1nwn44\",\"m89wki\",\"768cho\",\"fy7j7m\",\"kf49pk\",\"i7f0ik\",\"8sn66f\",\"4qg5qb\",\"qk6hzu\",\"basktu\",\"0ocihx\",[244],[2711],\"下面把 **Step 1：大型 C/C++ 项目源码知识模型（Source Code Knowledge Model）** 定义成一个可以直接拿去约束 Agent 的 **v0.1 规范**。\\n\\n核心思想先定下来：\\n\\n\u003e **Agent 的任务不是“总结代码”，而是把源码中的事实、结构、行为、约束和运行时语义，抽取成一个可关联、可追踪的知识模型。**\\n\\n:::writing{variant=\\\"document\\\" id=\\\"58321\\\" title=\\\"大型 C/C++ 项目源码知识模型规范 v0.1\\\"}\\n# 大型 C/C++ 项目源码知识模型规范 v0.1\\n\\n## 1. 目标\\n\\n本规范定义 Agent 在阅读大型 C/C++ 项目源码时需要提取的最小知识单元，以及这些知识单元之间的关系。\\n\\n目标不是生成漂亮的 Markdown，而是建立一个中间层：\\n\\n```text\\n源码\\n  ↓\\n源码事实\\n  ↓\\n知识模型\\n  ↓\\n模式识别\\n  ↓\\n表达方式\\n  ↓\\n源码阅读文档\\n```\\n\\n因此，**知识模型独立于最终文档形式**。\\n\\n同一份知识模型可以生成：\\n\\n- 结构体关系图\\n- 调用流程图\\n- 生命周期图\\n- 状态机\\n- 时序图\\n- 并发/锁关系图\\n- 普通文字说明\\n- 源码导读\\n- 对比表格\\n\\n---\\n\\n# 2. 知识模型的总体结构\\n\\n源码知识划分为六大类：\\n\\n```text\\n                    Source Code Knowledge\\n                            │\\n       ┌────────────────────┼────────────────────┐\\n       │                    │                    │\\n     Entity               Relation            Behavior\\n       │                    │                    │\\n       │                    │              ┌─────┴─────┐\\n       │                    │              │           │\\n       │                 State          Flow       Lifecycle\\n       │\\n       └────────────────────┬────────────────────┘\\n                            │\\n                     Constraint\\n                            │\\n                 ┌──────────┴──────────┐\\n                 │                     │\\n             Invariant             Concurrency\\n```\\n\\n同时所有知识都必须带有：\\n\\n```text\\nEvidence / Source Anchor\\n```\\n\\n即：\\n\\n\u003e **这个知识是从源码哪里来的？**\\n\\n---\\n\\n# 3. 第一层：Entity（实体）\\n\\nEntity 是源码或运行时世界中可以被单独讨论的“对象”。\\n\\n## 3.1 Source Entity\\n\\n直接对应源码中的实体：\\n\\n```text\\nFile\\nDirectory\\nModule\\nNamespace\\nFunction\\nMacro\\nStruct\\nClass\\nEnum\\nUnion\\nTypedef\\nGlobal Variable\\nStatic Variable\\nField\\nConstant\\n```\\n\\n例如 PostgreSQL：\\n\\n```text\\nsrc/backend/storage/buffer/bufmgr.c\\nReadBuffer()\\nBufferDesc\\nRelationData\\nBufferTag\\n```\\n\\n---\\n\\n## 3.2 Runtime Entity\\n\\n源码实体对应的运行时对象。\\n\\n```text\\nProcess\\nThread\\nCoroutine\\nTask\\nConnection\\nTransaction\\nBuffer\\nPage\\nCache Entry\\nLock\\nRequest\\nIO Operation\\nMemory Context\\nSession\\n```\\n\\n例如：\\n\\n```text\\nBufferDesc          ← 源码定义\\n    ↓\\nBuffer              ← 运行时概念\\n    ↓\\n某个具体 shared buffer slot\\n```\\n\\n两者不要混为一谈。\\n\\n---\\n\\n## 3.3 Resource Entity\\n\\n需要管理、申请、释放或竞争的资源。\\n\\n```text\\nMemory\\nCPU\\nFile Descriptor\\nDisk Page\\nBuffer\\nLock\\nSemaphore\\nSocket\\nConnection\\nIO Queue\\nShared Memory\\nNUMA Node\\n```\\n\\n---\\n\\n## 3.4 Subsystem Entity\\n\\n大型项目中必须允许 Agent 把多个源码实体提升成“子系统”。\\n\\n例如：\\n\\n```text\\nLock Manager\\nBuffer Manager\\nWAL\\nMemory Context\\nExecutor\\nStorage Manager\\nIPC Layer\\nScheduler\\n```\\n\\nSubsystem 不是源码中的某个 struct，而是**架构层实体**。\\n\\n---\\n\\n# 4. Entity 的标准属性\\n\\n每一个重要 Entity 至少应该记录：\\n\\n```text\\nname\\nkind\\nrole\\ndefinition\\nlocation\\nowner/subsystem\\nlifetime\\nvisibility\\nimportant_fields\\nimportant_methods/functions\\n```\\n\\n例如：\\n\\n```text\\nEntity:\\n    name: BufferDesc\\n    kind: struct\\n    subsystem: Buffer Manager\\n\\n    role:\\n        描述一个 shared buffer 对应的元数据\\n\\n    location:\\n        src/include/storage/buf_internals.h\\n\\n    important_fields:\\n        - state\\n        - tag\\n        - content_lock\\n```\\n\\n---\\n\\n# 5. 第二层：Relation（关系）\\n\\nRelation 用来描述：\\n\\n\u003e **两个 Entity 为什么有关，以及具体是什么关系。**\\n\\n不能只使用一个模糊的“关联”。\\n\\n---\\n\\n## 5.1 Structural Relation\\n\\n描述静态结构。\\n\\n```text\\ncontains\\nembeds\\nowns\\nreferences\\npoints_to\\ninherits\\nimplements\\naliases\\n```\\n\\n例如：\\n\\n```text\\nTupleTableSlot\\n    └── tts_tuple\\n            └── points_to\\n                    ↓\\n                HeapTuple\\n```\\n\\n---\\n\\n## 5.2 Management Relation\\n\\n描述管理关系。\\n\\n```text\\nmanages\\nallocates\\nowns\\nindexes\\nregisters\\ntracks\\ncaches\\nqueues\\ndispatches\\n```\\n\\n例如：\\n\\n```text\\nBufferDesc\\n    ← managed by ←\\nBuffer Manager\\n```\\n\\n---\\n\\n## 5.3 Dependency Relation\\n\\n描述依赖。\\n\\n```text\\ncalls\\nuses\\ndepends_on\\nrequires\\ninvokes\\naccesses\\nmodifies\\n```\\n\\n例如：\\n\\n```text\\nReadBuffer()\\n    → calls → ReadBuffer_common()\\n```\\n\\n---\\n\\n## 5.4 Runtime Relation\\n\\n描述运行时关系。\\n\\n```text\\nproducer → consumer\\nrequest → handler\\nbuffer → page\\ntransaction → lock\\nthread → task\\nprocess → shared memory\\n```\\n\\n---\\n\\n## 5.5 Concurrency Relation\\n\\n专门描述并发。\\n\\n```text\\nprotects\\nsynchronized_by\\nwaits_for\\ncompetes_for\\nowns_lock\\nreleases_lock\\natomic_update_of\\n```\\n\\n例如：\\n\\n```text\\nLWLock\\n   └── protects\\n           ↓\\n       shared hash table\\n```\\n\\n---\\n\\n# 6. Relation 必须描述“关系的语义”\\n\\n不要只生成：\\n\\n```text\\nA → B\\n```\\n\\n至少要能够回答：\\n\\n```text\\nA 与 B 什么关系？\\n谁持有谁？\\n谁修改谁？\\n谁保护谁？\\n关系发生在什么时候？\\n是否有条件？\\n```\\n\\n因此 Relation 推荐抽象成：\\n\\n```text\\nRelation {\\n    subject\\n    predicate\\n    object\\n\\n    condition\\n    direction\\n    scope\\n\\n    evidence\\n}\\n```\\n\\n例如：\\n\\n```text\\nBufferDesc\\n    --content_lock protects--\u003e\\nbuffer page contents\\n\\ncondition:\\n    访问 page 内容时\\n\\nevidence:\\n    LockBuffer()\\n```\\n\\n---\\n\\n# 7. 第三层：Behavior（行为）\\n\\nEntity + Relation 仍然不足以理解大型 C/C++ 系统。\\n\\n因为很多知识描述的是：\\n\\n\u003e **系统在运行时做了什么。**\\n\\nBehavior 分成三类：\\n\\n```text\\nFlow\\nState\\nLifecycle\\n```\\n\\n---\\n\\n# 8. Flow（流程）\\n\\nFlow 描述：\\n\\n\u003e **一个事件是如何一步一步发生的。**\\n\\n典型形式：\\n\\n```text\\nEntry\\n  ↓\\nCheck\\n  ↓\\nLookup\\n  ↓\\nFast Path\\n  ↓\\nFallback\\n  ↓\\nModify\\n  ↓\\nReturn\\n```\\n\\nFlow 的基本模型：\\n\\n```text\\nFlow {\\n    trigger\\n    entry\\n    steps[]\\n    branch_conditions\\n    exit\\n    side_effects\\n    error_paths\\n}\\n```\\n\\n---\\n\\n## 8.1 Flow 必须保留分支\\n\\n不要把真实源码：\\n\\n```c\\nif (fast_path)\\n    ...\\nelse\\n    ...\\n```\\n\\n压缩成：\\n\\n```text\\n函数执行 → 完成\\n```\\n\\n而应该保留：\\n\\n```text\\n                ┌─ fast path ───────→ success\\n                │\\nentry → check ──┤\\n                │\\n                └─ fallback ────────→ main path\\n```\\n\\n因为**分支往往就是系统设计本身**。\\n\\n---\\n\\n# 9. State（状态）\\n\\nState 描述：\\n\\n\u003e **同一个 Entity 在不同阶段有什么不同语义。**\\n\\n例如：\\n\\n```text\\nUNINITIALIZED\\n      ↓\\nINITIALIZED\\n      ↓\\nACTIVE\\n      ↓\\nWAITING\\n      ↓\\nCOMPLETED\\n      ↓\\nRELEASED\\n```\\n\\n状态模型：\\n\\n```text\\nStateMachine {\\n    entity\\n    states[]\\n    transitions[]\\n    transition_conditions\\n    state_invariants\\n}\\n```\\n\\n---\\n\\n## 9.1 State 不只是 enum\\n\\n大型 C/C++ 项目中很多状态并不存在显式 enum。\\n\\n可能通过：\\n\\n```text\\nbit flags\\nreference count\\npointer == NULL\\nlock ownership\\nlist membership\\natomic value\\nmultiple fields combination\\n```\\n\\n共同表示。\\n\\nAgent 必须识别这种**隐式状态机**。\\n\\n例如：\\n\\n```text\\nrefcount == 0\\n+ valid == false\\n+ free-list membership\\n```\\n\\n组合起来才意味着：\\n\\n```text\\nFREE\\n```\\n\\n---\\n\\n# 10. Lifecycle（生命周期）\\n\\nLifecycle 描述：\\n\\n\u003e **一个对象从创建到销毁经历了什么。**\\n\\n标准模型：\\n\\n```text\\ncreate\\n  ↓\\ninitialize\\n  ↓\\npublish\\n  ↓\\nuse\\n  ↓\\nmodify\\n  ↓\\ndetach\\n  ↓\\ndestroy\\n```\\n\\n生命周期特别适用于：\\n\\n```text\\nmemory object\\nconnection\\ntransaction\\nbuffer\\nlock\\nrequest\\nthread\\ncoroutine\\ncache entry\\n```\\n\\n---\\n\\n## 10.1 C/C++ 项目必须特别关注\\n\\n生命周期不能只看：\\n\\n```text\\nmalloc → free\\n```\\n\\n还必须关注：\\n\\n```text\\n谁分配\\n谁初始化\\n谁获得 ownership\\n是否转移 ownership\\n是否共享\\n谁最后释放\\n是否引用计数\\n是否 RCU\\n是否 deferred free\\n是否跨线程\\n是否跨进程\\n```\\n\\n---\\n\\n# 11. 第四层：Concurrency（并发语义）\\n\\n大型 C/C++ 项目必须把并发独立成一个一级知识类别。\\n\\n至少识别：\\n\\n```text\\nThread\\nProcess\\nCoroutine\\nCPU\\nNUMA Node\\nShared Memory\\n```\\n\\n以及：\\n\\n```text\\nMutex\\nRWLock\\nSpinlock\\nSemaphore\\nCondition Variable\\nAtomic\\nCAS\\nMemory Barrier\\nLock-free structure\\nRCU\\n```\\n\\n---\\n\\n## 11.1 并发知识必须回答四个问题\\n\\n```text\\n谁访问？\\n访问什么？\\n谁保护？\\n不保护会怎样？\\n```\\n\\n例如：\\n\\n```text\\nBackend A\\n      │\\n      │ modify\\n      ↓\\nshared state\\n      ↑\\n      │ protected by\\n      │\\n    LWLock\\n      ↑\\n      │\\nBackend B\\n```\\n\\n---\\n\\n## 11.2 锁不只是“存在一个锁”\\n\\n必须尽可能建立：\\n\\n```text\\nLock\\n    ├── protects → Object / Field\\n    ├── acquired by → Function\\n    ├── released by → Function\\n    ├── mode → shared/exclusive\\n    ├── scope → local/global\\n    └── contention / wait relation\\n```\\n\\n否则很容易形成“看过代码但没理解并发模型”的假知识。\\n\\n---\\n\\n# 12. 第五层：Constraint（约束）\\n\\n这是知识模型中最重要、也最容易遗漏的一层。\\n\\n源码真正表达的是：\\n\\n\u003e **系统必须满足哪些规则。**\\n\\nConstraint 分为：\\n\\n```text\\nPrecondition\\nPostcondition\\nInvariant\\nOwnership Rule\\nOrdering Rule\\nConcurrency Rule\\nError Rule\\n```\\n\\n---\\n\\n# 13. Invariant（不变量）\\n\\nInvariant：\\n\\n\u003e 在某个有效范围内，始终必须成立的事实。\\n\\n例如：\\n\\n```text\\nHash table 中存在 entry\\n    ⇔\\n存在对应的管理对象\\n```\\n\\n或者：\\n\\n```text\\nrefcount \u003e 0\\n    ⇒\\nobject 不能被释放\\n```\\n\\n或者：\\n\\n```text\\n持有某锁\\n    ⇒\\n允许访问某共享字段\\n```\\n\\n---\\n\\n## 13.1 Invariant 是知识模型中的“解释核心”\\n\\n一个好的源码笔记不能只是：\\n\\n```text\\n函数 A 调用了函数 B\\n```\\n\\n还应该能提炼：\\n\\n```text\\n为什么 A 必须调用 B？\\n为什么这个字段一定在这个时间点修改？\\n为什么这里必须先加锁？\\n为什么这个对象不能提前释放？\\n```\\n\\n这些答案往往就是 Invariant。\\n\\n---\\n\\n# 14. Error Semantics（错误语义）\\n\\n这一类建议从 Constraint 中单独标出来。\\n\\n大型 C/C++ 项目里：\\n\\n```text\\nNULL\\nfalse\\n-1\\nerrno\\nErrorCode\\ngoto cleanup\\nexception\\nassert\\nabort\\nPANIC\\nretry\\nrollback\\n```\\n\\n都具有架构意义。\\n\\n需要识别：\\n\\n```text\\nError Condition\\n    ↓\\nDetection\\n    ↓\\nPropagation\\n    ↓\\nCleanup\\n    ↓\\nRecovery / Abort\\n```\\n\\n尤其要关注：\\n\\n\u003e **失败之后哪些状态已经改变，哪些状态必须回滚。**\\n\\n---\\n\\n# 15. 第六层：Evidence / Traceability（源码证据）\\n\\n这是整个模型必须强制加入的一层。\\n\\n任何重要知识都应该能够追溯：\\n\\n```text\\nKnowledge\\n    ↓\\nSource Evidence\\n    ↓\\nfile\\nfunction\\nline/range\\nstruct field\\nmacro\\ncall site\\n```\\n\\n例如：\\n\\n```text\\nKnowledge:\\n    BufferDesc.state 表示 buffer 的原子状态\\n\\nEvidence:\\n    src/include/storage/buf_internals.h\\n    BufferDesc\\n    state\\n\\nSupporting code:\\n    LockBufHdr()\\n    UnlockBufHdr()\\n    BUF_STATE_GET_REFCOUNT()\\n```\\n\\n---\\n\\n## 15.1 知识必须区分三种层次\\n\\n### FACT\\n\\n源码可以直接证明。\\n\\n```text\\nReadBuffer() calls ReadBuffer_common()\\n```\\n\\n### INFERENCE\\n\\n根据多个源码事实推导出来。\\n\\n```text\\n该路径是为了避免进入主锁表\\n```\\n\\n### INTERPRETATION\\n\\n对设计目的的解释。\\n\\n```text\\n设计意图可能是降低高频共享锁竞争\\n```\\n\\n三者不能混写。\\n\\n应该显式标记：\\n\\n```text\\nFACT\\nINFERENCE\\nINTERPRETATION\\n```\\n\\n这会成为未来 Agent 防止“源码幻觉”的重要机制。\\n\\n---\\n\\n# 16. Knowledge Atom：最小知识单元\\n\\n最终，以上所有东西都可以落到一个统一的知识单元：\\n\\n```text\\nKnowledgeAtom {\\n\\n    subject\\n    predicate\\n    object\\n\\n    type\\n    scope\\n    condition\\n\\n    source_evidence\\n\\n    certainty\\n}\\n```\\n\\n例如：\\n\\n```text\\nsubject:\\n    BufferDesc.state\\n\\npredicate:\\n    protects_represents\\n\\nobject:\\n    buffer lifecycle / pin state\\n\\ntype:\\n    FACT\\n\\nsource_evidence:\\n    buf_internals.h\\n    bufmgr.c\\n\\ncertainty:\\n    high\\n```\\n\\n再例如：\\n\\n```text\\nsubject:\\n    content_lock\\n\\npredicate:\\n    protects\\n\\nobject:\\n    page content\\n\\ntype:\\n    FACT\\n\\ncondition:\\n    buffer content access\\n\\nevidence:\\n    LockBuffer()\\n    ReadBuffer()\\n```\\n\\n---\\n\\n# 17. 最终的知识图谱\\n\\n这样，一个大型 C/C++ 项目的知识就可以抽象成：\\n\\n```text\\n                         ┌──────────────┐\\n                         │   Subsystem  │\\n                         └──────┬───────┘\\n                                │\\n                 manages / owns / contains\\n                                │\\n                     ┌──────────▼─────────┐\\n                     │      Entity        │\\n                     └──────────┬─────────┘\\n                                │\\n               ┌────────────────┼────────────────┐\\n               │                │                │\\n               ▼                ▼                ▼\\n           Relation          State          Lifecycle\\n               │                │                │\\n               └────────────────┼────────────────┘\\n                                │\\n                              Flow\\n                                │\\n                                ▼\\n                          Concurrency\\n                                │\\n                                ▼\\n                           Constraint\\n                                │\\n                                ▼\\n                            Evidence\\n```\\n\\n这就是以后 Agent 应该构建的**中间知识表示**。\\n\\n---\\n\\n# 18. 对 Agent 的强制要求\\n\\nAgent 阅读源码时，不应直接开始写文档。\\n\\n必须先尝试识别：\\n\\n```text\\n[1] Entity\\n[2] Relation\\n[3] Flow\\n[4] State\\n[5] Lifecycle\\n[6] Concurrency\\n[7] Constraint\\n[8] Evidence\\n```\\n\\n并根据源码实际情况决定哪些类别存在。\\n\\n不能为了“格式完整”而虚构不存在的知识。\\n\\n例如一个简单工具函数可能只有：\\n\\n```text\\nEntity\\nRelation\\nFlow\\nEvidence\\n```\\n\\n而一个数据库 Buffer Manager 章节可能同时具有：\\n\\n```text\\nEntity\\nRelation\\nFlow\\nState\\nLifecycle\\nConcurrency\\nConstraint\\nEvidence\\n```\\n\\n---\\n\\n# 19. 一个非常重要的原则：不要让“函数”成为唯一组织单位\\n\\n传统源码阅读容易变成：\\n\\n```text\\n函数 A\\n函数 B\\n函数 C\\n函数 D\\n```\\n\\n这更接近代码索引，而不是知识模型。\\n\\n应该允许从不同维度观察同一份源码：\\n\\n```text\\n                    同一组源码\\n                        │\\n       ┌────────────────┼────────────────┐\\n       ↓                ↓                ↓\\n    Entity View      Flow View       Concurrency View\\n       │                │                │\\n       ↓                ↓                ↓\\n   对象如何组织      事情如何发生      谁和谁竞争\\n```\\n\\n因此：\\n\\n\u003e **函数只是 Evidence 和 Flow 的载体，不应该成为知识模型的最高层。**\\n\\n---\\n\\n# 20. Step 1 的最终产物\\n\\nStep 1 完成以后，我们应该得到一个稳定的中间模型：\\n\\n```text\\nSourceCodeKnowledge\\n│\\n├── Entity\\n│   ├── SourceEntity\\n│   ├── RuntimeEntity\\n│   ├── Resource\\n│   └── Subsystem\\n│\\n├── Relation\\n│   ├── Structural\\n│   ├── Management\\n│   ├── Dependency\\n│   ├── Runtime\\n│   └── Concurrency\\n│\\n├── Behavior\\n│   ├── Flow\\n│   ├── State\\n│   └── Lifecycle\\n│\\n├── Constraint\\n│   ├── Precondition\\n│   ├── Postcondition\\n│   ├── Invariant\\n│   ├── OwnershipRule\\n│   ├── OrderingRule\\n│   ├── ConcurrencyRule\\n│   └── ErrorRule\\n│\\n└── Evidence\\n    ├── File\\n    ├── Symbol\\n    ├── Field\\n    ├── CallSite\\n    └── CodeRange\\n```\\n\\n同时每条知识都要能够标注：\\n\\n```text\\nFACT\\nINFERENCE\\nINTERPRETATION\\n```\\n\\n以及对应源码证据。\\n\\n---\\n\\n# 21. 目前先不要做的事情\\n\\n在这个阶段暂时不要定义：\\n\\n```text\\nMarkdown 模板\\nMermaid 模板\\n章节标题\\n图的样式\\n文档目录\\nSkill Prompt\\n```\\n\\n因为这些属于后面的：\\n\\n```text\\nKnowledge Model\\n      ↓\\nPattern\\n      ↓\\nRepresentation\\n      ↓\\nDocument\\n```\\n\\n如果现在先定义 Markdown，很容易反过来让“文档形式”绑架“知识模型”。\\n\\n---\\n\\n# 22. Step 1 的验收标准\\n\\n一个知识模型是否合格，可以拿一个真实复杂模块测试：\\n\\n\u003e Agent 是否能够仅通过这个模型回答：\\n\\n```text\\n有哪些核心对象？\\n对象之间如何管理？\\n谁指向谁？\\n谁拥有谁？\\n对象如何创建和释放？\\n一次操作经过哪些步骤？\\n有哪些分支？\\n对象有哪些状态？\\n什么状态由哪些字段表示？\\n谁和谁并发访问？\\n什么锁保护什么？\\n什么时候可以修改？\\n什么条件必须始终成立？\\n出错之后发生什么？\\n每个结论能否追溯到源码？\\n哪些是源码事实，哪些是推导？\\n```\\n\\n如果这些问题都能落到模型里，那么 Step 1 基本成立。\\n:::\\n\\n我认为这里已经暴露出一个对后续 Skill **非常关键的设计点**：\\n\\n**知识模型本身应该是“图结构 + 行为语义 + 证据链”，而不是一堆固定栏目。**\\n\\n这样下一步 Step 2 就不应该简单地列“十几个 Markdown 模板”，而应该做成：\\n\\n```text\\n源码知识\\n   ↓\\n识别主导模式\\n   ↓\\nEntity-centric？\\nFlow-centric？\\nState-centric？\\nConcurrency-centric？\\nLifecycle-centric？\\nConstraint-centric？\\n   ↓\\n选择表达策略\\n```\\n\\n比如 `TupleTableSlot` 偏 **Entity + Relation + Lifecycle**，`Lock Manager` 偏 **Entity + Flow + State + Concurrency**，`Buffer Manager` 则可能是 **Entity + Relation + State + Concurrency + Invariant**。\\n\\n**下一步最值得做的就是 Step 2：建立“源码知识模式（Knowledge Pattern）分类体系”，并确定 Agent 如何从源码中自动识别这些模式。**\",{},{\"_168\":2546,\"_175\":2716,\"_54\":2717,\"_56\":2717,\"_179\":2718,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":2719,\"_188\":189},\"2a86b748-0b3a-491e-9ff2-e6732c432c58\",[2532],{\"_250\":251,\"_186\":2724},1789653330.411326,{\"_245\":272,\"_179\":2144},{\"_260\":261,\"_262\":2139,\"_264\":2720,\"_266\":2721,\"_268\":269,\"_207\":208,\"_209\":34,\"_210\":2559,\"_212\":213,\"_214\":2560,\"_216\":2560,\"_201\":202,\"_217\":202,\"_66\":67,\"_218\":2722,\"_220\":14,\"_221\":2723,\"_222\":2562,\"_271\":34,\"_224\":10},1789653325.4041047,1789653330.407989,[225],\"5a7562ba-1f45-4219-a908-2470710034fb\",{},{\"_168\":2714,\"_175\":2728,\"_54\":2729,\"_56\":2730,\"_179\":2731,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":2732,\"_188\":189,\"_190\":1086},\"5e0d10a0-1b1f-4d36-82c4-87645b7f9b4e\",[2546],{\"_250\":251,\"_186\":2739},1789653326.661294,1789653326.866386,{\"_245\":246,\"_247\":2737},{\"_195\":2733,\"_199\":2734,\"_201\":202,\"_1089\":34,\"_271\":34,\"_336\":34,\"_337\":185,\"_289\":290,\"_264\":2720,\"_207\":208,\"_ _199\":2786,\"_201\":202,\"_203\":2787,\"_205\":2788,\"_207\":208,\"_209\":34,\"_210\":2789,\"_212\":213,\"_214\":2790,\"_216\":2790,\"_217\":202,\"_66\":67,\"_218\":2791,\"_220\":34,\"_221\":2776,\"_222\":2792,\"_224\":10},{\"_50\":241,\"_242\":2837},[],[],[],{\"_226\":2793,\"_228\":2794,\"_230\":2795,\"_232\":2796,\"_466\":2797,\"_468\":2798,\"_470\":2799,\"_472\":2800,\"_474\":2801,\"_476\":2802,\"_478\":2803,\"_480\":2804,\"_482\":2805,\"_484\":2806,\"_486\":2807,\"_488\":2808,\"_490\":2809,\"_492\":2810,\"_494\":2811,\"_496\":2812,\"_498\":2813,\"_500\":2814},[],\"561b5dee-2a7d-4bd0-bbe6-47d874fc9dfd\",\"8f698112-a5cd-478f-b6a4-aa66ff35f524\",[225],\"9f4bda63-2b8a-4198-a004-d04bdbbfc9f0\",{\"_168\":2836,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2835,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2834,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2833,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2832,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2831,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2830,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2829,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2828,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2827,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2826,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2825,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2824,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2823,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2822,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2821,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2820,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2819,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2818,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2817,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2816,\"_235\":14,\"_236\":14,\"_237\":-5},{\"_168\":2815,\"_235\":14,\"_236\":14,\"_237\":-5},\"205o01\",\"lbke3j\",\"8xpmja\",\"dpuwdd\",\"7flfxm\",\"vxoev4\",\"nq0gxo\",\"1mt6l1\",\"ye7rtr\",\"5s0xy2\",\"vkjdru\",\"k5w7d3\",\"zmeo24\",\"ax23i2\",\"v0ovn2\",\"mjp3h6\",\"jn4ykr\",\"yupm5z\",\"pm56mp\",\"u8f7gq\",\"ghgbco\",\"5i8nzy\",[244],[2839],\"我认为**第一步不是写 Skill，也不是先设计 Markdown 模板**，而是先把“源码阅读到底要建模什么”定义清楚。\\n\\n因为最终这个 Skill 的核心不是“让 Agent 写得更漂亮”，而是：\\n\\n\u003e **从大型 C/C++ 源码中识别出不同类型的知识对象及其关系，并用适合这种知识的表达方式生成稳定、可追踪、可持续更新的知识。**\\n\\n所以第一阶段应该先建立一套**源码知识模型（Source Code Knowledge Model）**。\\n\\n### 我建议整个设计分成 5 层\\n\\n```text\\n┌──────────────────────────────────────────────┐\\n│ ⑤ 文档生成                                   │\\n│    Markdown / Mermaid / 表格 / 源码片段       │\\n├──────────────────────────────────────────────┤\\n│ ④ 表达模式                                   │\\n│    实体图 / 流程图 / 生命周期 / 时序 / 对比   │\\n├──────────────────────────────────────────────┤\\n│ ③ 知识建模                                   │\\n│    Entity / Relation / Flow / State / Rule   │\\n├──────────────────────────────────────────────┤\\n│ ② 模式识别                                   │\\n│    管理关系？流程？状态机？并发？缓存？       │\\n├──────────────────────────────────────────────┤\\n│ ① 源码理解                                   │\\n│    文件 → 类型 → 函数 → 调用 → 数据结构      │\\n└──────────────────────────────────────────────┘\\n```\\n\\n我们现在应该先做 **③：知识建模**，然后反过来约束②和①。\\n\\n---\\n\\n# 第一件真正要做的事：定义“源码知识的基本元素”\\n\\n先不要考虑 PG、MySQL、Informix，也不要考虑 Markdown。\\n\\n我们先回答：\\n\\n\u003e **一个大型 C/C++ 项目里，一个人真正需要记住的知识，到底有哪些类型？**\\n\\n我初步认为至少有下面这些基本对象。\\n\\n### 1. Entity：实体\\n\\n源码里的“东西”。\\n\\n```text\\nstruct\\nclass\\nenum\\nglobal variable\\nobject\\nsubsystem\\nmodule\\nthread\\nmemory region\\nfile\\nresource\\n```\\n\\n例如 PG：\\n\\n```text\\nRelation\\nRelationData\\nTupleTableSlot\\nHeapTuple\\nBufferDesc\\nLOCALLOCK\\nPROCLOCK\\n```\\n\\n---\\n\\n### 2. Relation：关系\\n\\n描述两个实体之间的结构关系。\\n\\n例如：\\n\\n```text\\nTupleTableSlot\\n    └── tts_tuple\\n            ↓\\n        HeapTuple\\n```\\n\\n或者：\\n\\n```text\\nRelation\\n    └── rd_smgr\\n            ↓\\n        SMgrRelation\\n```\\n\\n它回答的是：\\n\\n\u003e **A 和 B 到底是什么关系？**\\n\\n这里应该进一步区分：\\n\\n```text\\nowns\\ncontains\\npoints-to\\nreferences\\ninherits\\nembeds\\nmanaged-by\\nassociated-with\\n```\\n\\n---\\n\\n### 3. Flow：流程\\n\\n描述“事情怎么发生”。\\n\\n例如：\\n\\n```text\\nLockAcquire\\n   ↓\\nLockAcquireExtended\\n   ↓\\nSetupLockInTable\\n   ↓\\nGrantLockLocal\\n```\\n\\n流程回答：\\n\\n\u003e **这件事情经过哪些步骤？**\\n\\n---\\n\\n### 4. State：状态\\n\\n很多大型 C/C++ 系统真正难的地方其实不是流程，而是：\\n\\n\u003e **同一个对象在不同状态下意味着什么。**\\n\\n例如：\\n\\n```text\\nBufferDesc\\n\\nFREE\\n ↓\\nVALID\\n ↓\\nPINNED\\n ↓\\nDIRTY\\n ↓\\nFLUSHING\\n```\\n\\n或者锁：\\n\\n```text\\nnot held\\n    ↓\\nfast-path\\n    ↓\\nmain lock table\\n    ↓\\nwaiting\\n    ↓\\ngranted\\n```\\n\\n---\\n\\n### 5. Ownership / Lifetime：生命周期\\n\\nC/C++ 项目中特别重要，而且经常被普通源码笔记遗漏。\\n\\n例如：\\n\\n```text\\n谁创建？\\n谁持有？\\n谁释放？\\n什么时候失效？\\n是否跨函数？\\n是否跨线程？\\n```\\n\\n比如：\\n\\n```text\\nTupleTableSlot\\n     │\\n     ├── 创建\\n     ├── 填充 tuple\\n     ├── executor 使用\\n     ├── 清空\\n     └── Release\\n```\\n\\n这其实是一种独立知识。\\n\\n---\\n\\n### 6. Concurrency：并发关系\\n\\n大型数据库 / OS / storage 项目尤其重要。\\n\\n例如：\\n\\n```text\\nCPU 0\\n  │\\nbackend\\n  │\\n  └── BufferDesc.state\\n\\nCPU 1\\n  │\\nbackend\\n  │\\n  └── BufferDesc.content_lock\\n```\\n\\n需要表达：\\n\\n```text\\nspinlock\\nmutex\\nrwlock\\natomic\\nCAS\\nmemory barrier\\ncondition variable\\nLWLock\\nRCU\\nthread ownership\\nCPU ownership\\n```\\n\\n以及：\\n\\n\u003e **为什么这个锁存在？保护的到底是哪块状态？**\\n\\n---\\n\\n### 7. Invariant：不变量\\n\\n这是我认为将来 Skill 最有价值的一类知识。\\n\\n例如：\\n\\n```text\\nBufTable 中存在 BufferTag\\n        ⇔\\n一定能找到对应 BufferDesc\\n```\\n\\n或者：\\n\\n```text\\nBufferDesc.state 中的 refcount\\n必须与 pin/unpin 操作保持一致\\n```\\n\\n或者：\\n\\n```text\\nfast-path lock 存在时，\\n一定不能同时错误地在主 LockMethodLocalHash 中形成冲突状态\\n```\\n\\n也就是说：\\n\\n\u003e **源码不是一堆代码，而是一组必须始终成立的约束。**\\n\\n---\\n\\n# 然后再往上形成“知识模型”\\n\\n于是一个源码知识章节实际上可以被抽象成：\\n\\n```text\\n                    ┌─────────────┐\\n                    │   Entity    │\\n                    └──────┬──────┘\\n                           │\\n        ┌──────────────────┼──────────────────┐\\n        ↓                  ↓                  ↓\\n    Relation             State             Lifetime\\n        │                  │                  │\\n        └──────────┬───────┴──────────┬───────┘\\n                   ↓                  ↓\\n                 Flow            Concurrency\\n                   │                  │\\n                   └────────┬─────────┘\\n                            ↓\\n                        Invariant\\n```\\n\\n这一步非常关键。\\n\\n因为以后 Agent 面对源码时，不应该直接问：\\n\\n\u003e “这个文件怎么写成 Markdown？”\\n\\n而应该先问：\\n\\n```text\\n这段源码涉及哪些 Entity？\\n它们有什么 Relation？\\n这里发生了什么 Flow？\\n对象有哪些 State？\\n生命周期是什么？\\n有哪些 Concurrency 约束？\\n核心 Invariant 是什么？\\n```\\n\\n**这才是未来 Skill 的认知骨架。**\\n\\n---\\n\\n# 第二步：拿一个真实章节验证这套模型\\n\\n我建议我们不要继续抽象太久。\\n\\n直接拿你前面已经讨论过的：\\n\\n\u003e **PostgreSQL Lock Manager / 加锁流程与 fast-path**\\n\\n作为第一个 Pilot。\\n\\n因为它同时包含：\\n\\n```text\\nEntity\\nRelation\\nFlow\\nState\\nLifetime\\nConcurrency\\nInvariant\\n```\\n\\n非常适合验证模型是否足够。\\n\\n例如同一章可以拆成：\\n\\n```text\\nLock Manager\\n│\\n├── Entity\\n│   ├── LOCKTAG\\n│   ├── LOCK\\n│   ├── PROCLOCK\\n│   ├── LOCALLOCK\\n│   └── PGPROC\\n│\\n├── Relation\\n│   ├── LOCK → PROCLOCK\\n│   ├── LOCALLOCK → LOCK\\n│   └── PGPROC → fast-path locks\\n│\\n├── Flow\\n│   └── LockAcquire()\\n│\\n├── State\\n│   └── fast-path → main table → waiting → granted\\n│\\n├── Concurrency\\n│   ├── LWLock\\n│   ├── spinlock\\n│   └── atomic state\\n│\\n└── Invariant\\n    └── lock state / local state / proc state consistency\\n```\\n\\n然后我们再看：\\n\\n\u003e **这些知识分别应该用什么图、什么文字、什么源码元素表达？**\\n\\n这才进入你前面想解决的：\\n\\n```text\\n模式识别\\n   ↓\\n选择图形/模板\\n   ↓\\n生成源码阅读笔记\\n```\\n\\n---\\n\\n# 所以我们现在的工作顺序\\n\\n我建议不要直接开始写 Skill，而是按这个顺序推进：\\n\\n```text\\nStep 1\\n定义 Source Code Knowledge Model\\n        ↓\\nStep 2\\n定义常见 Knowledge Pattern\\n        ↓\\nStep 3\\n建立 Pattern → 表达方式 映射\\n        ↓\\nStep 4\\n定义源码追踪规范\\n        ↓\\nStep 5\\n定义文档生成规范\\n        ↓\\nStep 6\\n拿 PG Lock Manager / TupleTableSlot / Buffer Manager\\n做多轮验证\\n        ↓\\nStep 7\\n把上述规范固化成 Agent Skill\\n```\\n\\n其中 **Step 1 最值得我们现在认真做**。\\n\\n我建议下一轮我们就专门做一件事：\\n\\n\u003e **把“大型 C/C++ 源码知识模型”完整定义出来：有哪些一级知识对象、二级属性、对象之间有哪些关系，以及哪些知识必须被 Agent 提取出来。**\\n\\n这个东西一旦稳定下来，后面的 Pattern、Mermaid、Markdown 和 Skill 基本都会顺很多。\",{},{\"_168\":2776,\"_175\":2844,\"_54\":2845,\"_56\":2845,\"_179\":2846,\"_181\":182,\"_183\":14,\"_184\":185,\"_186\":2847,\"_188\":189},\"c2e5a76d-0579-49a5-9c92-af4e1f4f250f\",[2762],{\"_250\":251,\"_186\":2851},1789653115.980535,{\"_245\":272,\"_179\":1459},{\"_260\":261,\"_262\":185,\"_264\":2848,\"_266\":2849,\"_268\":269,\"_207\":208,\"_209\":34,\"_210\":2789,\"_212\":213,\"_214\":2790,\"_216\":2790,\"_201\":202,\"_217\":202,\"_66\":67,\"_218\":2850,\"_220\":14,\"_221\":2842,\"_222\":2792,\"_271\":34,\"_224\":10},1789653114.7249334,1789653115.97686,[225],{},{\"_168\":2842,\"_175\":2855,\"_54\":2856,\"_56\":2856,\"_179\":2857,\"_181\":182,\"_184\":185,\"_186\":2858,\"_188\":189},\"28068bca-e87e-469f-9006-acff36efd246\",[2776],{\"_250\":251,\"_186\":2859},1789653115.420949,{\"_245\":2747,\"_2748\":306},{\"_264\":2848,\"_207\":208,\"_214\":2790,\"_216\":2790,\"_221\":2853,\"_224\":10,\"_319\":34},{},{\"_168\":2853,\"_175\":2863,\"_54\":2864,\"_56\":2864,\"_179\":2865,\"_181\":182,\"_184\":185,\"_186\":2866,\"_188\":189},\"5a80eebd-9a4f-4a3a-8254-aabebcd00773\",[2842],{\"_250\":411,\"_186\":2871},1789653115.316212,{\"_245\":246,\"_247\":2870},{\"_408\":34,\"_222\":2867,\"_201\":202,\"_337\":185,\"_289\":290,\"_264\":2848,\"_207\":208,\"_210\":2789,\"_212\":213,\"_214\":2790,\"_216\":2790,\"_217\":202,\"_66\":67,\"_218\":2868,\"_221\":2869,\"_224\":10,\"_220\":14},\"9cbefa3a-bc6f-4688-a673-d2a5cd7db120\",[225],\"77ae7f11-45e0-4621-b3f7-307a6cb59029\",[306],{},{\"_168\":2861,\"_175\":2875,\"_54\":2876,\"_56\":2876,\"_179\":2877,\"_181\":182,\"_184\":185,\"_186\":2878,\"_188\":189},\"653d8f40-4bb2-4c11-a51d-903d75a91c5c\",[2853],{\"_250\":411,\"_186\":2881},1789653115.230187,{\"_245\":246,\"_247\":2880},{\"_408\":34,\"_222\":2867,\
